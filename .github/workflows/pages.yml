name: Publicar no GitHub Pages

# Roda em qualquer push, mas só publica a partir do branch padrão do
# repositório — assim funciona tanto na main quanto antes de ela existir.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Requer o Pages já ligado em Settings → Pages, com origem "GitHub Actions":
      # o token do fluxo não tem permissão para criar o site sozinho.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
