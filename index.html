      tecla.addEventListener('click', () => responder(tecla.dataset.tecla, tecla));
    });
  };

  const novaRodada = () => {
    rodada++;
    if (rodada > rodadasTotais) {
      efeito('vitoria');
      aoTerminar(Math.max(0, acertos * Math.round(100 / rodadasTotais) - erros * 5), `${acertos} de ${rodadasTotais}`);
      return;
    }
    alvo.querySelector('#rodada').textContent = `Rodada ${rodada} de ${rodadasTotais}`;
    passo = 0;
    if (config.modo === 'escala') {
      const tonalidade = sortear(T.TONALIDADES.filter((t) => t.acidentes <= 4 && t.tipo !== 'bemol'), rnd);
      baseAtual = null;
      const notas = T.escala(tonalidade.maior).slice(0, 8);
      esperado = notas.map((n, i) => ({ ...chaveDaNota(n), oitava: i === 7 ? 5 : 4 }));
      instrucao.innerHTML = `Toque a escala de <b>${T.nomeDaNota(tonalidade.maior)} Maior</b>, do 1º ao 8º grau, seguindo T&nbsp;T&nbsp;st&nbsp;T&nbsp;T&nbsp;T&nbsp;st.`;
    } else if (config.modo === 'semitom') {
      const base = sortear(T.LETRAS, rnd);
      baseAtual = base;
      const acima = rnd() > 0.5;
      const semitom = (T.SEMITONS_DA_LETRA[T.LETRAS.indexOf(base)] + (acima ? 1 : 11)) % 12;
      esperado = [{ nome: chaveDaNota({ letra: base, alteracao: acima ? 1 : -1 }).nome, semitom, oitava: 4 }];
      esperado[0].semitom = semitom;
      instrucao.innerHTML = `Toque a tecla <b>um semitom ${acima ? 'acima' : 'abaixo'}</b> de <b>${base}</b>.`;
    } else {
      const base = sortear(T.LETRAS, rnd);
      baseAtual = base;
      const opcoes = [['2ª maior', 2], ['3ª maior', 4], ['3ª menor', 3], ['4ª justa', 5], ['5ª justa', 7], ['8ª justa', 12]];
      const [nome, distancia] = sortear(opcoes, rnd);
      const semitom = (T.SEMITONS_DA_LETRA[T.LETRAS.indexOf(base)] + distancia) % 12;
      esperado = [{ nome, semitom, oitava: distancia === 12 ? 5 : 4 }];
      instrucao.innerHTML = `Partindo de <b>${base}</b>, toque a nota que fica uma <b>${nome}</b> acima.`;
    }
    desenhar(baseAtual ? { [`${baseAtual}4`]: 'tonica' } : {});
  };

  const semitomDaTecla = (chave) => {
    const nome = chave.replace(/\d+$/, '');
    const tabela = { 'Dó': 0, 'Dó#': 1, 'Ré': 2, 'Ré#': 3, 'Mi': 4, 'Fá': 5, 'Fá#': 6, 'Sol': 7, 'Sol#': 8, 'Lá': 9, 'Lá#': 10, 'Si': 11 };
    return tabela[nome];
  };

  function responder(chave, tecla) {
    const semitom = semitomDaTecla(chave);
    const oitava = Number(chave.slice(-1));
    const alvoAtual = esperado[passo];
    const certo = semitom === alvoAtual.semitom && (config.modo !== 'escala' || oitava === alvoAtual.oitava);
    if (certo) {
      tecla.classList.add('marcada', 'certa');
      tocarFrequencia(440 * Math.pow(2, (semitom - 9 + (oitava - 4) * 12) / 12), { duracao: 0.4 });
      passo++;
      if (passo >= esperado.length) {
        acertos++;
        efeito('acerto');
        alvo.querySelector('#pontos').textContent = `${acertos} acerto${acertos === 1 ? '' : 's'}`;
        setTimeout(novaRodada, 500);
      }
    } else {
      erros++;
      efeito('erro');
      tecla.classList.add('errada');
      setTimeout(() => tecla.classList.remove('errada'), 300);
    }
  }

  novaRodada();
}

// --------------------------------------------------------------- jogo: ouvido
function jogoOuvido(config, alvo, aoTerminar) {
  const rnd = criarAleatorio(novaSemente());
  const rodadasTotais = 8;
  let rodada = 0;
  let acertos = 0;
  let resposta = null;

  const opcoes = config.modo === 'intensidade'
    ? ['crescendo', 'diminuendo', 'sempre igual']
    : ['subiu', 'desceu', 'ficou igual'];

  alvo.innerHTML = `<p class="instrucao">${config.modo === 'intensidade'
    ? 'Ouça as três notas e diga o que aconteceu com a intensidade.'
    : 'Ouça as duas notas e diga o que aconteceu com a altura.'}</p>
    <div class="placar-jogo"><span id="rodada"></span><span id="pontos">0 acertos</span></div>
    <div class="acoes-jogo"><button class="botao" id="tocar">▶ Ouvir de novo</button></div>
    <div class="botoes-notas" id="opcoes"></div>`;

  const tocar = () => {
    if (config.modo === 'intensidade') {
      const volumes = resposta === 'crescendo' ? [0.06, 0.16, 0.3] : resposta === 'diminuendo' ? [0.3, 0.16, 0.06] : [0.2, 0.2, 0.2];
      volumes.forEach((volume, i) => tocarFrequencia(frequencia('Sol', 4), { duracao: 0.45, volume, atraso: i * 0.55 }));
    } else {
      const base = inteiro(rnd, 0, 6);
      const segunda = resposta === 'ficou igual' ? base : resposta === 'subiu' ? Math.min(6, base + inteiro(rnd, 1, 4)) : Math.max(0, base - inteiro(rnd, 1, 4));
      const ajustado = segunda === base && resposta !== 'ficou igual' ? (resposta === 'subiu' ? base + 1 : base - 1) : segunda;
      tocarSequencia([
        frequencia(T.LETRAS[base], 4), frequencia(T.LETRAS[(ajustado + 7) % 7], ajustado > 6 ? 5 : ajustado < 0 ? 3 : 4),
      ], { intervalo: 0.7, duracao: 0.6 });
    }
  };

  const novaRodada = () => {
    rodada++;
    if (rodada > rodadasTotais) {
      efeito('vitoria');
      aoTerminar(Math.round((acertos / rodadasTotais) * 100), `${acertos} de ${rodadasTotais} de ouvido`);
      return;
    }
    alvo.querySelector('#rodada').textContent = `Rodada ${rodada} de ${rodadasTotais}`;
    resposta = sortear(opcoes, rnd);
    setTimeout(tocar, 350);
  };

  alvo.querySelector('#tocar').addEventListener('click', tocar);
  const caixa = alvo.querySelector('#opcoes');
  opcoes.forEach((opcao) => {
    const botao = criar(`<button class="botao-nota largo">${opcao}</button>`);
    botao.addEventListener('click', () => {
      if (opcao === resposta) { acertos++; efeito('acerto'); botao.classList.add('certo'); } else { efeito('erro'); botao.classList.add('errado'); }
      alvo.querySelector('#pontos').textContent = `${acertos} acerto${acertos === 1 ? '' : 's'}`;
      setTimeout(() => { botao.classList.remove('certo', 'errado'); novaRodada(); }, 500);
    });
    caixa.appendChild(botao);
  });

  novaRodada();
}

// ---------------------------------------------------------------- jogo: pulso
function jogoPulso(config, alvo, aoTerminar) {
  const compasso = config.compasso || '4/4';
  const porCompasso = compasso === '6/8' ? 2 : Number(compasso.split('/')[0]);
  const bpm = inteiro(criarAleatorio(novaSemente()), 60, 120);
  const metronomo = new Metronomo({ bpm, porCompasso });
  const batidas = [];
  const toques = [];
  let rodando = false;

  alvo.innerHTML = `<p class="instrucao">Ligue o metrônomo (${bpm} bpm, compasso ${compasso}) e toque no círculo junto com cada batida.
    Depois de 16 toques o app mostra a sua precisão.</p>
    <div class="placar-jogo"><span id="toques">0 toques</span><span id="desvio">—</span></div>
    <div class="acoes-jogo"><button class="botao" id="ligar">▶ Ligar metrônomo</button></div>
    <button class="alvo-pulso" id="bater">TOQUE<br><span>aqui</span></button>`;

  metronomo.aoBater = (numero, forte, quando) => {
    batidas.push(quando);
    const bola = alvo.querySelector('#bater');
    bola.classList.add(forte ? 'forte' : 'fraco');
    setTimeout(() => bola.classList.remove('forte', 'fraco'), 120);
  };

  alvo.querySelector('#ligar').addEventListener('click', (evento) => {
    rodando = !rodando;
    if (rodando) { metronomo.comecar(); evento.target.textContent = '■ Parar'; } else { metronomo.parar(); evento.target.textContent = '▶ Ligar metrônomo'; }
  });

  alvo.querySelector('#bater').addEventListener('click', () => {
    if (!rodando) return;
    const agora = (window.performance.now() / 1000);
    toques.push(agora);
    alvo.querySelector('#toques').textContent = `${toques.length} toques`;
    if (toques.length >= 16) {
      metronomo.parar();
      rodando = false;
      // Precisão medida pela regularidade dos intervalos entre os toques.
      const intervalos = toques.slice(1).map((t, i) => t - toques[i]);
      const media = intervalos.reduce((a, b) => a + b, 0) / intervalos.length;
      const desvio = intervalos.reduce((a, b) => a + Math.abs(b - media), 0) / intervalos.length;
      const bpmDoAluno = Math.round(60 / media);
      const erroBpm = Math.abs(bpmDoAluno - bpm);
      const pontos = Math.max(0, Math.round(100 - desvio * 400 - erroBpm * 3));
      alvo.querySelector('#desvio').textContent = `${bpmDoAluno} bpm`;
      efeito(pontos > 60 ? 'vitoria' : 'erro');
      aoTerminar(pontos, `você bateu a ${bpmDoAluno} bpm (o metrônomo estava em ${bpm}), com oscilação média de ${Math.round(desvio * 1000)} ms`);
    }
  });

  alvo._parar = () => metronomo.parar();
}

// ------------------------------------------------------------- jogo: armadura
function jogoArmadura(config, alvo, aoTerminar) {
  const rnd = criarAleatorio(novaSemente());
  const rodadasTotais = 8;
  let rodada = 0;
  let acertos = 0;
  let correta = '';

  alvo.innerHTML = `<p class="instrucao">Olhe a armadura e escolha a tonalidade maior correspondente.</p>
    <div class="placar-jogo"><span id="rodada"></span><span id="pontos">0 acertos</span></div>
    <div class="palco"></div><div class="botoes-notas" id="opcoes"></div>`;
  const palco = alvo.querySelector('.palco');
  const caixa = alvo.querySelector('#opcoes');

  const novaRodada = () => {
    rodada++;
    if (rodada > rodadasTotais) {
      efeito('vitoria');
      aoTerminar(Math.round((acertos / rodadasTotais) * 100), `${acertos} de ${rodadasTotais} armaduras`);
      return;
    }
    alvo.querySelector('#rodada').textContent = `Rodada ${rodada} de ${rodadasTotais}`;
    const tonalidade = sortear(T.TONALIDADES.filter((t) => t.acidentes <= 5), rnd);
    const clave = sortear(['sol', 'fa'], rnd);
    correta = T.nomeDaTonalidade(tonalidade, 'maior');
    palco.innerHTML = pentagrama({ clave, armadura: { letras: T.armaduraDe(tonalidade), tipo: tonalidade.tipo }, largura: 260 });
    const erradas = embaralhar(T.TONALIDADES.filter((t) => T.nomeDaTonalidade(t, 'maior') !== correta), rnd)
      .slice(0, 3).map((t) => T.nomeDaTonalidade(t, 'maior'));
    caixa.innerHTML = '';
    embaralhar([correta, ...erradas], rnd).forEach((opcao) => {
      const botao = criar(`<button class="botao-nota largo">${opcao}</button>`);
      botao.addEventListener('click', () => {
        if (opcao === correta) { acertos++; efeito('acerto'); botao.classList.add('certo'); } else { efeito('erro'); botao.classList.add('errado'); }
        alvo.querySelector('#pontos').textContent = `${acertos} acerto${acertos === 1 ? '' : 's'}`;
        setTimeout(novaRodada, 500);
      });
      caixa.appendChild(botao);
    });
  };

  novaRodada();
}

/**
 * Curiosidades: cartas com uma pergunta rápida e, na resposta, o porquê —
 * montadas a partir das questões já revisadas da fase.
 */
function jogoCuriosidades(config, alvo, aoTerminar) {
  const itens = (config.itens || []).filter((i) => i && i.alternativas && i.alternativas.length >= 2);
  if (!itens.length) {
    alvo.innerHTML = '<p class="instrucao">Esta fase ainda não tem questões publicadas para virar curiosidade.</p>';
    return;
  }
  const rnd = criarAleatorio(novaSemente());
  const rodadas = embaralhar(itens.slice(), rnd).slice(0, Math.min(6, itens.length));
  let atual = 0;
  let acertos = 0;

  const desenharCarta = () => {
    const item = rodadas[atual];
    alvo.innerHTML = `<p class="instrucao">Curiosidade ${atual + 1} de ${rodadas.length}</p>
      <div class="placar-jogo"><span>${acertos} acerto${acertos === 1 ? '' : 's'}</span></div>
      <article class="carta-curiosidade">
        <h3>${item.enunciado}</h3>
        <div class="alternativas-jogo"></div>
        <div class="explicacao-curiosidade" hidden></div>
      </article>`;
    const caixa = alvo.querySelector('.alternativas-jogo');
    embaralhar(item.alternativas.slice(), rnd).forEach((opcao) => {
      const botao = criar(`<button class="botao secundario">${opcao}</button>`);
      botao.addEventListener('click', () => {
        if (alvo.querySelector('.explicacao-curiosidade').hidden === false) return;
        const certo = opcao === item.correta;
        if (certo) { acertos++; efeito('acerto'); botao.classList.add('certo'); }
        else { efeito('erro'); botao.classList.add('errado'); }
        [...caixa.children].forEach((b) => { b.disabled = true; if (b.textContent === item.correta) b.classList.add('certo'); });
        const explicacao = alvo.querySelector('.explicacao-curiosidade');
        explicacao.hidden = false;
        explicacao.innerHTML = `<p><b>${certo ? 'Isso mesmo!' : 'Quase.'}</b> ${item.explicacao || ''}</p>
          <button class="botao" id="seguir">${atual + 1 < rodadas.length ? 'Próxima curiosidade' : 'Terminar'}</button>`;
        explicacao.querySelector('#seguir').addEventListener('click', () => {
          atual++;
          if (atual < rodadas.length) desenharCarta();
          else aoTerminar(Math.round((acertos / rodadas.length) * 100), `${acertos} de ${rodadas.length} certas.`);
        });
      });
      caixa.appendChild(botao);
    });
  };

  desenharCarta();
}

const JOGOS = {
  memoria: jogoMemoria,
  curiosidades: jogoCuriosidades,
  pentagrama: jogoPentagrama,
  ritmo: jogoRitmo,
  teclado: jogoTeclado,
  ouvido: jogoOuvido,
  pulso: jogoPulso,
  armadura: jogoArmadura,
};

function iniciarJogo(config, alvo, aoTerminar) {
  if (alvo._parar) { alvo._parar(); alvo._parar = null; }
  const jogo = JOGOS[config.tipo] || jogoMemoria;
  jogo(config, alvo, aoTerminar);
}

function pararJogo(alvo) {
  if (alvo && alvo._parar) { alvo._parar(); alvo._parar = null; }
}

return { iniciarJogo, pararJogo };
})();

__modulos['permissoes'] = (function () {
// Perfil de acesso (quem é o usuário no sistema) é uma coisa; nível
// pedagógico (onde o aluno está no estudo) é outra. Este módulo cuida só do
// primeiro. Nível pedagógico mora em turmas/progressão.

const PERFIS = {
  ADMINISTRADOR: 'administrador',
  ENCARREGADO: 'encarregado',
  INSTRUTOR: 'instrutor',
  ALUNO: 'aluno',
};

const PERMISSOES = {
  SISTEMA_TOTAL: 'sistema.total',

  USUARIOS_VISUALIZAR: 'usuarios.visualizar',
  USUARIOS_CRIAR: 'usuarios.criar',
  USUARIOS_EDITAR: 'usuarios.editar',
  USUARIOS_EXCLUIR: 'usuarios.excluir',

  CONTEUDO_VISUALIZAR: 'conteudo.visualizar',
  CONTEUDO_CRIAR: 'conteudo.criar',
  CONTEUDO_EDITAR: 'conteudo.editar',
  CONTEUDO_PUBLICAR: 'conteudo.publicar',

  MSA_GERENCIAR: 'msa.gerenciar',
  HINARIO_GERENCIAR: 'hinario.gerenciar',
  METODO_GERENCIAR: 'metodo.gerenciar',

  TURMA_GERENCIAR: 'turma.gerenciar',
  ALUNO_GERENCIAR: 'aluno.gerenciar',

  PROGRESSAO_GERENCIAR: 'progressao.gerenciar',

  AVALIACAO_APLICAR: 'avaliacao.aplicar',
  AVALIACAO_GERENCIAR: 'avaliacao.gerenciar',

  RELATORIO_GERAL: 'relatorio.geral',
  RELATORIO_PROPRIO: 'relatorio.proprio',

  SUGESTAO_CRIAR: 'sugestao.criar',
  SUGESTAO_GERENCIAR: 'sugestao.gerenciar',

  AUDITORIA_VISUALIZAR: 'auditoria.visualizar',

  BACKUP: 'backup',
};

const P = PERMISSOES;

const MATRIZ = {
  [PERFIS.ADMINISTRADOR]: [P.SISTEMA_TOTAL],
  [PERFIS.ENCARREGADO]: [
    P.USUARIOS_VISUALIZAR, P.USUARIOS_CRIAR, P.USUARIOS_EDITAR, P.USUARIOS_EXCLUIR,
    P.CONTEUDO_VISUALIZAR, P.CONTEUDO_CRIAR, P.CONTEUDO_EDITAR, P.CONTEUDO_PUBLICAR,
    P.MSA_GERENCIAR, P.HINARIO_GERENCIAR, P.METODO_GERENCIAR,
    P.TURMA_GERENCIAR, P.ALUNO_GERENCIAR, P.PROGRESSAO_GERENCIAR,
    P.AVALIACAO_APLICAR, P.AVALIACAO_GERENCIAR,
    P.RELATORIO_GERAL, P.RELATORIO_PROPRIO,
    P.SUGESTAO_CRIAR, P.SUGESTAO_GERENCIAR,
    P.BACKUP,
  ],
  [PERFIS.INSTRUTOR]: [
    P.CONTEUDO_VISUALIZAR,
    P.AVALIACAO_APLICAR,
    P.RELATORIO_GERAL, P.RELATORIO_PROPRIO,
    P.SUGESTAO_CRIAR,
  ],
  [PERFIS.ALUNO]: [
    P.CONTEUDO_VISUALIZAR,
    P.RELATORIO_PROPRIO,
    P.SUGESTAO_CRIAR,
  ],
};

/** O perfil tem a permissão? Quem tem sistema.total tem todas. */
function temPermissao(perfil, permissao) {
  const lista = MATRIZ[perfil] || [];
  return lista.indexOf(P.SISTEMA_TOTAL) >= 0 || lista.indexOf(permissao) >= 0;
}

/**
 * Executa a ação só se o perfil permitir. Esconder botão não é controle de
 * acesso: toda operação administrativa passa por aqui também.
 */
function executarComPermissao(perfil, permissao, acao, aoNegar) {
  if (!temPermissao(perfil, permissao)) {
    if (aoNegar) aoNegar(permissao);
    return { ok: false, erro: 'Seu perfil não tem permissão para esta operação.' };
  }
  const resultado = acao();
  return { ok: true, resultado };
}

const permissoesDoPerfil = (perfil) => (MATRIZ[perfil] || []).slice();

const rotuloDoPerfil = (perfil) => ({
  [PERFIS.ADMINISTRADOR]: 'administrador',
  [PERFIS.ENCARREGADO]: 'encarregado',
  [PERFIS.INSTRUTOR]: 'instrutor',
  [PERFIS.ALUNO]: 'aluno',
}[perfil] || perfil);

return { PERFIS, PERMISSOES, MATRIZ, temPermissao, executarComPermissao, permissoesDoPerfil, rotuloDoPerfil };
})();

__modulos['conteudo/editavel'] = (function () {
// Conteúdo cadastrado pelo encarregado: instrumentos, métodos, fases, lições
// e questões. Fica no mesmo aparelho, no armazenamento do navegador, e viaja
// por arquivo (exportar/importar) até existir um servidor.
//
// Aviso honesto sobre a senha: ela só protege o painel desta instalação, no
// navegador do próprio usuário. Não é segurança de servidor — quem tiver o
// aparelho e souber mexer no navegador alcança os dados.

const { hash } = __modulos['aleatorio'];

const CHAVE = 'msa.conteudo.v1';

// Contas de fábrica, todas com senha 123, para o sistema nunca nascer
// trancado e dar para experimentar os três perfis no mesmo aparelho.
const CONTAS_PADRAO = [
  { id: 'admin', perfil: 'administrador', nome: 'admin' },
  { id: 'enc-teste', perfil: 'encarregado', nome: 'Encarregado Teste' },
  { id: 'ins-teste', perfil: 'instrutor', nome: 'Instrutor Teste' },
  { id: 'alu-teste', perfil: 'aluno', nome: 'Aluno Teste' },
];
const SENHA_PADRAO = '123';

const contasDeFabrica = () => CONTAS_PADRAO.map((c) => ({ ...c, senha: hash(SENHA_PADRAO), padrao: true, criadoEm: null }));

const vazio = () => ({
  versao: 1,
  acesso: { contas: contasDeFabrica() },
  sessao: null,
  mostrarMsa: true,
  metodos: [],
  turmas: [],
  sugestoes: [],
});

let cache = null;

function ler() {
  if (cache) return cache;
  try {
    const bruto = localStorage.getItem(CHAVE);
    cache = bruto ? { ...vazio(), ...JSON.parse(bruto) } : vazio();
  } catch (erro) {
    cache = vazio();
  }
  cache.turmas = cache.turmas || [];
  if (cache.mostrarMsa === undefined) cache.mostrarMsa = true;
  cache.acesso = cache.acesso || {};
  // Instalação antiga (um encarregado e uma lista de instrutores): vira lista
  // única de contas, sem perder quem já estava cadastrado.
  if (!Array.isArray(cache.acesso.contas)) {
    const antigas = [];
    const enc = cache.acesso.encarregado;
    if (enc && enc.senha) antigas.push({ id: 'admin', perfil: 'encarregado', nome: enc.nome || 'admin', senha: enc.senha, padrao: Boolean(enc.padrao) });
    (cache.acesso.instrutores || []).forEach((i) => antigas.push({ ...i, perfil: 'instrutor' }));
    cache.acesso = { contas: antigas };
  }
  migrarDados(cache);
  // Repõe as contas de fábrica que faltarem (primeira abertura ou atualização).
  const existentes = new Set(cache.acesso.contas.map((c) => c.id));
  contasDeFabrica().forEach((c) => { if (!existentes.has(c.id)) cache.acesso.contas.push(c); });
  return cache;
}

function gravar() {
  try {
    localStorage.setItem(CHAVE, JSON.stringify(cache));
  } catch (erro) {
    console.warn('Não foi possível guardar o conteúdo:', erro);
  }
  if (__modulos['sincronia']) __modulos['sincronia'].aoGravar();
}

const novoId = (prefixo) => `${prefixo}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;

const VERSAO_ATUAL = 2;

/**
 * Migração de dados. Só acrescenta: nenhum conteúdo, conta ou progresso é
 * apagado aqui. Roda na leitura, antes de qualquer tela.
 */
function migrarDados(dados) {
  const de = Number(dados.versao) || 1;
  if (de >= VERSAO_ATUAL) { dados.versao = VERSAO_ATUAL; return dados; }

  // v1 -> v2: nasce o perfil administrador; a conta 'admin' sobe para ele.
  if (dados.acesso && Array.isArray(dados.acesso.contas)) {
    dados.acesso.contas.forEach((c) => {
      if (c.id === 'admin' && c.perfil === 'encarregado') c.perfil = 'administrador';
    });
  }
  // v2: níveis ganham requisitos por percentual, operador e modo de liberação;
  // matrículas ganham histórico. As faixas antigas continuam como estão.
  (dados.turmas || []).forEach((t) => {
    (t.niveis || []).forEach((n) => {
      if (!Array.isArray(n.requisitos)) n.requisitos = [];
      if (!n.operador) n.operador = 'TODOS';
      if (!n.modoLiberacao) n.modoLiberacao = 'automatico';
      (n.regras || []).forEach((r) => {
        if (!Array.isArray(r.requisitos)) r.requisitos = [];
        if (!r.operador) r.operador = 'TODOS';
      });
    });
    (t.alunos || []).forEach((a) => {
      if (!Array.isArray(a.historicoNiveis)) a.historicoNiveis = [];
      if (!a.status) a.status = 'ativo';
      if (!a.progresso) a.progresso = {};
    });
    if (!Array.isArray(t.instrutores)) t.instrutores = [];
  });

  dados.versao = VERSAO_ATUAL;
  return dados;
}

const sessao = () => ler().sessao;
const perfil = () => (ler().sessao ? ler().sessao.perfil : 'aluno');
const ehAdministrador = () => perfil() === 'administrador';
// O administrador enxerga tudo o que o encarregado enxerga, e mais.
const ehEncarregado = () => perfil() === 'encarregado' || ehAdministrador();
const temPermissao = (permissao) => __modulos['permissoes'].temPermissao(perfil(), permissao);
const executarComPermissao = (permissao, acao, aoNegar) =>
  __modulos['permissoes'].executarComPermissao(perfil(), permissao, acao, aoNegar);
const contasDeGestao = () => contas().filter((c) => c.perfil === 'administrador' || c.perfil === 'encarregado');
const ehInstrutor = () => perfil() === 'instrutor';
const contas = (perfil) => ler().acesso.contas.filter((c) => !perfil || c.perfil === perfil);
const contaPorId = (id) => ler().acesso.contas.find((c) => c.id === id) || null;
const contaAtual = () => {
  const s = ler().sessao;
  return s && s.id ? contaPorId(s.id) : null;
};
const senhaDeFabrica = () => {
  const c = contaAtual();

};
const usuarioEncarregado = () => {
  const c = contaAtual();
  return c ? c.nome : 'admin';
};

/** Troca usuário e senha da conta que está usando o painel agora. */
function atualizarEncarregado({ usuario, atual, nova }) {
  const p = ler();
  const conta = contaAtual();
  if (!conta) return { ok: false, erro: 'Entre de novo para trocar o acesso.' };
  if (conta.senha !== hash(atual || '')) return { ok: false, erro: 'A senha atual não confere.' };
  if (usuario && usuario.trim()) conta.nome = usuario.trim();
  if (nova) {
    if (nova.length < 3) return { ok: false, erro: 'A nova senha precisa de pelo menos 3 caracteres.' };
    conta.senha = hash(nova);
    conta.padrao = false;
  }
  if (p.sessao) p.sessao.nome = conta.nome;
  gravar();
  return { ok: true };
}

/** Entra numa conta. `alvo` é o id da conta ou o nome digitado. */
function entrar(alvo, senha, perfil, perfisAceitos) {
  const p = ler();
  const chave = String(alvo || '').trim().toLowerCase();
  const aceitos = perfisAceitos || (perfil ? [perfil] : null);
  const candidatas = p.acesso.contas.filter((c) => !aceitos || aceitos.indexOf(c.perfil) >= 0);
  const conta = candidatas.find((c) => c.id.toLowerCase() === chave || String(c.nome).toLowerCase() === chave);
  if (!conta) return { ok: false, erro: 'Usuário não encontrado neste perfil.' };
  if (conta.senha !== hash(senha || '')) return { ok: false, erro: 'Senha não confere.' };
  p.sessao = { perfil: conta.perfil, nome: conta.nome, id: conta.id };
  p.entradaVista = true;
  gravar();
  return { ok: true, conta };
}

/**
 * Contas vindas do servidor. Elas convivem com as locais: a conta da nuvem
 * não guarda senha aqui (quem confere é o servidor) e se reconhece pela
 * marca `nuvem`. A conta local que já virou conta de verdade lá — as duas
 * ligadas por `conta_local` — sai da lista, para a mesma pessoa não
 * aparecer duas vezes.
 */
function sincronizarContas(lista) {
  const p = ler();
  const locais = p.acesso.contas.filter((c) => !c.nuvem);
  const daNuvem = (lista || []).map((c) => ({
    id: c.id, perfil: c.perfil, nome: c.nome,
    instrumento: c.instrumento || '', contaLocal: c.conta_local || '',
    nuvem: true, senha: '',
  }));
  const migradas = new Set(daNuvem.map((c) => c.contaLocal).filter(Boolean));
  p.acesso.contas = locais.filter((c) => !migradas.has(c.id)).concat(daNuvem);
  gravar();
  return daNuvem.length;
}

/** Abre a sessão com a conta que entrou pelo servidor. */
function entrarComSessaoDaNuvem({ id, nome, perfil }) {
  const p = ler();

  p.entradaVista = true;
  gravar();
  return p.sessao;
}

function cadastrarConta(perfil, nome, senha, instrumento) {
  const p = ler();

}

const metodoPorId = (id) => ler().metodos.find((m) => m.id === id) || null;

function salvarFase(metodoId, faseId, campos) {

function excluirFase(metodoId, faseId) {

function moverFase(metodoId, faseId, passo) {
  const m = metodoPorId(metodoId);
  if (!m) return;

    f.licoes.push({ titulo: campos.titulo || 'Nova lição', pagina: campos.pagina || '', corpo: campos.corpo || '' });
  } else {
    Object.assign(f.licoes[indice], campos);
  }

}

function excluirLicao(metodoId, faseId, indice) {

// --------------------------------------------------------------- questões

function adicionarQuestoes(metodoId, faseId, lista) {
  const f = fasePorId(metodoId, faseId);
  if (!f) return 0;
  const existentes = new Set(f.questoes.map((q) => hash(q.enunciado + '|' + q.correta)));
  let entraram = 0;
  lista.forEach((q) => {
    const assinatura = hash(q.enunciado + '|' + q.correta);
    if (existentes.has(assinatura)) return;
    existentes.add(assinatura);
    f.questoes.push({ ...q, id: q.id || novoId('q'), assinatura });
    entraram++;
  });
  gravar();
  return entraram;
}

function salvarQuestao(metodoId, faseId, questaoId, campos) {
  const f = fasePorId(metodoId, faseId);
  if (!f) return;
  const q = f.questoes.find((x) => x.id === questaoId);
  if (!q) return;
  Object.assign(q, campos);
  q.assinatura = hash(q.enunciado + '|' + q.correta);
  gravar();
}

function definirStatusQuestao(metodoId, faseId, questaoId, status) {
  salvarQuestao(metodoId, faseId, questaoId, { status });
}

function aprovarTodas(metodoId, faseId) {
  const f = fasePorId(metodoId, faseId);
  if (!f) return 0;
  let n = 0;
  f.questoes.forEach((q) => { if (q.status !== 'publicada') { q.status = 'publicada'; n++; } });
  gravar();
  return n;
}

function excluirQuestao(metodoId, faseId, questaoId) {
  const f = fasePorId(metodoId, faseId);
  if (!f) return;
  f.questoes = f.questoes.filter((q) => q.id !== questaoId);
  gravar();
}

const questoesPublicadas = (metodoId, faseId) => {
  const f = fasePorId(metodoId, faseId);

};

const rascunhos = (metodoId, faseId) => {

  return f ? f.questoes.filter((q) => q.status !== 'publicada') : [];
};

function exportar() {
  const p = ler();
  return JSON.stringify({ versao: p.versao, metodos: p.metodos, sugestoes: p.sugestoes }, null, 2);
}

function importar(texto) {
  const dados = JSON.parse(texto);
  if (!dados || !Array.isArray(dados.metodos)) throw new Error('Arquivo de conteúdo inválido.');
  const p = ler();
  const existentes = new Set(p.metodos.map((m) => m.id));
  let entraram = 0;
  dados.metodos.forEach((m) => {
    if (existentes.has(m.id)) {
      const i = p.metodos.findIndex((x) => x.id === m.id);
      p.metodos[i] = m;
    } else {
      p.metodos.push(m);
    }
    entraram++;
  });
  if (Array.isArray(dados.sugestoes)) {
    const vistas = new Set(p.sugestoes.map((s) => s.id));
    dados.sugestoes.forEach((s) => { if (!vistas.has(s.id)) p.sugestoes.push(s); });
  }
  gravar();
  return entraram;
}

const msaVisivel = () => Boolean(ler().mostrarMsa);

function definirMsaVisivel(valor) {

}

/**
 * Zera o sistema para começar do zero: conteúdo, turmas e sugestões sempre;
 * contas cadastradas e o MSA embutido conforme a escolha. As contas de
 * fábrica ficam, senão ninguém entra de volta.
 */
function zerarSistema({ contas: limparContas = false, msa: esconderMsa = true } = {}) {
  const p = ler();
  p.metodos = [];
  p.turmas = [];
  p.sugestoes = [];
  if (esconderMsa) p.mostrarMsa = false;
  if (limparContas) {
    const padrao = new Set(CONTAS_PADRAO.map((c) => c.id));
    p.acesso.contas = p.acesso.contas.filter((c) => padrao.has(c.id));
  }
  gravar();
  return { ok: true };
}

function exportarTudo() {
  const p = ler();

    versao: p.versao, mostrarMsa: p.mostrarMsa,

function importarTudo(dados) {
  if (!dados || !Array.isArray(dados.metodos)) throw new Error('Backup sem conteúdo reconhecível.');
  const p = ler();
  p.metodos = dados.metodos;
  p.turmas = Array.isArray(dados.turmas) ? dados.turmas : [];
  p.sugestoes = Array.isArray(dados.sugestoes) ? dados.sugestoes : [];
  if (dados.acesso && Array.isArray(dados.acesso.contas) && dados.acesso.contas.length) p.acesso = dados.acesso;
  if (dados.mostrarMsa !== undefined) p.mostrarMsa = dados.mostrarMsa;
  migrarDados(p);
  // Garante que as contas de fábrica continuem existindo depois da restauração.
  const existentes = new Set(p.acesso.contas.map((c) => c.id));
  contasDeFabrica().forEach((c) => { if (!existentes.has(c.id)) p.acesso.contas.push(c); });
  gravar();

}

}

// ------------------------------------------------------------------ turmas
// Uma turma amarra o conteúdo (métodos e hinários, na ordem em que serão
// estudados) aos níveis de acesso. O aluno matriculado só enxerga as fases
// que o nível dele libera.

const NIVEL_VAZIO = (nome) => ({ id: novoId('niv'), nome, regras: [], requisitos: [], operador: 'TODOS', modoLiberacao: 'automatico' });

const NIVEIS_PADRAO = () => [NIVEL_VAZIO('Iniciante'), NIVEL_VAZIO('Intermediário'), NIVEL_VAZIO('Avançado')];

const turmas = () => ler().turmas;
const turmaPorId = (id) => ler().turmas.find((t) => t.id === id) || null;
const turmasLiberadas = () => ler().turmas.filter((t) => t.status === 'liberada');
const turmasEmAvaliacao = (instrumento) => ler().turmas.filter((t) => t.status === 'em-avaliacao'
  && (!instrumento || String(t.instrumento).toLowerCase() === String(instrumento).toLowerCase()));

function novaTurma({ nome = 'Nova turma', instrumento = '' } = {}) {
  const p = ler();
  const turma = {
    id: novoId('tur'),
    nome, instrumento,
    conteudos: [],
    niveis: NIVEIS_PADRAO(),
    alunos: [],
    avaliacoes: [],
    status: 'rascunho',
    criadaEm: new Date().toISOString(),
  };
  p.turmas.push(turma);
  gravar();
  return turma;
}

function salvarTurma(id, campos) {
  const t = turmaPorId(id);
  if (!t) return null;
  Object.assign(t, campos);
  gravar();
  return t;
}

function excluirTurma(id) {
  const p = ler();
  p.turmas = p.turmas.filter((t) => t.id !== id);
  gravar();
}

/** conteudos: lista de fontes na ordem de estudo. 'msa' = método embutido. */
function definirConteudos(turmaId, fontes) {
  const t = turmaPorId(turmaId);
  if (!t) return;
  t.conteudos = fontes.slice();
  // Regras que apontam para conteúdo removido deixam de fazer sentido.
  t.niveis.forEach((n) => { n.regras = n.regras.filter((r) => fontes.includes(r.fonte)); });
  gravar();
}

function moverConteudo(turmaId, fonte, passo) {
  const t = turmaPorId(turmaId);
  if (!t) return;
  const i = t.conteudos.indexOf(fonte);
  const j = i + passo;
  if (i < 0 || j < 0 || j >= t.conteudos.length) return;
  [t.conteudos[i], t.conteudos[j]] = [t.conteudos[j], t.conteudos[i]];
  gravar();
}

const nivelPorId = (turmaId, nivelId) => {
  const t = turmaPorId(turmaId);
  return t ? t.niveis.find((n) => n.id === nivelId) || null : null;
};

function salvarNivel(turmaId, nivelId, campos) {

function novoNivel(turmaId, nome) {
  const t = turmaPorId(turmaId);
  if (!t) return null;
  const nivel = { id: novoId('niv'), nome: nome || `Nível ${t.niveis.length + 1}`, regras: [], requisitos: [], operador: 'TODOS', modoLiberacao: 'automatico' };
  t.niveis.push(nivel);

}

function excluirNivel(turmaId, nivelId) {
  const t = turmaPorId(turmaId);
  if (!t) return;
  t.niveis = t.niveis.filter((n) => n.id !== nivelId);
  t.alunos = t.alunos.map((a) => (a.nivelId === nivelId ? { ...a, nivelId: null } : a));
  gravar();

/**
 * Regra de liberação: de qual conteúdo, de qual fase até qual, e se exige a
 * aprovação do nível anterior. `paginas` é só uma anotação para o aluno.
 */
function salvarRegra(turmaId, nivelId, regra) {
  const n = nivelPorId(turmaId, nivelId);
  if (!n) return { ok: false, erro: 'Nível não encontrado.' };
  if (!regra.fonte) return { ok: false, erro: 'Escolha o conteúdo.' };

  const leitor = new FileReader();
  leitor.onload = () => resolver(new Uint8Array(leitor.result));
  leitor.onerror = () => rejeitar(new Error('Não consegui ler o arquivo.'));
  leitor.readAsArrayBuffer(arquivo);
});

/** Junta os pedaços de texto de uma página do PDF em linhas legíveis. */
function linhasDaPagina(conteudo) {
  const linhas = [];
  let atual = null;
  conteudo.items.forEach((item) => {
    const y = Math.round(item.transform[5]);
    if (!atual || Math.abs(atual.y - y) > 3) {
      atual = { y, partes: [] };
      linhas.push(atual);
    }
    atual.partes.push(item.str);
  });
  return linhas.map((l) => l.partes.join(' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
}

/** Devolve { nome, paginas: [{ numero, linhas }] } para qualquer formato aceito. */
async function lerArquivo(arquivo) {

  if (/\.pdf$/i.test(nome) || arquivo.type === 'application/pdf') {
    const pdfjs = await carregarLeitorDePdf();
    const bytes = await lerBytes(arquivo);
    const documento = await pdfjs.getDocument({
      data: bytes,
      // Reforço: mesmo que a versão do pdf.js ignore o ajuste global, este
      // documento não vai despejar avisos informativos no console.
      verbosity: pdfjs.VerbosityLevel ? pdfjs.VerbosityLevel.ERRORS : 0,
    }).promise;
    const paginas = [];
    for (let n = 1; n <= documento.numPages; n++) {
      const pagina = await documento.getPage(n);
      const conteudo = await pagina.getTextContent();
      paginas.push({ numero: n, linhas: linhasDaPagina(conteudo) });
    }
    const vazias = paginas.filter((p) => !p.linhas.length).length;
    if (vazias === paginas.length) {
      throw new Error('Este PDF não tem texto — parece ser digitalizado (imagem). Passe por um OCR antes, ou cole o texto.');
    }

const deTextoColado = (texto) => ({ nome: 'texto colado', paginas: [{ numero: null, linhas: String(texto).split(/\r?\n/).map((l) => l.trim()) }] });

// ------------------------------------------------------------- heurísticas

const INICIO_DE_FASE = /^(?:cap[íi]tulo|unidade|parte|fase|m[óo]dulo|se[çc][ãa]o)\b/i;
const INICIO_DE_LICAO = /^(?:li[çc][ãa]o|aula|t[óo]pico|assunto|exerc[íi]cio)\b/i;
const RODAPE = /^(?:p[áa]g(?:ina)?\.?\s*\d+|\d+)$/i;

function ehTitulo(linha) {
  const t = linha.trim();
  if (t.length < 3 || t.length > 72) return false;
  if (RODAPE.test(t)) return false;
  if (/[.,;:!?]$/.test(t)) return false;
  if (INICIO_DE_FASE.test(t) || INICIO_DE_LICAO.test(t)) return true;
  if (/^#{1,6}\s+\S/.test(t)) return true;
  if (/^\d+\s*[.)–-]\s+\S/.test(t)) return true;
  const semAcento = t.replace(/[^A-Za-zÀ-ÿ ]/g, '');
  if (semAcento && semAcento === semAcento.toUpperCase() && t.split(' ').length <= 9) return true;
  return false;
}

const limparTitulo = (t) => t.replace(/^#{1,6}\s+/, '').replace(/\s+/g, ' ').trim();

const escaparHtml = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/** Junta as linhas soltas em parágrafos e devolve HTML simples. */
function corpoHtml(linhas) {
  const paragrafos = [];
  let atual = [];
  linhas.forEach((linha) => {
    if (!linha || RODAPE.test(linha)) {
      if (atual.length) { paragrafos.push(atual.join(' ')); atual = []; }
      return;
    }
    atual.push(linha);
    if (/[.!?]$/.test(linha) && atual.join(' ').length > 260) {
      paragrafos.push(atual.join(' ')); atual = [];
    }
  });
  if (atual.length) paragrafos.push(atual.join(' '));
  return paragrafos.filter((p) => p.trim().length > 1).map((p) => `<p>${escaparHtml(p.trim())}</p>`).join('\n');
}

/**
 * Lê o arquivo já decomposto e propõe fases e lições. Quando o documento não
 * tem títulos reconhecíveis, cai para o corte por página (PDF) ou por blocos
 * de parágrafos (texto).
 */
function estruturar(documento, { licoesPorFase = 4 } = {}) {
  const fases = [];
  let faseAtual = null;
  let licaoAtual = null;
  let achouFase = false;
  let achouLicao = false;

  const abrirFase = (titulo) => {
    faseAtual = { titulo: limparTitulo(titulo), licoes: [] };
    fases.push(faseAtual);
    licaoAtual = null;
  };
  const abrirLicao = (titulo, pagina) => {
    if (!faseAtual) abrirFase('Fase 1');
    licaoAtual = { titulo: limparTitulo(titulo), pagina: pagina ? String(pagina) : '', linhas: [] };
    faseAtual.licoes.push(licaoAtual);
  };

  documento.paginas.forEach((pagina) => {
    pagina.linhas.forEach((linha) => {
      if (!linha) { if (licaoAtual) licaoAtual.linhas.push(''); return; }
      if (ehTitulo(linha) && INICIO_DE_FASE.test(linha)) { achouFase = true; abrirFase(linha); return; }
      if (ehTitulo(linha)) { achouLicao = true; abrirLicao(linha, pagina.numero); return; }
      if (!licaoAtual) abrirLicao(pagina.numero ? `Página ${pagina.numero}` : 'Início', pagina.numero);
      licaoAtual.linhas.push(linha);
    });
  });

  // Documento sem títulos: corta por página (PDF) ou por blocos de texto.
  if (!achouLicao && !achouFase) {
    fases.length = 0;
    documento.paginas.forEach((pagina, i) => {
      const pedaços = pagina.numero ? [pagina.linhas] : blocos(pagina.linhas, 14);
      pedaços.forEach((linhas, j) => {
        if (!linhas.filter(Boolean).length) return;
        const titulo = pagina.numero ? `Página ${pagina.numero}` : `Parte ${j + 1}`;
        if (!fases.length || fases[fases.length - 1].licoes.length >= licoesPorFase) {
          fases.push({ titulo: `Fase ${fases.length + 1}`, licoes: [] });
        }
        fases[fases.length - 1].licoes.push({ titulo, pagina: pagina.numero ? String(pagina.numero) : '', linhas });
      });
    });
  } else if (!achouFase) {
    // Só lições: agrupa em fases de tamanho fixo.
    const todas = fases.flatMap((f) => f.licoes);
    fases.length = 0;
    todas.forEach((licao, i) => {
      if (i % licoesPorFase === 0) fases.push({ titulo: `Fase ${fases.length + 1}`, licoes: [] });
      fases[fases.length - 1].licoes.push(licao);
    });
  }

  const proposta = fases.map((f) => ({
    titulo: f.titulo,
    licoes: f.licoes.map((l) => ({ titulo: l.titulo, pagina: l.pagina, corpo: corpoHtml(l.linhas) }))
      .filter((l) => l.corpo.length > 40),
  })).filter((f) => f.licoes.length);

  return {
    origem: documento.nome,
    paginas: documento.paginas.length,
    fases: proposta,
    totalLicoes: proposta.reduce((s, f) => s + f.licoes.length, 0),
  };
}

function blocos(linhas, tamanho) {
  const saida = [];
  for (let i = 0; i < linhas.length; i += tamanho) saida.push(linhas.slice(i, i + tamanho));
  return saida;
}

return { lerArquivo, deTextoColado, estruturar, modoDePdf };

__modulos['progressao'] = (function () {
// Motor de progressão: transforma o que o aluno já concluiu em percentual por
// fonte de conteúdo, confere os requisitos configurados pelo encarregado e
// diz o que está liberado, o que falta e quando o aluno pode ser promovido.
//
// Percentual de conteúdo NÃO é aprovação formal: são campos separados, como
// manda a regra do projeto.

const banco = __modulos['armazenamento'];
const editavel = __modulos['conteudo/editavel'];
const { FASES, TOTAL_DE_FASES } = __modulos['conteudo/fases'];

const FONTE_MSA = 'msa';
const chaveFase = (metodoId, faseId) => `m:${metodoId}:${faseId}`;

/** Fases de uma fonte, com a chave usada no progresso do aluno. */
function fasesDaFonte(fonte) {
  if (fonte === FONTE_MSA) {
    return FASES.map((f) => ({ numero: f.numero, titulo: f.titulo, chave: f.numero }));
  }
  const m = editavel.metodoPorId(fonte);
  if (!m) return [];
  return m.fases.map((f, i) => ({ numero: i + 1, titulo: f.titulo, chave: chaveFase(m.id, f.id) }));
}

function nomeDaFonte(fonte) {
  if (fonte === FONTE_MSA) return 'MSA';
  const m = editavel.metodoPorId(fonte);
  if (!m) return fonte;
  return m.tipo === 'hinario' ? `${m.nome}${m.tonalidade ? ` — em ${m.tonalidade}` : ''}` : m.nome;
}

/**
 * Percentual de conclusão de uma fonte: fases aprovadas sobre o total de
 * fases da fonte. Conta o método inteiro, não só a faixa do nível — é assim
 * que "MSA 80%" faz sentido como régua de progressão.
 */
function calcularPercentual(contaId, fonte) {
  const fases = fasesDaFonte(fonte);
  if (!fases.length) return 0;
  const anterior = banco.contaEmUso ? banco.contaEmUso() : null;
  banco.usarConta(contaId === 'aluno' ? '' : contaId);
  const aprovadas = fases.filter((f) => banco.faseAprovada(f.chave)).length;
  if (anterior !== null) banco.usarConta(anterior);
  return Math.round((aprovadas / fases.length) * 100);
}

/** Percentual de todas as fontes da turma do aluno. */
function calcularProgresso(contaId) {
  const turma = editavel.turmaDoAluno(contaId);
  const fontes = turma ? turma.conteudos : [FONTE_MSA];
  const saida = {};
  fontes.forEach((f) => { saida[f] = calcularPercentual(contaId, f); });
  return saida;
}

/**
 * Confere uma lista de requisitos contra o progresso. operador 'TODOS' exige
 * todos; 'QUALQUER' basta um.
 */
function verificarRequisitos(requisitos, progresso, operador = 'TODOS') {
  const lista = (requisitos || []).map((r) => {
    const atual = progresso[r.fonte] !== undefined ? progresso[r.fonte] : 0;
    const necessario = Number(r.percentualMinimo) || 0;
    return { fonte: r.fonte, nome: nomeDaFonte(r.fonte), necessario, atual, falta: Math.max(0, necessario - atual), ok: atual >= necessario };
  });
  if (!lista.length) return { ok: true, detalhes: [], faltas: [] };
  const ok = operador === 'QUALQUER' ? lista.some((x) => x.ok) : lista.every((x) => x.ok);
  return { ok, detalhes: lista, faltas: lista.filter((x) => !x.ok) };
}

/**
 * Este conteúdo está liberado para o aluno? Devolve também o que falta, para
 * a tela de bloqueio explicar em vez de só trancar.
 */
function verificarLiberacao(contaId, fonte) {
  const turma = editavel.turmaDoAluno(contaId);
  const nivel = editavel.nivelDoAluno(contaId);
  if (!turma || !nivel) return { liberado: true, motivo: 'sem turma', detalhes: [], faltas: [] };
  const regra = nivel.regras.find((r) => r.fonte === fonte);
  if (!regra) {
    return { liberado: false, motivo: 'fora-do-nivel', detalhes: [], faltas: [],
      texto: `Este conteúdo não faz parte do nível ${nivel.nome}.` };
  }
  const progresso = calcularProgresso(contaId);
  const conferencia = verificarRequisitos(regra.requisitos, progresso, regra.operador || 'TODOS');

  // Regra antiga (exigeAnterior) continua valendo: conteúdo anterior da turma
  // precisa estar concluído na faixa do nível.
  let anteriorOk = true;
  if (regra.exigeAnterior) {
    const indice = turma.conteudos.indexOf(fonte);
    const anterior = indice > 0 ? turma.conteudos[indice - 1] : null;
    const regraAnterior = anterior ? nivel.regras.find((r) => r.fonte === anterior) : null;
    if (regraAnterior) {
      const fases = fasesDaFonte(anterior).filter((x) => x.numero >= regraAnterior.de && x.numero <= regraAnterior.ate);
      anteriorOk = fases.every((x) => banco.faseAprovada(x.chave));
    }
  }

  return {
    liberado: conferencia.ok && anteriorOk,
    motivo: conferencia.ok ? (anteriorOk ? '' : 'conteudo-anterior') : 'requisitos',
    detalhes: conferencia.detalhes,
    faltas: conferencia.faltas,
    progresso,
  };
}

/** O aluno já cumpre os requisitos para o próximo nível da turma? */
function verificarPromocao(contaId) {
  const turma = editavel.turmaDoAluno(contaId);
  const nivel = editavel.nivelDoAluno(contaId);
  if (!turma || !nivel) return { elegivel: false, proximo: null, faltas: [] };
  const indice = turma.niveis.findIndex((n) => n.id === nivel.id);
  const proximo = turma.niveis[indice + 1] || null;
  if (!proximo) return { elegivel: false, proximo: null, faltas: [], motivo: 'ultimo-nivel' };
  // Nível sem requisitos configurados não promove ninguém sozinho: promoção
  // automática precisa de uma régua, senão o aluno saltaria a turma inteira.
  if (!(proximo.requisitos || []).length) {
    return { elegivel: false, proximo, motivo: 'sem-requisitos', modoLiberacao: proximo.modoLiberacao || 'automatico', detalhes: [], faltas: [] };
  }
  const progresso = calcularProgresso(contaId);
  const conferencia = verificarRequisitos(proximo.requisitos, progresso, proximo.operador || 'TODOS');
  return {
    elegivel: conferencia.ok,
    proximo,
    modoLiberacao: proximo.modoLiberacao || 'automatico',
    detalhes: conferencia.detalhes,
    faltas: conferencia.faltas,
  };
}

/**
 * Promove o aluno para o próximo nível, guardando o histórico. Quando o nível
 * exige aval humano, só promove se `porQuem` disser quem autorizou.
 */
function promoverAluno(contaId, { porQuem = 'automatico', observacao = '', motivo = '' } = {}) {
  const turma = editavel.turmaDoAluno(contaId);
  const analise = verificarPromocao(contaId);
  if (!turma || !analise.proximo) return { ok: false, erro: 'Não há próximo nível nesta turma.' };
  if (!analise.elegivel) return { ok: false, erro: 'O aluno ainda não cumpre os requisitos do próximo nível.' };
  const modo = analise.modoLiberacao;
  if (modo !== 'automatico' && porQuem === 'automatico') {
    return { ok: false, erro: `A promoção neste nível depende de aprovação (${modo}).` };
  }
  const nivelAtual = editavel.nivelDoAluno(contaId);
  const r = editavel.promover(turma.id, contaId, analise.proximo.id, {
    de: nivelAtual ? nivelAtual.nome : '',
    para: analise.proximo.nome,
    progresso: calcularProgresso(contaId),
    porQuem, observacao, motivo,
  });
  return r;
}

return {
  FONTE_MSA, fasesDaFonte, nomeDaFonte,
  calcularPercentual, calcularProgresso, verificarRequisitos,
  verificarLiberacao, verificarPromocao, promoverAluno,
};
})();

const ACOES = {
  LOGIN: 'LOGIN', LOGOUT: 'LOGOUT',
  CRIAR_USUARIO: 'CRIAR_USUARIO', EDITAR_USUARIO: 'EDITAR_USUARIO', EXCLUIR_USUARIO: 'EXCLUIR_USUARIO',

  CRIAR_REGRA: 'CRIAR_REGRA', ALTERAR_REGRA: 'ALTERAR_REGRA',
  MATRICULAR_ALUNO: 'MATRICULAR_ALUNO', ALTERAR_NIVEL: 'ALTERAR_NIVEL',
  APROVAR_ALUNO: 'APROVAR_ALUNO', LIBERAR_CONTEUDO: 'LIBERAR_CONTEUDO',
  CRIAR_QUESTAO: 'CRIAR_QUESTAO', PUBLICAR_QUESTAO: 'PUBLICAR_QUESTAO',
  IMPORTAR_CONTEUDO: 'IMPORTAR_CONTEUDO', EXPORTAR_BACKUP: 'EXPORTAR_BACKUP', IMPORTAR_BACKUP: 'IMPORTAR_BACKUP',
  ZERAR_SISTEMA: 'ZERAR_SISTEMA',
};

let cache = null;

function ler() {
  if (cache) return cache;
  try {
    const bruto = localStorage.getItem(CHAVE);
    cache = bruto ? JSON.parse(bruto) : [];
  } catch (erro) {
    cache = [];
  }
  if (!Array.isArray(cache)) cache = [];
  return cache;
}

function gravar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(cache)); } catch (erro) { /* sem espaço: segue sem auditar */ }
}

function registrar(acao, { entidade = '', entidadeId = '', detalhes = '' } = {}) {
  const sessao = __modulos['conteudo/editavel'].sessao();
  const lista = ler();
  lista.push({
    id: `aud-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
    usuarioId: sessao ? sessao.id : null,
    usuarioNome: sessao ? sessao.nome : 'sem sessão',
    perfil: sessao ? sessao.perfil : 'anônimo',
    acao, entidade, entidadeId, detalhes,
    data: new Date().toISOString(),
  });

function importar(lista) {
  if (!Array.isArray(lista)) return 0;
  const vistos = new Set(ler().map((r) => r.id));
  let entraram = 0;
  lista.forEach((r) => { if (r && r.id && !vistos.has(r.id)) { cache.push(r); entraram++; } });
  cache.sort((a, b) => String(a.data).localeCompare(String(b.data)));
  if (cache.length > LIMITE) cache.splice(0, cache.length - LIMITE);
  gravar();
  return entraram;
}

return { ACOES, registrar, registros, todos, importar };

  const alvoTexto = semAcento(String(texto || '').slice(0, 20000));
  let melhor = null;
  catalogo().forEach((inst) => {
    let pontos = 0;
    inst.chaves.forEach((chave) => {
      const c = semAcento(chave);
      if (alvoNome.includes(c)) pontos += 12;
      const ocorrencias = alvoTexto.split(c).length - 1;
      pontos += Math.min(ocorrencias, 10);
    });
    if (pontos > 0 && (!melhor || pontos > melhor.pontos)) melhor = { instrumento: inst, pontos };
  });
  return melhor ? { ...melhor.instrumento, confianca: melhor.pontos } : null;
}

return { catalogo, porId, acrescentar, detectar };

__modulos['cursos'] = (function () {
// Cursos gerados a partir de documentos. Guardados à parte do conteúdo
// editável: publicar é que transforma o curso em método do sistema, usando a
// estrutura de fases, lições, questões e jogos que já existe.

const CHAVE = 'msa.cursos.v1';

const ESTADOS = { RASCUNHO: 'RASCUNHO', EM_ANALISE: 'EM_ANALISE', APROVADO: 'APROVADO', PUBLICADO: 'PUBLICADO', ARQUIVADO: 'ARQUIVADO' };

let cache = null;

function ler() {
  if (cache) return cache;
  try {
    const bruto = localStorage.getItem(CHAVE);
    cache = bruto ? JSON.parse(bruto) : [];
  } catch (erro) { cache = []; }
  if (!Array.isArray(cache)) cache = [];
  return cache;
}

function gravar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(cache)); } catch (erro) { console.warn('Não guardou os cursos:', erro); }
}

const lista = () => ler().slice().reverse();
const porId = (id) => ler().find((c) => c.id === id) || null;

function guardar(curso) {
  const atual = ler();
  const i = atual.findIndex((c) => c.id === curso.id);
  if (i >= 0) atual[i] = curso; else atual.push(curso);
  gravar();
  return curso;
}

function excluir(id) {
  cache = ler().filter((c) => c.id !== id);
  gravar();
}

/**
 * Nova versão de um curso já existente: o conteúdo anterior não é apagado,
 * fica guardado em `versoes` com os documentos que o geraram.
 */
function versionar(cursoAntigo, cursoNovo, criadoPor) {
  const versoes = cursoAntigo.versoes || [];
  versoes.push({
    versao: cursoAntigo.metadados.versao,
    data: cursoAntigo.metadados.dataCriacao,
    documentosUtilizados: cursoAntigo.documentos.map((d) => d.nomeArquivo),
    fases: cursoAntigo.fases,
    criadoPor: cursoAntigo.metadados.criadoPor || '',
  });
  cursoNovo.id = cursoAntigo.id;
  cursoNovo.versoes = versoes;
  cursoNovo.metadados.versao = (Number(cursoAntigo.metadados.versao) || 1) + 1;
  cursoNovo.metadados.criadoPor = criadoPor || '';
  cursoNovo.alteracoes = [`Regerado a partir de ${cursoNovo.documentos.length} documento(s).`];
  return guardar(cursoNovo);
}

function definirEstado(id, estado) {
  const c = porId(id);
  if (!c) return null;
  c.status = estado;
  gravar();
  return c;
}

return { ESTADOS, lista, porId, guardar, excluir, versionar, definirEstado };

const TITULO = /^(?:cap[íi]tulo|unidade|parte|li[çc][ãa]o|aula|exerc[íi]cio|estudo)\b.{0,60}$/i;

/** Ficha de um documento já lido (formato do módulo importador). */
function analisarDocumento(documento) {
  const paginas = documento.paginas || [];
  const textoTodo = paginas.map((p) => (p.linhas || []).join(' ')).join('\n');
  const assuntos = [];
  const capitulos = [];
  const vistos = new Set();

  paginas.forEach((pagina) => {
    const numero = pagina.numero;
    const linhas = pagina.linhas || [];
    const plano = semAcento(linhas.join(' '));
    linhas.forEach((linha) => {
      if (TITULO.test(linha.trim()) && capitulos.length < 60) {
        capitulos.push({ titulo: linha.trim(), pagina: numero });
      }
    });
    if (plano.replace(/\s/g, '').length < 30) return;
    FORMAS.forEach(({ termo, formas }) => {
      if (vistos.has(termo)) return;
      if (formas.some((f) => new RegExp(`\\b${f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`).test(plano))) {
        vistos.add(termo);
        assuntos.push({ termo, pagina: numero, eixo: V[termo][1] });
      }
    });
  });

  const caracteres = textoTodo.replace(/\s/g, '').length;
  const portugues = (textoTodo.match(/\b(de|para|com|que|não|uma|pelo|dedo|mão|som)\b/gi) || []).length;
  const ingles = (textoTodo.match(/\b(the|and|with|for|string|exercise|lesson)\b/gi) || []).length;

  return {
    id: `doc-${hash(documento.nome + paginas.length)}`,
    nomeArquivo: documento.nome,
    tipo: /apostila/i.test(documento.nome) ? 'apostila' : 'metodo',
    autor: '',
    metodo: documento.nome.replace(/\.[a-z]+$/i, ''),
    instrumento: (instrumentos.detectar(documento.nome, textoTodo) || {}).id || null,
    edicao: '', ano: '',
    idioma: ingles > portugues ? 'en' : (portugues ? 'pt' : 'indefinido'),
    numeroPaginas: paginas.length,
    caracteresDeTexto: caracteres,
    assuntos, capitulos,
    midias: [],
    referencias: [],
    semTexto: caracteres < 200,
  };
}

/** Junta as fichas num índice só, sem repetir assunto e guardando as fontes. */
function indiceGeral(fichas) {
  const assuntos = new Map();
  fichas.forEach((ficha) => {
    ficha.assuntos.forEach((a) => {
      const atual = assuntos.get(a.termo) || { termo: a.termo, eixo: a.eixo, fontes: [] };
      atual.fontes.push({ documento: ficha.nomeArquivo, pagina: a.pagina });
      assuntos.set(a.termo, atual);
    });
  });
  const detectados = fichas.map((f) => f.instrumento).filter(Boolean);
  const contagem = {};
  detectados.forEach((i) => { contagem[i] = (contagem[i] || 0) + 1; });
  const instrumento = Object.keys(contagem).sort((a, b) => contagem[b] - contagem[a])[0] || null;
  return {
    instrumento,
    documentos: fichas,
    assuntos: [...assuntos.values()],
    semTexto: fichas.filter((f) => f.semTexto).map((f) => f.nomeArquivo),
  };
}

function perguntasDoGrupo(termos, fontesDe, rnd, universo) {
  const saida = [];
  const banco = (universo && universo.length >= 4) ? universo : termos;
  if (banco.length < 4) return saida;
  termos.forEach((termo) => {
    const definicao = V[termo][0];
    // Alternativas erradas saem de todos os assuntos do curso: com poucos
    // assuntos por fase, tirar só do grupo deixaria a pergunta sem opções.
    const outros = embaralhar(banco.filter((t) => t !== termo), rnd);
    const fonte = fontesDe(termo);
    const referencia = fonte ? `${fonte.documento} — pág. ${fonte.pagina}` : 'conteúdo complementar';
    const explicacao = `${termo.charAt(0).toUpperCase()}${termo.slice(1)}: ${definicao}.`;
    const base = { explicacao, referencia, fonte: fonte ? fonte.documento : '', pagina: fonte ? fonte.pagina : null, origem: ORIGEM.COMPLEMENTAR, status: 'rascunho' };
    const defs = outros.slice(0, 3).map((t) => V[t][0]);
    if (defs.length >= 2) {
      saida.push({ ...base, id: `q-${hash('def' + termo + referencia)}`, assinatura: hash('def' + termo + referencia),
        enunciado: `O que é ${termo}?`, alternativas: embaralhar([definicao, ...defs], rnd), correta: definicao });
    }
    const nomes = outros.slice(0, 3);
    if (nomes.length >= 2) {
      saida.push({ ...base, id: `q-${hash('nome' + termo + referencia)}`, assinatura: hash('nome' + termo + referencia),
        enunciado: `A que corresponde esta definição: "${definicao}"?`, alternativas: embaralhar([termo, ...nomes], rnd), correta: termo });
    }
    if (fonte) {
      const paginas = [fonte.pagina, fonte.pagina + 3, Math.max(1, fonte.pagina - 4), fonte.pagina + 9].map(String);
      const unicas = [...new Set(paginas)];
      if (unicas.length >= 3) {
        saida.push({ ...base, origem: ORIGEM.FONTE_DOCUMENTO,
          id: `q-${hash('pag' + termo + referencia)}`, assinatura: hash('pag' + termo + referencia),
          enunciado: `Em que página de "${fonte.documento}" o método apresenta ${termo}?`,
          alternativas: embaralhar(unicas, rnd), correta: String(fonte.pagina),
          explicacao: `O assunto aparece na página ${fonte.pagina} do documento.` });
      }
    }
  });
  return saida;
}

// offline dão sempre no mesmo resultado, sem ninguém decidir nada.
//
// Conteúdo do painel é diferente: publicar substitui o que está no banco,
// removidos inclusive. Por isso só sobe quando o encarregado manda, nunca
// sozinho — e, pelo mesmo motivo, o app não baixa conteúdo por cima do
// painel de quem está cadastrando.

const banco = __modulos['armazenamento'];
const editavel = __modulos['conteudo/editavel'];

let recado = '';
let aplicando = false;      // evita que gravar o que veio do banco peça outra subida
let agendado = null;
const ouvintes = [];

function definir(novo, texto) {
  estado = novo;
  recado = texto || '';
  ouvintes.forEach((f) => { try { f(situacao()); } catch (erro) { /* um ouvinte ruim não derruba os outros */ } });
}

function situacao() {
  return {
    estado, recado,
    configurada: nuvem.configurada(),
    usuario: nuvem.usuario(),
    online: navigator.onLine !== false,
  };
}

const aoMudar = (f) => { ouvintes.push(f); };

const ligada = () => nuvem.configurada() && Boolean(nuvem.usuario());
const ehGestao = () => {
  const u = nuvem.usuario();
  return Boolean(u && (u.perfil === 'encarregado' || u.perfil === 'administrador'));
};

/** Chamado toda vez que o app grava algo no aparelho. */
function aoGravar() {

  // cada resposta, e não faz sentido uma viagem à rede por clique.
  agendado = setTimeout(() => { enviarProgresso().catch(() => {}); }, 2500);
}

// --------------------------------------------------------------- progresso

async function enviarProgresso() {
  if (!ligada()) return { ok: false, erro: 'Entre na sua conta para sincronizar.' };
  if (navigator.onLine === false) { definir('fora', 'Sem internet: o progresso sobe quando a rede voltar.'); return { ok: false, erro: recado }; }
  try {
    definir('sincronizando', 'Guardando o progresso…');
    const local = JSON.parse(banco.exportar());
    const juntado = await nuvem.chamar('sincronizar_progresso', { dados: local });

    // Os itens vão depois, e nunca antes: cada um se prende a uma tentativa,
    // que precisa já existir no servidor. Reenviar não duplica.
    const itens = __modulos['relatorio'].itensParaEnviar();
    if (itens.length) {
      try { await nuvem.chamar('sincronizar_itens', { dados: itens }); }
      catch (erro) { /* o placar já subiu; o detalhe tenta de novo na próxima */ }
    }

    if (juntado && typeof juntado === 'object') {
      aplicando = true;
      try { banco.importar(JSON.stringify(juntado)); } finally { aplicando = false; }
    }
    definir('ok', `Progresso guardado ${agora()}.`);
    return { ok: true };
  } catch (erro) {
    definir('erro', erro.message || 'Não deu para guardar agora.');
    return { ok: false, erro: recado };
  }
}

/**
 * Traz o conteúdo do banco para este aparelho.
 *
 * Em automático, pula quem cuida do painel: baixar substitui métodos e
 * turmas locais, e apagar sem querer o que ainda não foi publicado seria
 * pior do que ficar um dia desatualizado.
 */
async function baixarConteudo({ automatico = false } = {}) {
  if (!ligada()) return { ok: false, erro: 'Entre na sua conta.' };
  if (automatico && ehGestao()) return { ok: false, motivo: 'painel' };
  try {
    definir('sincronizando', 'Buscando o conteúdo…');
    const contas = await nuvem.perfis();
    const conteudo = await nuvem.chamar('meu_conteudo', {});
    aplicando = true;
    try {
      if (Array.isArray(contas)) editavel.sincronizarContas(contas);
      if (conteudo && Array.isArray(conteudo.metodos)) editavel.importarTudo(conteudo);
    } finally { aplicando = false; }
    definir('ok', `Conteúdo atualizado ${agora()}.`);
    return { ok: true };
  } catch (erro) {
    definir('erro', erro.message || 'Não deu para buscar o conteúdo.');
    return { ok: false, erro: recado };
  }
}

/** Sobe o conteúdo deste aparelho, substituindo o que está no banco. */
async function publicarConteudo() {
  if (!ligada()) return { ok: false, erro: 'Entre na sua conta.' };
  if (!ehGestao()) return { ok: false, erro: 'Só o encarregado ou o administrador publica conteúdo.' };
  try {
    definir('sincronizando', 'Publicando o conteúdo…');
    const local = JSON.parse(editavel.exportarTudo());
    // As contas locais não sobem: no banco quem manda são as contas de
    // verdade, com senha verificada pelo servidor.
    delete local.acesso;
    const volta = await nuvem.chamar('publicar_conteudo', { dados: local });
    const avisos = (volta && volta.avisos) || [];
    definir('ok', avisos.length ? `Publicado com ressalvas: ${avisos.join(' · ')}` : `Conteúdo publicado ${agora()}.`);
    return { ok: true, avisos };
  } catch (erro) {
    definir('erro', erro.message || 'Não deu para publicar.');
    return { ok: false, erro: recado };
  }
}

// ------------------------------------------------------------------ rotina

const agora = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

/** Houve estudo de verdade aqui, ou é só a estrutura vazia das fases? */
const temEstudo = (p) => Boolean(p && (
  (p.xp || 0) > 0
  || (p.certificados || []).length
  || Object.keys(p.fases || {}).some((chave) => {

/**
 * Passa a usar a conta do servidor, levando junto o que já tinha sido

 * Quem estuda primeiro e cria conta depois é o caso comum — e sem isto o

async function adotarConta(perfilDaNuvem, progressoAnterior) {

  prepararProva(numeroFase);
  const rota = `#/fase/${numeroFase}/prova`;
  if (window.location.hash === rota) desenhar();
  else ir(rota);
}

function telaProva(numeroFase) {
  if (!provaEmCurso || provaEmCurso.modo !== 'msa' || provaEmCurso.fase !== numeroFase) prepararProva(numeroFase);
  const prova = provaEmCurso;
  if (prova.atual >= prova.questoes.length) return telaResultado(numeroFase);

  const q = prova.questoes[prova.atual];
  const f = faseNumero(numeroFase);
  return `${cabecalho(`Avaliação — Fase ${numeroFase}`, `#/fase/${numeroFase}`)}
    <div class="progresso-prova"><span style="width:${(prova.atual / prova.questoes.length) * 100}%"></span></div>
    <p class="contador">Questão ${prova.atual + 1} de ${prova.questoes.length}</p>
    ${prova.reciclou && prova.atual === 0 ? '<p class="aviso leve">Você já respondeu todas as perguntas inéditas desta fase. A partir de agora o app volta a usar as mais antigas.</p>' : ''}
    <article class="questao" style="--cor:${f.cor}">
      <h2>${q.enunciado}</h2>
      ${q.html ? `<div class="ilustracao">${q.html}</div>` : ''}
      <div class="alternativas">
        ${q.alternativas.map((a, i) => `<button class="alternativa" data-alternativa="${escapar(a)}">
          <span class="letra">${'ABCDE'[i] || i + 1}</span><span>${escapar(a)}</span></button>`).join('')}
      </div>
      <div class="retorno" hidden></div>
    </article>`;
}

function responder(texto, botao) {
  const prova = provaEmCurso;
  const q = prova.questoes[prova.atual];
  if (prova.respostas[prova.atual] !== undefined) return;
  prova.respostas[prova.atual] = texto;
  const certa = texto === q.correta;
  document.querySelectorAll('.alternativa').forEach((b) => {
    b.disabled = true;
    if (b.dataset.alternativa === q.correta) b.classList.add('certa');
  });
  if (!certa) botao.classList.add('errada');
  efeito(certa ? 'acerto' : 'erro');
  const retorno = document.querySelector('.retorno');
  retorno.hidden = false;
  retorno.innerHTML = `<p class="${certa ? 'ok' : 'nao'}">${certa ? 'Isso mesmo!' : `Resposta certa: <b>${q.correta}</b>`}</p>
    <p>${q.explicacao}</p><p class="mini">${q.referencia}</p>
    <button class="botao" data-acao="proxima">${prova.atual + 1 < prova.questoes.length ? 'Próxima questão' : 'Ver resultado'}</button>`;
  retorno.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/**
 * Detalhe de cada questão da prova, para o relatório saber em que assunto o
 * aluno tropeça — e não só que a nota foi 60. O id vem do aparelho porque é
 * ele que impede a mesma tentativa de entrar duas vezes no servidor.
 */
function itensDaCorrecao(resultado) {
  return resultado.detalhes.map((d, i) => ({
    indice: i,
    assunto: d.questao.geradorId || '',
    certa: Boolean(d.certa),
  })).filter((item) => item.assunto);
}

const novaTentativaId = () => `ten-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;

function telaResultado(numeroFase) {
  const prova = provaEmCurso;
  const resultado = corrigir(prova, prova.respostas);
  const f = faseNumero(numeroFase);

  if (!prova.registrada) {
    prova.registrada = true;
    banco.registrarUsadas(numeroFase, prova.questoes.map((q) => q.assinatura));
    banco.registrarTentativa(numeroFase, {
      id: novaTentativaId(),
      data: new Date().toISOString(), acertos: resultado.acertos, total: resultado.total,
      nota: resultado.nota, aprovado: resultado.aprovado, semente: prova.semente,
      itens: itensDaCorrecao(resultado),
    });
    if (resultado.aprovado) {
      const certificado = montarCertificado({
        nome: banco.progresso().aluno.nome, fase: numeroFase, nota: resultado.nota,
        acertos: resultado.acertos, total: resultado.total,
      });
      banco.guardarCertificado(certificado);
      efeito('vitoria');
    }
  }

  const erradas = resultado.detalhes.filter((d) => !d.certa);
  return `${cabecalho('Resultado', `#/fase/${numeroFase}`)}
    <section class="resultado ${resultado.aprovado ? 'aprovado' : 'reprovado'}" style="--cor:${f.cor}">
      <div class="nota">${resultado.nota}%</div>
      <strong>${resultado.aprovado ? 'Fase concluída!' : 'Ainda não desta vez'}</strong>
      <p>${resultado.acertos} de ${resultado.total} questões certas. A aprovação é a partir de ${NOTA_MINIMA}%.</p>
      ${resultado.aprovado
        ? `<a class="botao grande" data-ir="#/certificado/${numeroFase}">🏅 Ver o certificado</a>
           ${numeroFase < TOTAL_DE_FASES ? `<a class="botao secundario" data-ir="#/fase/${numeroFase + 1}">Ir para a fase ${numeroFase + 1}</a>` : '<p>Você concluiu todas as fases do método. Parabéns!</p>'}`
        : `<button class="botao grande" data-acao="iniciar-prova" data-fase="${numeroFase}">Tentar de novo (perguntas novas)</button>
           <a class="botao secundario" data-ir="#/fase/${numeroFase}">Rever as lições</a>`}
    </section>
    ${erradas.length ? `<h3 class="titulo-secao">O que revisar</h3>
      <div class="revisao">${erradas.map((d) => `<div class="item-revisao">
        <p class="pergunta">${d.questao.enunciado}</p>
        <p class="sua">Sua resposta: <b>${d.resposta ?? '—'}</b></p>
        <p class="certa">Certa: <b>${d.questao.correta}</b></p>
        <p class="mini">${d.questao.explicacao} <i>${d.questao.referencia}</i></p>
      </div>`).join('')}</div>` : ''}`;
}

/**
 * Barras do assunto mais difícil para o menos.
 *
 * A escala é sempre 0 a 100%, nunca o maior valor da lista: encolher o eixo
 * para caber faria 12% de erro parecer catástrofe. Quando tudo está fácil, as
 * barras ficam curtas mesmo — e é isso que se quer ler.
 *
 * O primeiro lugar é marcado por escrito, não por cor: destaque que só existe
 * na cor some para quem não distingue as duas.
 */
function graficoDeDificuldade(itens) {
  if (!itens.length) return '';
  return `<ol class="barras">
    ${itens.map((a, i) => `<li>
      <div class="rotulo">
        <span class="nome">${escapar(a.nome)}</span>
        <span class="fase">${a.fase ? `Fase ${a.fase}` : 'Método cadastrado'}${i === 0 ? ' · mais difícil' : ''}</span>
      </div>
      <div class="valor"><strong>${a.pctErro}%</strong><small>${a.erradas} de ${a.total}</small></div>
      <div class="trilho" title="${escapar(a.nome)} — ${a.erradas} erro${a.erradas === 1 ? '' : 's'} em ${a.total} questões">
        <span class="barra" style="width:${a.pctErro === 0 ? 0 : Math.max(1.5, a.pctErro)}%"></span>
      </div>
    </li>`).join('')}
  </ol>
  <p class="mini legenda-grafico">Cada barra é a parte errada das questões daquele assunto, de 0 a 100%.</p>`;
}

function corpoDoRelatorio(dados, { turma = false } = {}) {
  const r = dados.resumo;
  if (!r.questoes) {
    return `<p class="aviso">${turma
      ? 'Nenhuma avaliação foi feita ainda. Conforme os alunos forem fazendo as provas, o relatório se enche sozinho.'
      : 'Você ainda não fez nenhuma avaliação. Faça a prova de uma fase e o resultado aparece aqui.'}</p>`;
  }

  const quem = turma
    ? `${dados.alunos} aluno${dados.alunos === 1 ? '' : 's'} · ${r.provas} prova${r.provas === 1 ? '' : 's'}`
    : `${r.provas} prova${r.provas === 1 ? '' : 's'} feita${r.provas === 1 ? '' : 's'}`;

  return `
    <section class="painel-numeros">
      <div class="numero-grande"><strong>${r.aproveitamento}%</strong><span>aproveitamento</span></div>
      <div class="numero-grande"><strong>${r.acertos}</strong><span>acertos</span></div>
      <div class="numero-grande"><strong>${r.erros}</strong><span>erros</span></div>
    </section>
    <p class="mini centro">${quem} · ${r.questoes} questões respondidas</p>

    ${dados.maisDificil ? `
      <h3 class="titulo-secao">Tema com maior dificuldade</h3>
      <div class="destaque-dificil">
        <strong>${escapar(dados.maisDificil.nome)}</strong>
        <p class="mini">${dados.maisDificil.fase ? `Fase ${dados.maisDificil.fase} · ` : ''}${dados.maisDificil.pctErro}% de erro
        — ${dados.maisDificil.erradas} de ${dados.maisDificil.total} questões${turma && dados.maisDificil.alunos
          ? `, em ${dados.maisDificil.alunos} aluno${dados.maisDificil.alunos === 1 ? '' : 's'}` : ''}.</p>
      </div>` : ''}

    ${dados.porAssunto.length ? `
      <h3 class="titulo-secao">Erro por assunto</h3>
      ${graficoDeDificuldade(dados.porAssunto)}` : `
      <h3 class="titulo-secao">Erro por assunto</h3>
      <p class="mini">Ainda não há questões suficientes por assunto para comparar. Cada assunto entra
      na lista a partir de ${relatorio.MINIMO_PARA_RANQUEAR} questões respondidas — antes disso o
      percentual diria mais sobre o acaso do que sobre a dificuldade.</p>`}

    ${dados.poucoDado.length ? `
      <h4 class="titulo-secao">Ainda com poucas respostas</h4>
      <p class="mini">Aparecem aqui, sem posição, até chegarem a ${relatorio.MINIMO_PARA_RANQUEAR} questões.</p>
      <ul class="lista-simples">
        ${dados.poucoDado.map((a) => `<li>${escapar(a.nome)} — ${a.erradas} erro${a.erradas === 1 ? '' : 's'} em ${a.total}</li>`).join('')}
      </ul>` : ''}

    <h3 class="titulo-secao">Por fase</h3>
    <div class="rolagem-tabela">
      <table class="tabela">
        <thead><tr><th>Fase</th><th>Provas</th><th>Acertos</th><th>Erros</th><th>Aprov.</th></tr></thead>
        <tbody>
          ${dados.porFase.map((f) => {
            // "Fase 6 — Escalas maiores e armaduras" em duas linhas: o número
            // nunca quebra, e o título vai miúdo embaixo.
            const partes = String(f.titulo).split(' — ');
            return `<tr>
            <td><strong>${escapar(partes[0])}</strong>${partes[1] ? `<small>${escapar(partes.slice(1).join(' — '))}</small>` : ''}</td>
            <td>${f.provas}</td>
            <td>${f.acertos}</td>
            <td>${f.total - f.acertos}</td>
            <td>${f.pctAcerto}%</td>
          </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <p class="mini">Ordenado da fase de menor aproveitamento para a de maior.</p>`;
}

// Relatório da turma: vem do servidor, então tem os três estados de sempre.
let relatorioDaTurma = null;

function carregarRelatorioDaTurma() {
  if (relatorioDaTurma && relatorioDaTurma.estado === 'carregando') return;
  if (relatorioDaTurma && relatorioDaTurma.estado === 'pronto') return;
  relatorioDaTurma = { estado: 'carregando' };
  Promise.all([
    nuvem.chamar('relatorio_assuntos', {}),
    nuvem.chamar('relatorio_fases', {}),
  ]).then(([assuntos, fases]) => {
    relatorioDaTurma = { estado: 'pronto', dados: relatorio.daNuvem(assuntos, fases) };
  }).catch((erro) => {
    relatorioDaTurma = { estado: 'erro', erro: erro.message || 'Não deu para buscar o relatório.' };
  }).then(() => {
    // Só redesenha se a pessoa ainda estiver nesta tela.
    if (window.location.hash.indexOf('#/painel/relatorio') === 0) desenhar();
  });
}

  return `${cabecalho('Fase', `#/painel/metodo/${m.id}`)}

  return `<article class="questao-admin ${q.status === 'publicada' ? 'no-ar' : 'rascunho'}">

// ============================================== estudo dos métodos cadastrados

function telaMetodo(metodoId) {
  const m = editavel.metodoPorId(metodoId);
  if (!m) return telaInicial();
  const cartoes = m.fases.map((f, i) => {
    const chave = chaveFase(m.id, f.id);
    const dados = banco.faseDoAluno(chave);
    const liberada = i === 0 || banco.faseAprovada(chaveFase(m.id, m.fases[i - 1].id));
    const aprovada = Boolean(dados.aprovadoEm);
    const lidas = dados.licoesLidas.length;
    const total = f.licoes.length || 1;
    return `<div class="cartao-fase ${liberada ? '' : 'trancada'} ${aprovada ? 'aprovada' : ''}"
      ${liberada ? `data-ir="#/m/${m.id}/fase/${f.id}"` : ''} style="--cor:${m.cor}">
      <div class="icone-fase">${liberada ? (f.icone || m.icone) : '🔒'}</div>
      <div class="corpo-fase">
        <span class="numero-fase">Fase ${i + 1}${aprovada ? ' · concluída' : ''}</span>
        <strong>${escapar(f.titulo)}</strong>
        <span class="sub-fase">${escapar(f.subtitulo || '')}</span>
        <div class="barra"><span style="width:${Math.round((lidas / total) * 100)}%"></span></div>
        <span class="mini">${lidas} de ${f.licoes.length} lições${f.paginas ? ` · páginas ${escapar(f.paginas)}` : ''}</span>
      </div>
      ${aprovada ? `<span class="selo">${dados.melhorNota}%</span>` : ''}
    </div>`;
  }).join('');

  return `${cabecalho(m.nome, '#/')}
    <section class="capa-fase" style="--cor:${m.cor}">
      <div class="icone-grande">${m.icone}</div>
      <h2>${escapar(m.nome)}</h2>
      <p class="sub">${escapar(m.instrumento)}</p>
      ${m.descricao ? `<p>${escapar(m.descricao)}</p>` : ''}
    </section>
    <h3 class="titulo-secao">Fases</h3>
    <div class="lista-fases">${cartoes || '<p class="aviso">Este método ainda não tem fases.</p>'}</div>`;
}

function telaMetodoFase(metodoId, faseId) {
  const m = editavel.metodoPorId(metodoId);
  const f = editavel.fasePorId(metodoId, faseId);
  if (!m || !f) return telaInicial();
  const chave = chaveFase(m.id, f.id);
  const dados = banco.faseDoAluno(chave);
  const disponiveis = editavel.questoesPublicadas(m.id, f.id);
  const usadas = new Set(banco.usadasDaFase(chave));
  const ineditas = disponiveis.filter((q) => !usadas.has(q.assinatura)).length;

  const licoes = f.licoes.map((l, i) => `<div class="item-licao ${dados.licoesLidas.includes(i) ? 'lida' : ''}" data-ir="#/m/${m.id}/licao/${f.id}/${i}">
    <span class="marca-lida">${dados.licoesLidas.includes(i) ? '✓' : i + 1}</span>
    <span><strong>${escapar(l.titulo)}</strong><small>${escapar(l.pagina || '')}</small></span><span class="seta">›</span></div>`).join('');

  return `${cabecalho(f.titulo, `#/m/${m.id}`)}
    <section class="capa-fase" style="--cor:${m.cor}">
      <div class="icone-grande">${f.icone || m.icone}</div>
      <h2>${escapar(f.titulo)}</h2>
      <p class="sub">${escapar(f.subtitulo || '')}${f.paginas ? ` · páginas ${escapar(f.paginas)}` : ''}</p>
      ${f.resumo ? `<p>${escapar(f.resumo)}</p>` : ''}
    </section>
    <h3 class="titulo-secao">Lições</h3>
    <div class="lista-licoes">${licoes || '<p class="aviso">Sem lições cadastradas.</p>'}</div>
    ${(f.jogos || []).length ? `<h3 class="titulo-secao">Exercícios lúdicos</h3>
    <div class="lista-jogos">${f.jogos.map((j, i) => {
      const recorde = dados.jogos[j.titulo] || 0;
      return `<div class="item-jogo" data-ir="#/m/${m.id}/jogo/${f.id}/${i}" style="--cor:${m.cor}">
        <strong>${escapar(j.titulo)}</strong><small>${escapar(j.descricao || '')}</small>
        ${recorde ? `<span class="recorde">recorde ${recorde}</span>` : '<span class="recorde novo">novo</span>'}</div>`;
    }).join('')}</div>` : ''}
    <h3 class="titulo-secao">Avaliação da fase</h3>
    <div class="caixa-prova">
      ${disponiveis.length >= 4
        ? `<p>${Math.min(QUESTOES_POR_PROVA, disponiveis.length)} questões. Aprovação a partir de <b>${NOTA_MINIMA}%</b>.</p>
           <p class="mini">Restam <b>${ineditas}</b> questões inéditas nesta fase (de ${disponiveis.length} publicadas).</p>
           <button class="botao grande" data-acao="adm:prova-custom" data-metodo="${m.id}" data-fase="${f.id}">
             ${dados.aprovadoEm ? 'Fazer uma nova avaliação' : 'Iniciar avaliação'}</button>`
        : '<p class="aviso">A avaliação desta fase ainda não foi publicada pelo encarregado.</p>'}
    </div>
    ${dados.tentativas.length ? `<div class="historico"><h3>Suas avaliações</h3>${dados.tentativas.slice().reverse().slice(0, 5).map((t) => `<div class="linha-historico">
      <span>${new Date(t.data).toLocaleDateString('pt-BR')}</span>
      <span class="${t.aprovado ? 'ok' : 'nao'}">${t.nota}% — ${t.aprovado ? 'aprovado' : 'não atingiu a nota'}</span></div>`).join('')}</div>` : ''}`;
}

function telaMetodoLicao(metodoId, faseId, indice) {
  const m = editavel.metodoPorId(metodoId);
  const f = editavel.fasePorId(metodoId, faseId);
  if (!m || !f) return telaInicial();

  return `${cabecalho(`Lição ${indice + 1} de ${f.licoes.length}`, `#/m/${m.id}/fase/${f.id}`)}

      ${licao.corpo || '<p class="mini">Lição sem conteúdo.</p>'}
    </article>
    <div class="acoes">

}

function telaMetodoJogo(metodoId, faseId, indice) {
  const m = editavel.metodoPorId(metodoId);
  const f = editavel.fasePorId(metodoId, faseId);
  if (!m || !f || !f.jogos || !f.jogos[indice]) return telaMetodoFase(metodoId, faseId);
  const jogo = f.jogos[indice];
  return `${cabecalho(jogo.titulo, `#/m/${m.id}/fase/${f.id}`)}
    <section class="jogo" style="--cor:${m.cor}">
      ${jogo.descricao ? `<p class="mini">${escapar(jogo.descricao)}</p>` : ''}

      <div id="fim-jogo"></div>
    </section>`;
