function montarJogoDoMetodo(metodoId, faseId, indice) {
  const f = editavel.fasePorId(metodoId, faseId);
  const jogo = f && f.jogos ? f.jogos[indice] : null;
  const palco = document.getElementById('palco-jogo');
  const fim = document.getElementById('fim-jogo');
  if (!jogo || !palco) return;
  const config = { ...jogo };
  if (jogo.tipo === 'memoria') config.pares = (f.pares || []).map((x) => [x.termo, x.definicao]);
  if (jogo.tipo === 'curiosidades') config.itens = editavel.questoesPublicadas(metodoId, faseId);
  iniciarJogo(config, palco, (pontos, detalhe) => {
    banco.registrarJogo(chaveFase(metodoId, faseId), jogo.titulo, pontos);
    fim.innerHTML = `<div class="resultado-jogo">
      <strong>${pontos} pontos</strong>
      <p>${detalhe || ''}</p>
      <div class="acoes">
        <button class="botao" data-acao="adm:repetir-jogo-metodo" data-metodo="${metodoId}" data-fase="${faseId}" data-i="${indice}">Jogar de novo</button>
        <button class="botao secundario" data-ir="#/m/${metodoId}/fase/${faseId}">Voltar para a fase</button>
      </div></div>`;
  });
}

function prepararProvaCustom(metodoId, faseId) {
  const m = editavel.metodoPorId(metodoId);
  const f = editavel.fasePorId(metodoId, faseId);
  const chave = chaveFase(metodoId, faseId);
  const disponiveis = editavel.questoesPublicadas(metodoId, faseId);
  const usadas = new Set(banco.usadasDaFase(chave));
  const rnd = criarAleatorio(novaSemente());
  let fila = embaralhar(disponiveis.filter((q) => !usadas.has(q.assinatura)), rnd);
  let reciclou = false;
  if (fila.length < Math.min(QUESTOES_POR_PROVA, disponiveis.length)) {
    reciclou = fila.length < disponiveis.length;
    fila = [...fila, ...embaralhar(disponiveis.filter((q) => usadas.has(q.assinatura)), rnd)];
  }
  const questoes = fila.slice(0, QUESTOES_POR_PROVA).map((q, indice) => ({
    indice, assinatura: q.assinatura, enunciado: q.enunciado, html: '',
    alternativas: embaralhar(q.alternativas.slice(), rnd), correta: q.correta,
    explicacao: q.explicacao || '', referencia: q.referencia || '',
  }));
  provaEmCurso = { modo: 'custom', metodoId, faseId, fase: chave, cor: m.cor, rotulo: f.titulo, reciclou, questoes, respostas: [], atual: 0 };
}

function iniciarProvaCustom(metodoId, faseId) {
  prepararProvaCustom(metodoId, faseId);
  const rota = `#/m/${metodoId}/prova/${faseId}`;
  if (window.location.hash === rota) desenhar();
  else ir(rota);
}

function telaProvaCustom(metodoId, faseId) {
  if (!provaEmCurso || provaEmCurso.modo !== 'custom' || provaEmCurso.metodoId !== metodoId || provaEmCurso.faseId !== faseId) {
    prepararProvaCustom(metodoId, faseId);
  }
  const prova = provaEmCurso;
  if (!prova.questoes.length) return telaMetodoFase(metodoId, faseId);
  if (prova.atual >= prova.questoes.length) return telaResultadoCustom(metodoId, faseId);
  const q = prova.questoes[prova.atual];
  return `${cabecalho(`Avaliação — ${prova.rotulo}`, `#/m/${metodoId}/fase/${faseId}`)}
    <div class="progresso-prova"><span style="width:${(prova.atual / prova.questoes.length) * 100}%"></span></div>
    <p class="contador">Questão ${prova.atual + 1} de ${prova.questoes.length}</p>
    ${prova.reciclou && prova.atual === 0 ? '<p class="aviso leve">As questões inéditas desta fase acabaram: algumas já caíram antes.</p>' : ''}
    <article class="questao" style="--cor:${prova.cor}">
      <h2>${escapar(q.enunciado)}</h2>
      <div class="alternativas">
        ${q.alternativas.map((a, i) => `<button class="alternativa" data-alternativa="${escapar(a)}">
          <span class="letra">${'ABCDE'[i] || i + 1}</span><span>${escapar(a)}</span></button>`).join('')}
      </div>
      <div class="retorno" hidden></div>
    </article>`;
}

function telaResultadoCustom(metodoId, faseId) {
  const prova = provaEmCurso;
  const resultado = corrigir(prova, prova.respostas);
  const chave = chaveFase(metodoId, faseId);
  if (!prova.registrada) {
    prova.registrada = true;
    banco.registrarUsadas(chave, prova.questoes.map((q) => q.assinatura));
    banco.registrarTentativa(chave, {
      id: novaTentativaId(),
      data: new Date().toISOString(), acertos: resultado.acertos, total: resultado.total,
      nota: resultado.nota, aprovado: resultado.aprovado,
      // Questão de método cadastrado não nasce de gerador: o assunto passa a
      // ser a própria fase, que é o recorte mais fino que existe ali.
      itens: resultado.detalhes.map((d, i) => ({ indice: i, assunto: chave, certa: Boolean(d.certa) })),
    });
    if (resultado.aprovado) efeito('vitoria');
  }
  const erradas = resultado.detalhes.filter((d) => !d.certa);
  return `${cabecalho('Resultado', `#/m/${metodoId}/fase/${faseId}`)}
    <section class="resultado ${resultado.aprovado ? 'aprovado' : 'reprovado'}" style="--cor:${prova.cor}">
      <div class="nota">${resultado.nota}%</div>
      <strong>${resultado.aprovado ? 'Fase concluída!' : 'Ainda não desta vez'}</strong>
      <p>${resultado.acertos} de ${resultado.total} questões certas. A aprovação é a partir de ${NOTA_MINIMA}%.</p>
      <p class="mini">O certificado desta etapa é emitido pelo encarregado.</p>
      <button class="botao ${resultado.aprovado ? 'secundario' : 'grande'}" data-acao="adm:prova-custom" data-metodo="${metodoId}" data-fase="${faseId}">Fazer outra avaliação</button>
      <button class="botao secundario" data-ir="#/m/${metodoId}/fase/${faseId}">Voltar para a fase</button>
    </section>
    ${erradas.length ? `<h3 class="titulo-secao">O que revisar</h3>
      <div class="revisao">${erradas.map((d) => `<div class="item-revisao">
        <p class="pergunta">${escapar(d.questao.enunciado)}</p>
        <p class="sua">Sua resposta: <b>${escapar(String(d.resposta ?? '—'))}</b></p>
        <p class="certa">Certa: <b>${escapar(d.questao.correta)}</b></p>
        <p class="mini">${escapar(d.questao.explicacao)} <i>${escapar(d.questao.referencia)}</i></p>
      </div>`).join('')}</div>` : ''}`;
}

// ====================================================================== turmas
// Conteúdo de uma turma é uma lista de "fontes": o MSA embutido e os métodos
// e hinários cadastrados. Cada nível diz de qual fase até qual fase o aluno
// enxerga cada fonte.

const FONTE_MSA = 'msa';

function fontesDisponiveis() {
  return [
    ...(editavel.msaVisivel() ? [{ fonte: FONTE_MSA, nome: 'MSA (método embutido)', tipo: 'metodo', instrumento: 'Teoria musical', total: TOTAL_DE_FASES }] : []),
    ...editavel.metodos().map((m) => ({
      fonte: m.id,
      nome: m.tipo === 'hinario' ? `${m.nome}${m.tonalidade ? ` — em ${m.tonalidade}` : ''}` : m.nome,
      tipo: m.tipo || 'metodo',
      instrumento: m.instrumento,
      total: m.fases.length,
    })),
  ];
}

const dadosDaFonte = (fonte) => fontesDisponiveis().find((f) => f.fonte === fonte) || null;

/** Fases de uma fonte, numeradas a partir de 1, com a rota de estudo. */
function fasesDaFonte(fonte) {
  if (fonte === FONTE_MSA) {
    return FASES.map((f) => ({
      numero: f.numero, titulo: f.titulo, subtitulo: f.subtitulo, cor: f.cor, icone: f.icone,
      rota: `#/fase/${f.numero}`, chave: f.numero,
    }));
  }
  const m = editavel.metodoPorId(fonte);
  if (!m) return [];
  return m.fases.map((f, i) => ({
    numero: i + 1, titulo: f.titulo, subtitulo: f.subtitulo || '', cor: m.cor, icone: f.icone || m.icone,
    rota: `#/m/${m.id}/fase/${f.id}`, chave: chaveFase(m.id, f.id),
  }));
}

  const meuVoto = t.avaliacoes.find((a) => a.instrutorId === editavel.sessao().id);

// ------------------------------------------------------------ aluno: turma
let avisoDePromocao = '';

/** Barra de progresso simples, em texto e em desenho. */
function barra(percentual) {
  const cheio = Math.round(percentual / 10);
  return `<span class="barra-progresso" role="img" aria-label="${percentual}%">
    <span style="width:${percentual}%"></span></span><b>${percentual}%</b>`;
}

/** Promoção automática: quando o nível permite e os requisitos estão de pé. */
function conferirPromocao(contaId) {
  const analise = progressao.verificarPromocao(contaId);
  if (!analise.elegivel || analise.modoLiberacao !== 'automatico') return;
  const r = progressao.promoverAluno(contaId, { porQuem: 'automatico', motivo: 'requisitos atingidos' });
  if (r && r.ok) {
    avisoDePromocao = analise.proximo.nome;
    auditoria.registrar(auditoria.ACOES.APROVAR_ALUNO, {
      entidade: 'matricula', entidadeId: contaId, detalhes: `promovido a ${analise.proximo.nome}`,
    });
  }
}

function telaMinhaTurma() {
  const s = editavel.sessao();
  const turma = s ? editavel.turmaDoAluno(s.id) : null;
  if (!turma) return '';
  conferirPromocao(s.id);
  const nivel = editavel.nivelDoAluno(s.id);
  if (!nivel) return '';

  const progresso = progressao.calcularProgresso(s.id);
  const analise = progressao.verificarPromocao(s.id);

  const barras = turma.conteudos.map((fonte) => `<div class="linha-progresso">
      <span>${escapar(progressao.nomeDaFonte(fonte))}</span>${barra(progresso[fonte] || 0)}
    </div>`).join('');

  const objetivo = analise.proximo && analise.motivo === 'sem-requisitos'
    ? `<p class="mini">Próximo nível: <b>${escapar(analise.proximo.nome)}</b> — a promoção é feita pelo encarregado.</p>`
    : analise.proximo
    ? (analise.elegivel
      ? `<p class="mini ok">Requisitos do nível ${escapar(analise.proximo.nome)} cumpridos${analise.modoLiberacao === 'automatico' ? '.' : ` — aguardando aprovação (${escapar(analise.modoLiberacao.replace('_', ' e '))}).`}</p>`
      : `<p class="mini">Próximo objetivo: <b>${escapar(analise.proximo.nome)}</b> — falta ${analise.faltas.map((f) => `${escapar(f.nome)} +${f.falta}%`).join(', ')}.</p>`)
    : '<p class="mini">Você está no último nível desta turma.</p>';

  const blocos = turma.conteudos.map((fonte) => {
    const dados = dadosDaFonte(fonte);
    if (!dados) return '';
    const situacao = progressao.verificarLiberacao(s.id, fonte);
    const regra = nivel.regras.find((r) => r.fonte === fonte);

    if (!situacao.liberado) {
      const explicacao = situacao.motivo === 'fora-do-nivel'
        ? `<p class="mini">Não faz parte do nível ${escapar(nivel.nome)}.</p>`
        : situacao.motivo === 'conteudo-anterior'
          ? '<p class="mini">Abre quando você concluir o conteúdo anterior da turma.</p>'
          : `<div class="requisitos-bloqueio">${situacao.detalhes.map((d) => `<p class="mini">
              ${escapar(d.nome)}: necessário <b>${d.necessario}%</b> · atual <b>${d.atual}%</b>${d.ok ? ' ✓' : ` · falta <b>+${d.falta}%</b>`}</p>`).join('')}</div>`;
      return `<h2 class="titulo-secao">${escapar(dados.nome)}</h2>
        <div class="bloqueio">
          <strong>🔒 Conteúdo bloqueado</strong>
          ${regra ? `<p class="mini faixa-nivel">Quando abrir: fases ${regra.de} a ${regra.ate}${regra.paginas ? ` · páginas ${escapar(regra.paginas)}` : ''}</p>` : ''}
          ${explicacao}
        </div>`;
    }

    const fases = fasesDaFonte(fonte).filter((f) => !regra || (f.numero >= regra.de && f.numero <= regra.ate));
    const cartoes = fases.map((f, i) => {
      const dadosFase = banco.faseDoAluno(f.chave);
      const aprovada = Boolean(dadosFase.aprovadoEm);
      const anteriorOk = i === 0 || banco.faseAprovada(fases[i - 1].chave);
      return `<div class="cartao-fase ${anteriorOk ? '' : 'trancada'} ${aprovada ? 'aprovada' : ''}"
        ${anteriorOk ? `data-ir="${f.rota}"` : ''} style="--cor:${f.cor}">
        <div class="icone-fase">${anteriorOk ? f.icone : '🔒'}</div>
        <div class="corpo-fase">
          <span class="numero-fase">Fase ${f.numero}${aprovada ? ' · concluída' : ''}</span>
          <strong>${escapar(f.titulo)}</strong>
          <span class="sub-fase">${escapar(f.subtitulo || '')}</span>
        </div>
        ${aprovada ? `<span class="selo">${dadosFase.melhorNota}%</span>` : ''}
      </div>`;
    }).join('');

    return `<h2 class="titulo-secao">${escapar(dados.nome)}</h2>
      ${regra ? `<p class="mini faixa-nivel">Fases ${regra.de} a ${regra.ate}${regra.paginas ? ` · páginas ${escapar(regra.paginas)}` : ''}</p>` : ''}
      <div class="lista-fases">${cartoes || '<p class="aviso">Nenhuma fase nesta faixa.</p>'}</div>`;
  }).join('');

  // O aviso fica na tela até o aluno tocar em alguma coisa — um redesenho
  // logo em seguida não pode engolir a novidade.
  const festa = avisoDePromocao ? `<p class="aviso festa">🎉 Novo conteúdo liberado! Você chegou ao nível ${escapar(avisoDePromocao)}.</p>` : '';

  return `${festa}
    <section class="resumo-turma">
      <span class="mini">Sua turma</span>
      <strong>${escapar(turma.nome)}</strong>
      <span class="mini">${escapar(turma.instrumento)} · nível <b>${escapar(nivel.nome)}</b></span>
      <div class="progressos">${barras}</div>
      ${objetivo}
    </section>
    ${blocos}`;
}

/** O nível do aluno libera esta fase do MSA? Vale também na rota direta. */
function msaLiberadoParaAluno(numero) {
  const s = editavel.sessao();
  if (!s || s.perfil !== 'aluno') return true;
  const turma = editavel.turmaDoAluno(s.id);
  if (!turma) return true;
  const regra = editavel.regraDoAluno(s.id, FONTE_MSA);
  if (!regra) return false;
  return numero >= regra.de && numero <= regra.ate;
}

function recado(texto) {

/**
 * Confirmação em dois toques, no próprio botão. A janela do navegador
 * (window.confirm) é bloqueada dentro de molduras de aplicativo e volta como
 * "não" sem aparecer — o que fazia os botões de excluir parecerem mortos.
 * Aqui o primeiro toque pede confirmação, o segundo executa, e em alguns
 * segundos o botão volta ao normal sozinho.
 */
function pedeConfirmacao(botao, rotulo) {
  if (botao.dataset.confirmando === 'sim') return true;
  const original = botao.textContent;
  botao.dataset.confirmando = 'sim';
  botao.textContent = rotulo || 'Toque de novo para confirmar';
  botao.classList.add('confirmando');
  setTimeout(() => {
    if (!botao.isConnected) return;
    botao.dataset.confirmando = '';
    botao.textContent = original;
    botao.classList.remove('confirmando');
  }, 5000);
  return false;
}

function acaoPainel(acao, botao) {
  if (!acao.startsWith('adm:')) return false;
  const nome = acao.slice(4);
  const metodoId = botao.dataset.metodo;
  const faseId = botao.dataset.fase;
  const questaoId = botao.dataset.q;
  const indice = botao.dataset.i !== undefined ? Number(botao.dataset.i) : null;

  if (nome === 'relatorio-recarregar') { relatorioDaTurma = null; carregarRelatorioDaTurma(); desenhar(); return true; }

  // -------------------------------------------------------------- nuvem
  // Tudo aqui é conversa com a rede: o botão trava enquanto espera, e a
  // tela é redesenhada quando a resposta chega.
  if (nome.startsWith('nuvem-')) {
    const terminar = () => { botao.disabled = false; desenhar(); };
    const falhar = (erro) => { botao.disabled = false; recado(erro); desenhar(); };
    botao.disabled = true;

    if (nome === 'nuvem-entrar') {
      const email = campo('nu-email');
      const senha = campo('nu-senha');
      if (!email || !senha) return falhar('Informe e-mail e senha.'), true;
      nuvem.entrar(email, senha).then((r) => {
        if (!r.ok) return falhar(r.erro);
        const p = r.perfil || {};
        // Lido antes de trocar de conta: é o progresso de quem estudava
        // neste aparelho até agora, e ele vai junto para a conta.
        const anterior = JSON.parse(banco.exportar());
        editavel.entrarComSessaoDaNuvem({ id: p.id, nome: p.nome, perfil: p.perfil });
        auditoria.registrar(auditoria.ACOES.LOGIN, { entidade: 'conta', entidadeId: p.id || '', detalhes: `${p.perfil || 'aluno'} (servidor)` });
        return sincronia.adotarConta(p, anterior).then(() => {
          if (p.nome) banco.definirAluno(p.nome);
          terminar();
        });
      }).catch((erro) => falhar(erro.message || 'Não deu para entrar.'));
      return true;
    }

    if (nome === 'nuvem-cadastrar') {
      const email = campo('nu-email');
      const senha = campo('nu-senha');
      const quem = campo('nu-nome');
      if (!email || senha.length < 6) return falhar('Informe o e-mail e uma senha de pelo menos 6 caracteres.'), true;
      if (!quem) return falhar('Informe o nome.'), true;
      nuvem.cadastrar(email, senha, quem).then((r) => {
        if (!r.ok) return falhar(r.erro);
        if (r.confirmar) {
          botao.disabled = false;
          recado('Conta criada. Confirme pelo link enviado no e-mail e depois entre por aqui.');
          return desenhar();
        }
        const p = r.perfil || {};
        const anterior = JSON.parse(banco.exportar());
        editavel.entrarComSessaoDaNuvem({ id: p.id, nome: p.nome, perfil: p.perfil });
        return sincronia.adotarConta(p, anterior).then(() => {
          if (p.nome) banco.definirAluno(p.nome);
          terminar();
        });
      }).catch((erro) => falhar(erro.message || 'Não deu para criar a conta.'));
      return true;
    }

    if (nome === 'nuvem-sair') {
      nuvem.sair();
      editavel.sair();
      ir('#/acesso');
      terminar();
      return true;
    }

    if (nome === 'nuvem-sincronizar') {
      sincronia.enviarProgresso().then(terminar).catch(() => terminar());
      return true;
    }

    if (nome === 'nuvem-baixar') {
      sincronia.baixarConteudo().then(terminar).catch(() => terminar());
      return true;
    }

    if (nome === 'nuvem-publicar') {
      if (!pedeConfirmacao(botao, 'Publicar mesmo?')) { botao.disabled = false; return true; }
      sincronia.publicarConteudo().then((r) => {
        if (!r.ok) return falhar(r.erro);
        auditoria.registrar(auditoria.ACOES.PUBLICAR_METODO, { entidade: 'nuvem', detalhes: 'conteúdo publicado no servidor' });
        terminar();
      }).catch((erro) => falhar(erro.message || 'Não deu para publicar.'));
      return true;
    }

    if (nome === 'nuvem-ligar') {
      const idLocal = campo('nu-local') || (document.getElementById('nu-local') || {}).value || '';
      if (!idLocal) return falhar('Escolha a conta antiga.'), true;
      nuvem.ligarContaLocal(idLocal).then(() => nuvem.meuPerfil()).then(terminar)
        .catch((erro) => falhar(erro.message || 'Não deu para ligar as contas.'));
      return true;
    }

    botao.disabled = false;
    return true;
  }

  // ------------------------------------------------------------- acesso
  if (nome === 'entrar-encarregado') {
    const r = editavel.entrar(campo('en-usuario'), campo('en-senha'), null, ['administrador', 'encarregado']);
    if (!r.ok) return recado(r.erro), true;
    auditoria.registrar(auditoria.ACOES.LOGIN, { entidade: 'conta', entidadeId: r.conta.id, detalhes: r.conta.perfil });
    ir('#/painel'); desenhar(); return true;
  }
  if (nome === 'entrar-instrutor') {
    const quem = document.getElementById('in-quem');
    const r = editavel.entrar(quem ? quem.value : '', campo('in-senha'), 'instrutor');
    if (!r.ok) return recado(r.erro), true;
    auditoria.registrar(auditoria.ACOES.LOGIN, { entidade: 'conta', entidadeId: r.conta.id, detalhes: 'instrutor' });
    ir('#/instrutor'); desenhar(); return true;
  }
  if (nome === 'entrar-aluno') {
    const quem = document.getElementById('al-quem');
    const r = editavel.entrar(quem ? quem.value : '', campo('al-senha'), 'aluno');
    if (!r.ok) return recado(r.erro), true;
    auditoria.registrar(auditoria.ACOES.LOGIN, { entidade: 'conta', entidadeId: r.conta.id, detalhes: 'aluno' });
    banco.usarConta(r.conta.id);
    if (!banco.progresso().aluno.nome) banco.definirAluno(r.conta.nome);
    ir('#/'); desenhar(); return true;
  }
  if (nome === 'trocar-acesso') {
    const r = editavel.atualizarEncarregado({ usuario: campo('se-usuario'), atual: campo('se-atual'), nova: campo('se-nova') });
    if (!r.ok) return recado(r.erro), true;
    recado('Acesso atualizado.'); desenhar(); return true;
  }
  if (nome === 'sair') {
    auditoria.registrar(auditoria.ACOES.LOGOUT, { entidade: 'conta' });
    editavel.sair(); ir('#/'); desenhar(); return true;
  }
  if (nome === 'trocar-perfil') { editavel.sair(); ir('#/'); desenhar(); return true; }

  // ------------------------------------------------------------ métodos
  if (nome === 'novo-metodo') {
    if (!editavel.temPermissao(PERMISSOES.METODO_GERENCIAR)) return recado('Seu perfil não pode criar métodos.'), true;
    const m = editavel.novoMetodo({});
    auditoria.registrar(auditoria.ACOES.CRIAR_METODO, { entidade: 'metodo', entidadeId: m.id });
    ir(`#/painel/metodo/${m.id}`); desenhar(); return true;
  }
  if (nome === 'salvar-metodo') {
    const tipoEscolhido = document.getElementById('me-tipo') ? document.getElementById('me-tipo').value : 'metodo';
    editavel.salvarMetodo(metodoId, {
      nome: campo('me-nome') || 'Método sem nome',
      instrumento: campo('me-instrumento') || 'Geral',
      icone: campo('me-icone') || (tipoEscolhido === 'hinario' ? '📖' : '🎵'),
      descricao: campo('me-descricao'),
      tipo: tipoEscolhido,
      tonalidade: campo('me-tonalidade'),
    });
    desenhar(); return true;
  }
  if (nome === 'publicar-metodo') {
    const m = editavel.metodoPorId(metodoId);
    if (!m) return true;
    if (!m.publicado) {
      const temQuestoes = m.fases.some((f) => f.questoes.some((q) => q.status === 'publicada'));
      if (!m.fases.length || !temQuestoes) {
        recado('Para publicar, o método precisa de ao menos uma fase com questões aprovadas.');
        return true;
      }
    }
    editavel.salvarMetodo(metodoId, { publicado: !m.publicado });
    auditoria.registrar(auditoria.ACOES.PUBLICAR_METODO, { entidade: 'metodo', entidadeId: metodoId, detalhes: m.publicado ? 'despublicado' : 'publicado' });
    desenhar(); return true;
  }
  if (nome === 'excluir-metodo') {
    if (!pedeConfirmacao(botao, 'Confirmar exclusão do método?')) return true;
    editavel.excluirMetodo(metodoId); ir('#/painel'); desenhar(); return true;
  }
  if (nome === 'importar-msa') {
    const m = materializarMSA();
    recado('MSA copiado para o painel: 10 fases, lições e 30 questões por fase. Edite à vontade — a trilha original continua como está.');
    ir(`#/painel/metodo/${m.id}`); desenhar(); return true;
  }

  // -------------------------------------------------------------- fases
  if (nome === 'nova-fase') {
    const f = editavel.novaFase(metodoId, {});
    ir(`#/painel/fase/${metodoId}/${f.id}`); desenhar(); return true;
  }
  if (nome === 'salvar-fase') {
    editavel.salvarFase(metodoId, faseId, {
      titulo: campo('fa-titulo') || 'Fase sem título',
      subtitulo: campo('fa-subtitulo'),
      paginas: campo('fa-paginas'),
      resumo: campo('fa-resumo'),
    });
    desenhar(); return true;
  }
  if (nome === 'excluir-fase') {
    if (!pedeConfirmacao(botao, 'Confirmar?')) return true;
    editavel.excluirFase(metodoId, faseId); desenhar(); return true;
  }
  if (nome === 'subir-fase') { editavel.moverFase(metodoId, faseId, -1); desenhar(); return true; }
  if (nome === 'descer-fase') { editavel.moverFase(metodoId, faseId, 1); desenhar(); return true; }

  // ------------------------------------------------------------- lições
  if (nome === 'nova-licao') {
    editavel.salvarLicao(metodoId, faseId, null, { titulo: 'Nova lição', pagina: '', corpo: '' });
    desenhar(); return true;
  }
  if (nome === 'salvar-licao') {
    editavel.salvarLicao(metodoId, faseId, indice, {
      titulo: campo(`li-${indice}-titulo`) || 'Lição sem título',
      pagina: campo(`li-${indice}-pagina`),
      corpo: document.getElementById(`li-${indice}-corpo`) ? document.getElementById(`li-${indice}-corpo`).value : '',
    });
    desenhar(); return true;
  }
  if (nome === 'excluir-licao') {
    if (!pedeConfirmacao(botao, 'Confirmar?')) return true;
    editavel.excluirLicao(metodoId, faseId, indice); desenhar(); return true;
  }

  if (nome === 'novo-jogo') {
    const tipo = document.getElementById('jo-tipo') ? document.getElementById('jo-tipo').value : 'curiosidades';
    const rotulo = (TIPOS_DE_JOGO.find((t) => t[0] === tipo) || ['', 'Jogo'])[1];
    editavel.salvarJogo(metodoId, faseId, null, {
      tipo,
      titulo: campo('jo-titulo') || rotulo.split(' — ')[0],
      descricao: campo('jo-descricao') || '',
    });
    desenhar(); return true;
  }
  if (nome === 'excluir-jogo') { editavel.excluirJogo(metodoId, faseId, indice); desenhar(); return true; }
  if (nome === 'salvar-pares') {
    const texto = document.getElementById('jo-pares') ? document.getElementById('jo-pares').value : '';
    editavel.salvarPares(metodoId, faseId, auto.lerPares(texto));
    desenhar(); return true;
  }
  if (nome === 'jogo-metodo') { ir(`#/m/${metodoId}/jogo/${faseId}/${indice}`); desenhar(); return true; }
  if (nome === 'repetir-jogo-metodo') {
    const fim = document.getElementById('fim-jogo');
    if (fim) fim.innerHTML = '';
    montarJogoDoMetodo(metodoId, faseId, indice);
    return true;
  }

  // ------------------------------------------------- avaliação automática
  if (nome === 'gerar-pares' || nome === 'gerar-texto' || nome === 'gerar-da-licao') {
    const fase = editavel.fasePorId(metodoId, faseId);
    const referencia = fase ? `${fase.titulo}${fase.paginas ? ` · pág. ${fase.paginas}` : ''}` : '';
    let novas = [];
    if (nome === 'gerar-pares') {
      const pares = auto.lerPares(document.getElementById('ge-pares') ? document.getElementById('ge-pares').value : '');
      if (pares.length < 3) return recado('Escreva pelo menos 3 pares no formato "termo = definição", um por linha.'), true;
      // Os mesmos pares alimentam o jogo da memória desta fase.
      editavel.salvarPares(metodoId, faseId, pares);
      novas = auto.dePares(pares, referencia);
    } else if (nome === 'gerar-texto') {
      const texto = document.getElementById('ge-texto') ? document.getElementById('ge-texto').value : '';
      if (texto.trim().length < 80) return recado('Cole um trecho maior (pelo menos umas quatro frases).'), true;
      novas = auto.deTexto(texto, referencia);
    } else {
      const licao = fase ? fase.licoes[indice] : null;
      if (!licao) return true;
      const texto = auto.textoDeHtml(licao.corpo);
      if (texto.length < 80) return recado('Esta lição tem pouco texto para gerar questões.'), true;
      novas = auto.deTexto(texto, `${licao.titulo}${licao.pagina ? ` · pág. ${licao.pagina}` : ''}`);
    }
    if (!novas.length) return recado('Não consegui reconhecer definições nem palavras-chave suficientes. Tente pelos pares "termo = definição".'), true;
    const entraram = editavel.adicionarQuestoes(metodoId, faseId, novas);
    recado(`${entraram} questão(ões) criadas como rascunho. Revise antes de publicar.`);
    ir(`#/painel/revisar/${metodoId}/${faseId}`); desenhar(); return true;
  }

  // ----------------------------------------------------------- questões
  if (nome === 'nova-questao') {
    editavel.adicionarQuestoes(metodoId, faseId, [{
      enunciado: 'Nova questão', alternativas: ['', '', '', ''], correta: '',
      explicacao: '', referencia: '', origem: 'manual', status: 'rascunho',
    }]);
    ir(`#/painel/revisar/${metodoId}/${faseId}`); desenhar(); return true;
  }
  if (nome === 'salvar-questao') {
    const alternativas = [0, 1, 2, 3].map((i) => campo(`q-${questaoId}-a${i}`)).filter(Boolean);
    const seletor = document.getElementById(`q-${questaoId}-c`);
    const escolhida = seletor ? campo(`q-${questaoId}-a${Number(seletor.value)}`) : '';
    if (alternativas.length < 2) return recado('A questão precisa de pelo menos duas alternativas.'), true;
    if (!escolhida) return recado('Escolha qual alternativa é a resposta certa.'), true;
    editavel.salvarQuestao(metodoId, faseId, questaoId, {
      enunciado: campo(`q-${questaoId}-en`) || 'Questão sem enunciado',
      alternativas, correta: escolhida,
      explicacao: campo(`q-${questaoId}-ex`),
      referencia: campo(`q-${questaoId}-re`),
    });
    desenhar(); return true;
  }
  if (nome === 'aprovar-questao') {
    const fase = editavel.fasePorId(metodoId, faseId);
    const q = fase && fase.questoes.find((x) => x.id === questaoId);
    if (!q || !q.alternativas.includes(q.correta) || q.alternativas.length < 2) {
      recado('Antes de aprovar, salve a questão com pelo menos duas alternativas e a resposta certa marcada.');
      return true;
    }
    editavel.definirStatusQuestao(metodoId, faseId, questaoId, 'publicada'); desenhar(); return true;
  }
  if (nome === 'tirar-questao') { editavel.definirStatusQuestao(metodoId, faseId, questaoId, 'rascunho'); desenhar(); return true; }
  if (nome === 'excluir-questao') { editavel.excluirQuestao(metodoId, faseId, questaoId); desenhar(); return true; }
  if (nome === 'aprovar-todas') {
    const fase = editavel.fasePorId(metodoId, faseId);
    const ruins = fase.questoes.filter((q) => q.status !== 'publicada' && (!q.alternativas.includes(q.correta) || q.alternativas.length < 2));
    if (ruins.length) return recado(`${ruins.length} questão(ões) estão incompletas. Ajuste uma a uma antes de aprovar em bloco.`), true;
    const n = editavel.aprovarTodas(metodoId, faseId);
    recado(`${n} questão(ões) publicadas.`); desenhar(); return true;
  }

  // ---------------------------------------------------------- sugestões
  if (nome === 'enviar-sugestao') {
    const alvo = document.getElementById('su-alvo');
    const [mid, fid] = alvo && alvo.value ? alvo.value.split('|') : [null, null];
    const texto = document.getElementById('su-texto') ? document.getElementById('su-texto').value : '';
    const r = editavel.sugerir({ metodoId: mid, faseId: fid, texto });
    if (!r.ok) return recado(r.erro), true;
    recado('Sugestão enviada ao encarregado.'); desenhar(); return true;
  }
  if (nome === 'aceitar-sugestao') { editavel.resolverSugestao(botao.dataset.sug, 'aplicada'); desenhar(); return true; }
  if (nome === 'recusar-sugestao') { editavel.resolverSugestao(botao.dataset.sug, 'recusada'); desenhar(); return true; }
  if (nome === 'excluir-sugestao') {
    if (!pedeConfirmacao(botao, 'Confirmar?')) return true;
    editavel.excluirSugestao(botao.dataset.sug); desenhar(); return true;
  }

  // ------------------------------------------------------------- equipe
  if (nome === 'add-conta') {
    const perfilNovo = document.getElementById('co-perfil') ? document.getElementById('co-perfil').value : 'aluno';
    if (perfilNovo === 'administrador' && !editavel.ehAdministrador()) {
      return recado('Só um administrador pode criar outro administrador.'), true;
    }
    if (!editavel.temPermissao(PERMISSOES.USUARIOS_CRIAR)) {
      return recado('Seu perfil não tem permissão para criar contas.'), true;
    }
    const r = editavel.cadastrarConta(perfilNovo, campo('co-nome'), campo('co-senha'), campo('co-instrumento'));
    if (!r.ok) return recado(r.erro), true;
    auditoria.registrar(auditoria.ACOES.CRIAR_USUARIO, { entidade: 'conta', detalhes: `${perfilNovo}: ${campo('co-nome')}` });
    desenhar(); return true;
  }
  if (nome === 'remover-conta') {
    if (!pedeConfirmacao(botao, '✕?')) return true;
    const r = editavel.removerConta(botao.dataset.conta);
    if (!r.ok) return recado(r.erro), true;
    desenhar(); return true;
  }

  // ------------------------------------------------- conteúdo em arquivo
  if (nome === 'alternar-msa') {
    editavel.definirMsaVisivel(!editavel.msaVisivel());
    desenhar(); return true;
  }
  if (nome === 'zerar') {
    if (!pedeConfirmacao(botao, '⚠️ Toque de novo para zerar tudo')) return true;
    const limparContas = document.getElementById('ze-contas') && document.getElementById('ze-contas').checked;
    const limparProgresso = document.getElementById('ze-progresso') && document.getElementById('ze-progresso').checked;
    auditoria.registrar(auditoria.ACOES.ZERAR_SISTEMA, { entidade: 'sistema', detalhes: limparContas ? 'com contas' : 'sem contas' });
    editavel.zerarSistema({ contas: limparContas, msa: true });
    if (limparProgresso) banco.apagarTudo();
    recado('Sistema zerado. O MSA embutido saiu do ar: cadastre os métodos do zero, ou religue o MSA aqui no painel.');
    ir('#/painel'); desenhar(); return true;
  }
  if (nome === 'backup-exportar') {
    const r = editavel.executarComPermissao(PERMISSOES.BACKUP, () => {
      const pacote = {
        formato: 'estudo-musical-backup', versao: 2,
        geradoEm: new Date().toISOString(),
        sistema: JSON.parse(editavel.exportarTudo()),
        progressos: banco.exportarTodosOsProgressos(),
        auditoria: auditoria.todos(),
      };
      salvarArquivo('backup-sistema-completo.json', new Blob([JSON.stringify(pacote, null, 2)], { type: 'application/json' }));
      auditoria.registrar(auditoria.ACOES.EXPORTAR_BACKUP, { entidade: 'sistema' });
    });
    if (!r.ok) recado(r.erro);
    return true;
  }
  if (nome === 'backup-importar') {
    const entrada = document.getElementById('arquivo-backup');
    if (entrada) entrada.click();
    return true;
  }
  if (nome === 'exportar-conteudo') {
    salvarArquivo('conteudo-metodos.json', new Blob([editavel.exportar()], { type: 'application/json' }));
    return true;
  }
  if (nome === 'importar-conteudo') {
    const entrada = document.getElementById('arquivo-conteudo');
    if (entrada) entrada.click();
    return true;
  }

  // ------------------------------------------------------------- turmas
  const turmaId = botao.dataset.turma;
  const nivelId = botao.dataset.nivel;
  const fonte = botao.dataset.fonte;

  if (nome === 'nova-turma') {
    const t = editavel.novaTurma({});
    auditoria.registrar(auditoria.ACOES.CRIAR_TURMA, { entidade: 'turma', entidadeId: t.id });
    ir(`#/painel/turma/${t.id}`); desenhar(); return true;
  }
  if (nome === 'salvar-turma') {
    editavel.salvarTurma(turmaId, { nome: campo('tu-nome') || 'Turma sem nome', instrumento: campo('tu-instrumento') });
    desenhar(); return true;
  }
  if (nome === 'excluir-turma') {
    if (!pedeConfirmacao(botao, 'Confirmar exclusão da turma?')) return true;
    editavel.excluirTurma(turmaId); ir('#/painel/turmas'); desenhar(); return true;
  }
  if (nome === 'salvar-conteudos') {
    const marcados = [...document.querySelectorAll('[data-conteudo]')].filter((c) => c.checked).map((c) => c.dataset.conteudo);
    const turma = editavel.turmaPorId(turmaId);
    // Mantém a ordem já definida e põe os novos no fim.
    const ordenados = [...turma.conteudos.filter((f) => marcados.includes(f)), ...marcados.filter((f) => !turma.conteudos.includes(f))];
    editavel.definirConteudos(turmaId, ordenados);
    desenhar(); return true;
  }
  if (nome === 'subir-conteudo') { editavel.moverConteudo(turmaId, fonte, -1); desenhar(); return true; }
  if (nome === 'descer-conteudo') { editavel.moverConteudo(turmaId, fonte, 1); desenhar(); return true; }
  if (nome === 'novo-nivel') { editavel.novoNivel(turmaId); desenhar(); return true; }
  if (nome === 'salvar-nivel') {
    editavel.salvarNivel(turmaId, nivelId, { nome: campo(`nv-${nivelId}-nome`) || 'Nível' });
    desenhar(); return true;
  }
  if (nome === 'excluir-nivel') {
    if (!pedeConfirmacao(botao, 'Confirmar?')) return true;
    editavel.excluirNivel(turmaId, nivelId); desenhar(); return true;
  }
  if (nome === 'salvar-regra') {
    const marca = document.getElementById(`rg-${nivelId}-${fonte}-ant`);
    const r = editavel.salvarRegra(turmaId, nivelId, {
      fonte,
      de: campo(`rg-${nivelId}-${fonte}-de`),
      ate: campo(`rg-${nivelId}-${fonte}-ate`),
      paginas: campo(`rg-${nivelId}-${fonte}-pag`),
      exigeAnterior: marca && marca.checked,
    });
    if (!r.ok) return recado(r.erro), true;
    desenhar(); return true;
  }
  if (nome === 'salvar-requisitos-regra') {
    const turma = editavel.turmaPorId(turmaId);
    const requisitos = turma.conteudos.filter((o) => o !== fonte).map((o) => {
      const valor = campo(`rq-${nivelId}-${fonte}-${o}`);
      return valor === '' ? null : { fonte: o, percentualMinimo: Math.max(0, Math.min(100, Number(valor))) };
    }).filter(Boolean);
    const op = document.getElementById(`op-${nivelId}-${fonte}`);
    const r = editavel.salvarRequisitosDaRegra(turmaId, nivelId, fonte, { requisitos, operador: op ? op.value : 'TODOS' });
    if (!r.ok) return recado(r.erro), true;
    auditoria.registrar(auditoria.ACOES.ALTERAR_REGRA, { entidade: 'turma', entidadeId: turmaId, detalhes: `requisitos de ${fonte}` });
    desenhar(); return true;
  }
  if (nome === 'salvar-requisitos-nivel') {
    const turma = editavel.turmaPorId(turmaId);
    const requisitos = turma.conteudos.map((o) => {
      const valor = campo(`np-${nivelId}-${o}`);
      return valor === '' ? null : { fonte: o, percentualMinimo: Math.max(0, Math.min(100, Number(valor))) };
    }).filter(Boolean);
    const op = document.getElementById(`no-${nivelId}`);
    const modo = document.getElementById(`nm-${nivelId}`);
    editavel.salvarRequisitosDoNivel(turmaId, nivelId, {
      requisitos, operador: op ? op.value : 'TODOS', modoLiberacao: modo ? modo.value : 'automatico',
    });
    auditoria.registrar(auditoria.ACOES.CRIAR_REGRA, { entidade: 'turma', entidadeId: turmaId, detalhes: `promoção do nível ${nivelId}` });
    desenhar(); return true;
  }
  if (nome === 'remover-regra') { editavel.removerRegra(turmaId, nivelId, fonte); desenhar(); return true; }
  if (nome === 'enviar-avaliacao') {
    const r = editavel.enviarParaAvaliacao(turmaId);
    if (!r.ok) return recado(r.erro), true;
    recado('Turma enviada. Os instrutores do instrumento vão ver o pedido na área deles.');
    desenhar(); return true;
  }
  if (nome === 'liberar-turma') {
    const r = editavel.liberarTurma(turmaId);
    if (!r.ok) return recado(r.erro), true;
    auditoria.registrar(auditoria.ACOES.LIBERAR_CONTEUDO, { entidade: 'turma', entidadeId: turmaId });
    recado('Turma liberada. Os alunos matriculados já veem o conteúdo do nível deles.');
    desenhar(); return true;
  }
  if (nome === 'recolher-turma') { editavel.recolherTurma(turmaId); desenhar(); return true; }
  if (nome === 'matricular') {
    const aluno = document.getElementById('ma-aluno');
    const nivelEscolhido = document.getElementById('ma-nivel');
    const r = editavel.matricular(turmaId, aluno ? aluno.value : '', nivelEscolhido ? nivelEscolhido.value : '');
    if (!r.ok) return recado(r.erro), true;
    auditoria.registrar(auditoria.ACOES.MATRICULAR_ALUNO, { entidade: 'turma', entidadeId: turmaId, detalhes: aluno ? aluno.value : '' });
    desenhar(); return true;
  }
  if (nome === 'desmatricular') {
    editavel.desmatricular(turmaId, botao.dataset.conta); desenhar(); return true;
  }
  if (nome === 'aprovar-turma' || nome === 'ajustar-turma') {
    const comentario = document.getElementById('av-comentario') ? document.getElementById('av-comentario').value : '';
    const r = editavel.avaliarTurma(turmaId, nome === 'aprovar-turma' ? 'aprovado' : 'ajustes', comentario);
    if (!r.ok) return recado(r.erro), true;
    recado(nome === 'aprovar-turma' ? 'Parecer registrado: aprovado.' : 'Parecer registrado: a turma voltou para o encarregado ajustar.');
    ir('#/instrutor'); desenhar(); return true;
  }

  // ----------------------------------------------------- gerador de cursos
  if (nome === 'anexar-documentos') {
    cursoEmAnalise = botao.dataset.curso || null;
    const entrada = document.getElementById('arquivos-curso');
    if (entrada) { entrada.value = ''; entrada.click(); }
    else recado('Abra o gerador de cursos para anexar documentos.');
    return true;
  }
  if (nome === 'publicar-curso') {
    const r = publicarCurso(botao.dataset.curso);
    if (!r.ok) return recado(r.erro), true;
    auditoria.registrar(auditoria.ACOES.IMPORTAR_CONTEUDO, { entidade: 'curso', entidadeId: botao.dataset.curso, detalhes: `publicado como método ${r.metodo.nome}` });
    recado('Curso publicado como método. Revise as questões e publique o método quando quiser liberar aos alunos.');
    ir(`#/painel/metodo/${r.metodo.id}`); desenhar(); return true;
  }
  if (nome === 'excluir-curso') {
    if (!pedeConfirmacao(botao, 'Confirmar exclusão do curso?')) return true;
    cursos.excluir(botao.dataset.curso);
    ir('#/painel/cursos'); desenhar(); return true;
  }

  // ------------------------------------------------ conteúdo em arquivo
  if (nome === 'anexar-arquivo') {
    metodoDaImportacao = metodoId;
    const entrada = document.getElementById('arquivo-metodo');
    if (entrada) { entrada.value = ''; entrada.click(); }
    return true;
  }
  if (nome === 'analisar-texto') {
    const texto = document.getElementById('im-texto') ? document.getElementById('im-texto').value : '';
    if (texto.trim().length < 120) return recado('Cole um trecho maior para eu conseguir separar fases e lições.'), true;
    const proposta = importador.estruturar(importador.deTextoColado(texto));
    if (!proposta.fases.length) return recado('Não consegui separar conteúdo nesse texto.'), true;
    propostaImportacao = { ...proposta, metodoId };
    ir(`#/painel/importar/${metodoId}`); desenhar(); return true;
  }
  if (nome === 'aplicar-importacao') {
    if (!propostaImportacao || propostaImportacao.metodoId !== metodoId) return true;
    const gerar = document.getElementById('im-gerar') && document.getElementById('im-gerar').checked;
    let fasesCriadas = 0; let licoesCriadas = 0; let questoesCriadas = 0;
    propostaImportacao.fases.forEach((f, i) => {
      const usar = document.getElementById(`im-f${i}-usar`);
      if (usar && !usar.checked) return;
      const escolhidas = f.licoes.map((l, j) => {
        const marcada = document.getElementById(`im-f${i}-l${j}-usar`);
        if (marcada && !marcada.checked) return null;
        const corpo = document.getElementById(`im-f${i}-l${j}-corpo`);
        return {
          titulo: campo(`im-f${i}-l${j}-titulo`) || l.titulo,
          pagina: campo(`im-f${i}-l${j}-pagina`),
          corpo: corpo ? corpo.value : l.corpo,
        };
      }).filter(Boolean);
      if (!escolhidas.length) return;
      const fase = editavel.novaFase(metodoId, { titulo: campo(`im-f${i}-titulo`) || f.titulo });
      fasesCriadas++;
      escolhidas.forEach((l) => {
        editavel.salvarLicao(metodoId, fase.id, null, l);
        licoesCriadas++;
        if (gerar) {
          const texto = auto.textoDeHtml(l.corpo);
          if (texto.length >= 120) {
            questoesCriadas += editavel.adicionarQuestoes(metodoId, fase.id,
              auto.deTexto(texto, `${l.titulo}${l.pagina ? ` · pág. ${l.pagina}` : ''}`));
          }
        }
      });
    });
    propostaImportacao = null;
    recado(`${fasesCriadas} fase(s) e ${licoesCriadas} lição(ões) criadas${gerar ? `, com ${questoesCriadas} questão(ões) em rascunho para revisar` : ''}.`);
    ir(`#/painel/metodo/${metodoId}`); desenhar(); return true;
  }
  if (nome === 'descartar-importacao') {
    propostaImportacao = null;
    ir(`#/painel/metodo/${metodoId}`); desenhar(); return true;
  }

  // ----------------------------------------------- avaliação do aluno
  if (nome === 'prova-custom') { iniciarProvaCustom(metodoId, faseId); return true; }

  return true;
}

// ------------------------------------------------------------------ roteador
function desenhar() {
  const alvoAntigo = document.getElementById('palco-jogo');
  if (alvoAntigo) pararJogo(alvoAntigo);

  const sessaoAtual = editavel.sessao();
  banco.usarConta(sessaoAtual && sessaoAtual.perfil === 'aluno' && sessaoAtual.id !== 'aluno' ? sessaoAtual.id : '');

  const rota = window.location.hash.replace(/^#/, '') || '/';
  const partes = rota.split('/').filter(Boolean);
  let html = '';
  let depois = null;

  if (!partes.length) html = telaInicial();
  else if (partes[0] === 'acesso') html = telaEntrada();
  else if (partes[0] === 'entrar') {
    if (partes[1] === 'aluno') html = telaEntrarAluno();
    else if (partes[1] === 'instrutor') html = telaEntrarInstrutor();
    else if (partes[1] === 'encarregado') html = telaEntrarEncarregado();
    else html = telaEntrada();
  }
  else if (partes[0] === 'instrutor') html = partes[1] === 'turma' ? telaInstrutorTurma(partes[2]) : telaInstrutor();
  else if (partes[0] === 'painel') {
    if (partes[1] === 'metodo') html = telaPainelMetodo(partes[2]);
    else if (partes[1] === 'fase') html = telaPainelFase(partes[2], partes[3]);
    else if (partes[1] === 'revisar') html = telaPainelRevisar(partes[2], partes[3]);
    else if (partes[1] === 'cursos') html = telaPainelCursos();
    else if (partes[1] === 'curso') html = telaPainelCurso(partes[2]);
    else if (partes[1] === 'relatorio') { html = telaPainelRelatorio(); depois = carregarRelatorioDaTurma; }
    else if (partes[1] === 'auditoria') html = telaPainelAuditoria();
    else if (partes[1] === 'turmas') html = telaPainelTurmas();
    else if (partes[1] === 'turma') html = telaPainelTurma(partes[2]);
    else if (partes[1] === 'importar') html = telaPainelImportar(partes[2]);
    else if (partes[1] === 'sugestoes') html = telaPainelSugestoes();
    else if (partes[1] === 'equipe') html = telaPainelEquipe();
    else html = telaPainel();
  } else if (partes[0] === 'm') {
    if (partes[2] === 'fase') html = telaMetodoFase(partes[1], partes[3]);
    else if (partes[2] === 'licao') html = telaMetodoLicao(partes[1], partes[3], Number(partes[4]));
    else if (partes[2] === 'jogo') {
      html = telaMetodoJogo(partes[1], partes[3], Number(partes[4]));
      depois = () => montarJogoDoMetodo(partes[1], partes[3], Number(partes[4]));
    }
    else if (partes[2] === 'prova') html = telaProvaCustom(partes[1], partes[3]);
    else html = telaMetodo(partes[1]);
  }
  else if (partes[0] === 'relatorio') html = telaRelatorio();
  else if (partes[0] === 'nuvem') html = telaNuvem();
  else if (partes[0] === 'sobre') html = telaSobre();
  else if (partes[0] === 'certificados') html = telaCertificados();
  else if (partes[0] === 'certificado') html = telaCertificado(Number(partes[1]));
  else if (partes[0] === 'fase') {
    const numero = Number(partes[1]);
    if (partes[2] === 'licao') html = telaLicao(numero, Number(partes[3]));
    else if (partes[2] === 'jogo') { html = telaJogo(numero, Number(partes[3])); depois = () => montarJogo(numero, Number(partes[3])); }
    else if (partes[2] === 'prova') html = telaProva(numero);
    else html = telaFase(numero);
  } else html = telaInicial();

  tela().innerHTML = html;
  tela().querySelectorAll('[data-ir]').forEach((el) => {
    el.setAttribute('role', 'link');
    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
  });
  tela().scrollTop = 0;
  window.scrollTo(0, 0);
  if (depois) depois();
}

function cliques(evento) {
  avisoDePromocao = '';
  const alternativa = evento.target.closest('.alternativa');
  if (alternativa && !alternativa.disabled) { responder(alternativa.dataset.alternativa, alternativa); return; }

  const botao = evento.target.closest('[data-acao]');
  if (!botao) return;
  const acao = botao.dataset.acao;
  if (acao.startsWith('adm:')) { acaoPainel(acao, botao); return; }
  const fase = Number(botao.dataset.fase);

  if (acao === 'iniciar-prova') iniciarProva(fase);
  else if (acao === 'proxima') {
    if (!provaEmCurso) return;
    if (provaEmCurso.atual < provaEmCurso.questoes.length) provaEmCurso.atual++;
    desenhar();
  }
  else if (acao === 'repetir-jogo') {
    const partes = window.location.hash.split('/');
    document.getElementById('fim-jogo').innerHTML = '';
    montarJogo(Number(partes[2]), Number(partes[4]));
  } else if (acao === 'imprimir' || acao === 'baixar') {
    const certificado = banco.certificados().find((c) => c.fase === fase);
    if (!certificado) { window.alert('Certificado desta fase não encontrado neste aparelho.'); return; }
    if (acao === 'imprimir') imprimirCertificado(certificado);
    else baixarCertificado(certificado);
  } else if (acao === 'salvar-nome') {
    const nome = document.getElementById('nome-ajuste').value.trim();
    if (nome) { banco.definirAluno(nome); botao.textContent = 'Nome salvo ✓'; setTimeout(() => { botao.textContent = 'Salvar nome'; }, 1500); }
  } else if (acao === 'exportar') {
    salvarArquivo('progresso-msa.json', new Blob([banco.exportar()], { type: 'application/json' }));
  } else if (acao === 'importar') document.getElementById('arquivo-progresso').click();
  else if (acao === 'apagar') {
    if (!pedeConfirmacao(botao, '⚠️ Toque de novo para apagar tudo')) return;
    banco.apagarTudo();
    ir('#/');
    desenhar();
  }
}

function teclado(evento) {
  if (evento.target.id === 'nome' && evento.key === 'Enter') document.getElementById('comecar')?.click();
}

function mudancas(evento) {
  if (evento.target.id === 'arquivos-curso') {
    const arquivos = [...evento.target.files];
    if (!arquivos.length) return;
    const escolhido = document.getElementById('cu-instrumento');
    const instrumentoId = escolhido ? escolhido.value : '';
    const nomeCurso = campo('cu-nome');
    const anterior = cursoEmAnalise ? cursos.porId(cursoEmAnalise) : null;
    tela().innerHTML = `${cabecalho('Analisando', '#/painel/cursos')}
      <section class="admin"><p class="aviso">Lendo ${arquivos.length} documento(s)…
      PDFs grandes levam alguns segundos e a tela pode ficar parada enquanto isso.</p></section>`;

    (async () => {
      const fichas = [];
      for (const arquivo of arquivos) {
        try {
          const documento = await importador.lerArquivo(arquivo);
          fichas.push(gerador.analisarDocumento(documento));
        } catch (erro) {
          fichas.push({
            id: `doc-${arquivo.name}`, nomeArquivo: arquivo.name, tipo: 'material', autor: '', metodo: arquivo.name,
            instrumento: null, idioma: 'indefinido', numeroPaginas: 0, caracteresDeTexto: 0,
            assuntos: [], capitulos: [], midias: [], referencias: [], semTexto: true, erro: erro.message,
          });
        }
      }
      // Nova versão: junta os documentos que já estavam no curso.
      const todas = anterior ? [...anterior.documentos, ...fichas] : fichas;
      const sessaoAtual = editavel.sessao();
      const novo = gerador.montarCurso(todas, {
        instrumentoId, nome: nomeCurso || (anterior ? anterior.nome : ''),
        criadoPor: sessaoAtual ? sessaoAtual.nome : '',
      });
      const salvo = anterior ? cursos.versionar(anterior, novo, sessaoAtual ? sessaoAtual.nome : '') : cursos.guardar(novo);
      auditoria.registrar(auditoria.ACOES.IMPORTAR_CONTEUDO, {
        entidade: 'curso', entidadeId: salvo.id,
        detalhes: `${fichas.length} documento(s) analisados, ${salvo.fases.length} fases`,
      });
      cursoEmAnalise = null;
      ir(`#/painel/curso/${salvo.id}`);
      desenhar();
    })().catch((erro) => {
      window.alert(erro.message);
      ir('#/painel/cursos');
      desenhar();
    });
    return;
  }
  if (evento.target.id === 'arquivo-backup') {
    const arquivo = evento.target.files[0];
    if (!arquivo) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      try {
        const pacote = JSON.parse(String(leitor.result));
        if (!pacote || pacote.formato !== 'estudo-musical-backup') throw new Error('Este arquivo não é um backup completo do sistema.');
        const resumo = editavel.importarTudo(pacote.sistema);
        banco.importarTodosOsProgressos(pacote.progressos || {});
        auditoria.importar(pacote.auditoria || []);
        auditoria.registrar(auditoria.ACOES.IMPORTAR_BACKUP, { entidade: 'sistema', detalhes: `${resumo.metodos} métodos, ${resumo.turmas} turmas` });
        desenhar();
        window.alert(`Backup restaurado: ${resumo.metodos} método(s), ${resumo.turmas} turma(s), ${resumo.contas} conta(s).`);
      } catch (erro) { window.alert(erro.message); }
    };
    leitor.readAsText(arquivo);
    return;
  }
  if (evento.target.id === 'arquivo-metodo') {
    const arquivo = evento.target.files[0];
    if (!arquivo || !metodoDaImportacao) return;
    const metodoId = metodoDaImportacao;
    tela().innerHTML = `${cabecalho('Lendo o arquivo', `#/painel/metodo/${metodoId}`)}
      <section class="admin"><p class="aviso">Lendo <b>${escapar(arquivo.name)}</b>… PDFs grandes levam alguns segundos e a tela pode ficar parada enquanto isso.</p></section>`;
    importador.lerArquivo(arquivo)
      .then((documento) => {
        const proposta = importador.estruturar(documento);
        if (!proposta.fases.length) throw new Error('Li o arquivo, mas não encontrei texto aproveitável nele.');
        propostaImportacao = { ...proposta, metodoId };
        ir(`#/painel/importar/${metodoId}`);
        desenhar();
      })
      .catch((erro) => {
        window.alert(erro.message);
        ir(`#/painel/metodo/${metodoId}`);
        desenhar();
      });
    return;
  }
  if (evento.target.id === 'arquivo-conteudo') {
    const arquivo = evento.target.files[0];
    if (!arquivo) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      try {
        const n = editavel.importar(String(leitor.result));
        desenhar();
        window.alert(`${n} método(s) importados.`);
      } catch (erro) { window.alert(erro.message); }
    };
    leitor.readAsText(arquivo);
    return;
  }
  if (evento.target.id !== 'arquivo-progresso') return;
  const arquivo = evento.target.files[0];
  if (!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try { banco.importar(String(leitor.result)); desenhar(); window.alert('Progresso importado.'); } catch (erro) { window.alert(erro.message); }
  };
  leitor.readAsText(arquivo);
}

// Navegação interna sem <a href>. Dentro da moldura do aplicativo
// (pré-visualização, WebView, app instalado) qualquer link com href faz a
// casca perguntar se pode "abrir link externo", porque o endereço da moldura
// não é o mesmo do site. Aqui os destinos ficam em data-ir e a rota é trocada
// por dentro, então não existe link para a casca interceptar.
function navegar(destino) {
  if (!destino) return;
  avisoDePromocao = '';
  if (window.location.hash === destino) desenhar();
  else window.location.hash = destino;
}

document.addEventListener('click', (evento) => {
  const link = evento.target.closest('[data-ir]');
  if (!link) return;
  evento.preventDefault();
  navegar(link.getAttribute('data-ir'));
});

// Mesmo comportamento pelo teclado, já que estes elementos não são mais
// links de verdade para o navegador.
document.addEventListener('keydown', (evento) => {
  if (evento.key !== 'Enter' && evento.key !== ' ') return;
  const link = evento.target.closest && evento.target.closest('[data-ir]');
  if (!link) return;
  evento.preventDefault();
  navegar(link.getAttribute('data-ir'));
});

document.addEventListener('click', (evento) => {
  const comecar = evento.target.closest('#comecar');
  if (comecar) {
    const nome = document.getElementById('nome').value.trim();
    if (!nome) { document.getElementById('nome').focus(); return; }
    banco.definirAluno(nome);
    editavel.entrarComoAluno(nome);
    ir('#/');
    desenhar();
    return;
  }
  cliques(evento);
});
document.addEventListener('keydown', teclado);
document.addEventListener('change', mudancas);
window.addEventListener('hashchange', desenhar);
window.addEventListener('DOMContentLoaded', desenhar);
if (document.readyState !== 'loading') desenhar();

// Ao abrir: se este app estiver ligado a um banco e houver sessão, busca o
// conteúdo e sobe o progresso. Falha de rede aqui não pode travar nada — o
// app já está desenhado e funcionando com o que tem no aparelho.
sincronia.rotina().catch(() => {});

// A tela da nuvem é a única que mostra o andamento da sincronização, então é
// a única que se redesenha quando ele muda.
sincronia.aoMudar(() => {
  const rota = window.location.hash.replace(/^#/, '').split('/').filter(Boolean)[0];
  if (rota === 'nuvem') desenhar();
});



return {  };
})();
</script>
