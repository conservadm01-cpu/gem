<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e6b">
<title>Estudo Musical — MSA</title>
<style>
/* Estudo Musical — MSA. Desenho pensado para o celular: alvo de toque grande,
   texto legível ao ar livre e contraste que sobrevive à tela do ônibus. */

:root {
  --fundo: #f6f4ef;
  --papel: #ffffff;
  --tinta: #23201c;
  --tinta-fraca: #6b6559;
  --linha: #e2ddd2;
  --marca: #2f9e6b;
  --marca-escura: #1f7350;
  --erro: #c62828;
  --acerto: #2e7d32;
  --sombra: 0 2px 10px rgba(35, 32, 28, .07);
  --raio: 14px;
  color-scheme: light dark;
}

/* Modo escuro: pela preferência do sistema e também quando o app está dentro
   de uma casca que marca o tema na raiz (data-theme). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #14161a;
    --papel: #1c1f25;
    --tinta: #eceae5;
    --tinta-fraca: #a09a90;
    --linha: #2c313a;
    --sombra: 0 2px 10px rgba(0, 0, 0, .35);
  }
}

:root[data-theme="dark"] {
  --fundo: #14161a;
  --papel: #1c1f25;
  --tinta: #eceae5;
  --tinta-fraca: #a09a90;
  --linha: #2c313a;
  --sombra: 0 2px 10px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}

#tela {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px 64px;
}

h1, h2, h3 { line-height: 1.25; }
a { color: inherit; text-decoration: none; }
p { margin: 0 0 12px; }

/* ------------------------------------------------------------------- topo */
.topo {
  display: flex; align-items: center; gap: 8px;
  margin: 4px 0 18px;
}
.topo h1 { font-size: 19px; margin: 0; flex: 1; text-align: center; }
.topo .espaco, .topo .voltar { width: 42px; }
.voltar {
  display: grid; place-items: center;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--papel); box-shadow: var(--sombra);
  font-size: 26px; line-height: 1; padding-bottom: 4px;
}
.topo-inicial { justify-content: space-between; margin-bottom: 12px; }
.topo-inicial h1 { text-align: left; font-size: 26px; margin: 0; }
.ola { color: var(--tinta-fraca); font-size: 14px; }
.avatar {
  display: grid; place-items: center; width: 44px; height: 44px;
  border-radius: 50%; background: var(--papel); box-shadow: var(--sombra); font-size: 20px;
}

.titulo-secao { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-fraca); margin: 26px 0 10px; }

/* --------------------------------------------------------------- início */
.resumo-topo {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  background: var(--papel); border-radius: var(--raio); padding: 14px; box-shadow: var(--sombra);
}
.resumo-topo div { text-align: center; }
.resumo-topo strong { display: block; font-size: 22px; }
.resumo-topo span { font-size: 12px; color: var(--tinta-fraca); }

.atalhos { display: flex; gap: 10px; margin-top: 12px; }
.atalho { flex: 1; text-align: center; background: var(--papel); border-radius: var(--raio); padding: 12px 8px; box-shadow: var(--sombra); font-size: 14px; }

.lista-fases { display: grid; gap: 10px; }
.cartao-fase {
  position: relative; display: flex; gap: 12px; align-items: center;
  background: var(--papel); border-radius: var(--raio); padding: 14px;
  box-shadow: var(--sombra); border-left: 5px solid var(--cor, var(--marca));
}
.cartao-fase.trancada { opacity: .5; }
.cartao-fase.aprovada { border-left-width: 5px; }
.icone-fase { font-size: 28px; width: 42px; text-align: center; }
.corpo-fase { flex: 1; min-width: 0; display: grid; gap: 2px; }
.numero-fase { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--cor, var(--marca)); font-weight: 700; }
.corpo-fase strong { font-size: 16px; }
.sub-fase { font-size: 13px; color: var(--tinta-fraca); }
.mini { font-size: 12px; color: var(--tinta-fraca); }
.mini.centro { text-align: center; }
.barra { height: 5px; background: var(--linha); border-radius: 3px; overflow: hidden; margin: 6px 0 2px; }
.barra span { display: block; height: 100%; background: var(--cor, var(--marca)); }
.selo {
  position: absolute; top: 10px; right: 10px;
  background: var(--cor, var(--marca)); color: #fff; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px;
}
.rodape { margin-top: 28px; font-size: 12px; color: var(--tinta-fraca); }

/* ---------------------------------------------------------- boas-vindas */
.boas-vindas { text-align: center; padding: 32px 4px; }
.boas-vindas .marca { font-size: 64px; }
.boas-vindas h1 { font-size: 32px; margin: 8px 0 16px; }
.boas-vindas h1 span { color: var(--marca); }
.boas-vindas p { text-align: left; }
.boas-vindas label { display: block; text-align: left; font-size: 13px; color: var(--tinta-fraca); margin: 22px 0 6px; }

input[type="text"] {
  width: 100%; padding: 14px; font-size: 16px; border-radius: 12px;
  border: 1.5px solid var(--linha); background: var(--papel); color: var(--tinta);
}
input[type="text"]:focus { outline: 2px solid var(--marca); border-color: transparent; }

/* -------------------------------------------------------------- botões */
.botao {
  display: inline-block; text-align: center; cursor: pointer;
  background: var(--marca); color: #fff; border: none; border-radius: 12px;
  padding: 14px 18px; font-size: 16px; font-weight: 600; font-family: inherit;
  box-shadow: var(--sombra);
}
.botao:active { transform: translateY(1px); }
.botao.grande { display: block; width: 100%; margin: 14px 0 8px; }
.botao.secundario { background: var(--papel); color: var(--tinta); border: 1.5px solid var(--linha); display: block; width: 100%; margin: 8px 0; }
.botao.perigo { background: var(--erro); color: #fff; }
.acoes { display: grid; gap: 8px; margin: 18px 0; }

/* ---------------------------------------------------------------- fase */
.capa-fase {
  background: var(--papel); border-radius: var(--raio); padding: 20px 16px;
  box-shadow: var(--sombra); border-top: 5px solid var(--cor, var(--marca)); text-align: center;
}
.capa-fase .icone-grande { font-size: 44px; }
.capa-fase h2 { margin: 6px 0 4px; font-size: 22px; }
.capa-fase .sub { color: var(--cor, var(--marca)); font-size: 13px; font-weight: 600; }
.capa-fase p { text-align: left; }

.lista-licoes { display: grid; gap: 8px; }
.item-licao {
  display: flex; align-items: center; gap: 12px;
  background: var(--papel); border-radius: 12px; padding: 12px 14px; box-shadow: var(--sombra);
}
.item-licao span { display: block; }
.item-licao small { display: block; color: var(--tinta-fraca); font-size: 12px; }
.item-licao .seta { margin-left: auto; color: var(--tinta-fraca); font-size: 22px; }
.marca-lida {
  width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%;
  display: grid !important; place-items: center;
  background: var(--linha); color: var(--tinta-fraca); font-size: 13px; font-weight: 700;
}
.item-licao.lida .marca-lida { background: var(--acerto); color: #fff; }

.lista-jogos { display: grid; gap: 8px; }
.item-jogo {
  display: block; background: var(--papel); border-radius: 12px; padding: 14px;
  box-shadow: var(--sombra); border-left: 4px solid var(--cor, var(--marca)); position: relative;
}
.item-jogo small { display: block; color: var(--tinta-fraca); font-size: 13px; margin-top: 2px; }
.recorde { position: absolute; top: 12px; right: 12px; font-size: 11px; color: var(--cor); font-weight: 700; }
.recorde.novo { color: var(--tinta-fraca); }

.caixa-prova { background: var(--papel); border-radius: var(--raio); padding: 16px; box-shadow: var(--sombra); }
.alerta { color: #b26a00; }
.aviso { background: var(--papel); border-radius: 12px; padding: 16px; box-shadow: var(--sombra); }
.aviso.leve { font-size: 13px; color: var(--tinta-fraca); }

.historico { margin-top: 22px; }
.linha-historico { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
.ok { color: var(--acerto); font-weight: 600; }
.nao { color: var(--erro); font-weight: 600; }

/* --------------------------------------------------------------- lição */
.licao { background: var(--papel); border-radius: var(--raio); padding: 18px 16px; box-shadow: var(--sombra); }
.licao .etiqueta { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--cor, var(--marca)); }
.licao h2 { margin: 6px 0 14px; font-size: 23px; }
.licao b { color: var(--tinta); }
.lista-chave { padding-left: 20px; margin: 0 0 12px; }
.lista-chave li { margin-bottom: 6px; }
.dica {
  background: color-mix(in srgb, var(--cor, var(--marca)) 12%, transparent);
  border-left: 3px solid var(--cor, var(--marca));
  padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 14px;
}
blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--linha); color: var(--tinta-fraca); font-style: italic; }
.padrao { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .05em; color: var(--cor, var(--marca)); }

.rolagem { overflow-x: auto; margin: 0 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linha); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--tinta-fraca); }

/* ------------------------------------------------------------- notação */
.pentagrama { display: block; width: 100%; max-width: 340px; margin: 10px auto; color: var(--tinta); }
.pentagrama .formula { font-size: 23px; font-weight: 700; font-family: Georgia, serif; fill: currentColor; }
.pentagrama .rotulo { font-size: 11px; fill: var(--tinta-fraca); }
.pentagrama .interrogacao { font-size: 26px; font-weight: 700; fill: var(--marca); }
.pentagrama .destacada { color: var(--marca); }
.tres-claves { display: grid; gap: 4px; }
.tira-figuras { display: flex; gap: 4px; justify-content: space-between; margin: 8px 0 14px; overflow-x: auto; }
.tira-figuras figure { margin: 0; text-align: center; flex: 1; min-width: 58px; }
.tira-figuras figcaption { font-size: 11px; color: var(--tinta-fraca); }
.figura { color: var(--tinta); }

.quadro-teclado { overflow-x: auto; margin: 12px 0; }
.teclado { min-width: 280px; width: 100%; max-width: 420px; display: block; margin: 0 auto; }
.tecla.branca { fill: #fbfbfb; stroke: #4a4a4a; stroke-width: 1; }
.tecla.preta { fill: #23201c; }
.tecla.marcada.tonica { fill: #f2a33c; }
.tecla.marcada.grau { fill: #8ecdb0; }
.tecla.marcada.alterada { fill: #7cb6f2; }
.tecla.certa { fill: #7bd18f; }
.tecla.errada { fill: #ef8a8a; }
.tecla.clicavel { cursor: pointer; }
.rotulo-tecla { font-size: 9px; fill: #666; pointer-events: none; }

/* ------------------------------------------------------------- questão */
.progresso-prova { height: 6px; background: var(--linha); border-radius: 3px; overflow: hidden; }
.progresso-prova span { display: block; height: 100%; background: var(--marca); transition: width .3s; }
.contador { font-size: 13px; color: var(--tinta-fraca); margin: 8px 0 4px; }
.questao { background: var(--papel); border-radius: var(--raio); padding: 18px 16px; box-shadow: var(--sombra); }
.questao h2 { font-size: 19px; margin: 0 0 12px; }
.ilustracao { margin: 0 0 14px; }
.alternativas { display: grid; gap: 8px; }
.alternativa {
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--fundo); border: 1.5px solid var(--linha); border-radius: 12px;
  padding: 13px 14px; font-size: 15px; font-family: inherit; color: inherit; cursor: pointer;
}
.alternativa .letra {
  width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%;
  display: grid; place-items: center; background: var(--papel);
  border: 1.5px solid var(--linha); font-size: 13px; font-weight: 700;
}
.alternativa.certa { border-color: var(--acerto); background: color-mix(in srgb, var(--acerto) 14%, transparent); }
.alternativa.errada { border-color: var(--erro); background: color-mix(in srgb, var(--erro) 14%, transparent); }
.alternativa:disabled { cursor: default; }
.retorno { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--linha); font-size: 15px; }

/* ----------------------------------------------------------- resultado */
.resultado { background: var(--papel); border-radius: var(--raio); padding: 24px 16px; box-shadow: var(--sombra); text-align: center; }
.resultado .nota { font-size: 52px; font-weight: 800; color: var(--cor, var(--marca)); line-height: 1; }
.resultado.reprovado .nota { color: var(--erro); }
.resultado strong { display: block; font-size: 20px; margin: 6px 0 4px; }
.revisao { display: grid; gap: 10px; }
.item-revisao { background: var(--papel); border-radius: 12px; padding: 14px; box-shadow: var(--sombra); font-size: 14px; }
.item-revisao .pergunta { font-weight: 600; }
.item-revisao .sua { color: var(--erro); }
.item-revisao .certa { color: var(--acerto); }

/* --------------------------------------------------------------- jogos */
.jogo { background: var(--papel); border-radius: var(--raio); padding: 16px; box-shadow: var(--sombra); }
.instrucao { font-size: 15px; }
.placar-jogo { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--cor, var(--marca)); margin-bottom: 10px; }
.palco { min-height: 130px; display: grid; place-items: center; }
.etiqueta-clave { font-size: 12px; color: var(--tinta-fraca); text-align: center; }
.grade-memoria { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.carta {
  position: relative; min-height: 92px; border-radius: 12px; border: 1.5px solid var(--linha);
  background: var(--fundo); cursor: pointer; padding: 8px; font-family: inherit; font-size: 13px; color: inherit;
}
.carta .verso { font-size: 26px; color: var(--tinta-fraca); }
.carta .frente { display: none; }
.carta.aberta .verso, .carta.achada .verso { display: none; }
.carta.aberta .frente, .carta.achada .frente { display: block; }
.carta.achada { border-color: var(--acerto); background: color-mix(in srgb, var(--acerto) 12%, transparent); }
.botoes-notas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.botao-nota {
  flex: 1 1 60px; padding: 14px 8px; border-radius: 12px; border: 1.5px solid var(--linha);
  background: var(--fundo); font-size: 16px; font-family: inherit; color: inherit; cursor: pointer;
}
.botao-nota.largo { flex-basis: 100%; }
.botao-nota.certo, .botao-figura.certo { border-color: var(--acerto); background: color-mix(in srgb, var(--acerto) 16%, transparent); }
.botao-nota.errado, .botao-figura.errado { border-color: var(--erro); background: color-mix(in srgb, var(--erro) 16%, transparent); }
.paleta-figuras { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
.botao-figura { border-radius: 12px; border: 1.5px solid var(--linha); background: var(--fundo); padding: 4px 8px; cursor: pointer; color: inherit; }
.acoes-jogo { display: flex; gap: 8px; margin-top: 12px; }
.acoes-jogo .botao { flex: 1; }
.alvo-pulso {
  display: block; width: 160px; height: 160px; margin: 18px auto 0; border-radius: 50%;
  border: 3px solid var(--linha); background: var(--fundo); font-size: 16px; font-weight: 700;
  font-family: inherit; color: var(--tinta-fraca); cursor: pointer;
}
.alvo-pulso span { font-weight: 400; font-size: 13px; }
.alvo-pulso.forte { border-color: var(--marca); background: color-mix(in srgb, var(--marca) 22%, transparent); }
.alvo-pulso.fraco { border-color: var(--marca); }
.resultado-jogo { margin-top: 16px; text-align: center; border-top: 1px solid var(--linha); padding-top: 14px; }
.resultado-jogo strong { font-size: 28px; color: var(--cor, var(--marca)); }

/* -------------------------------------------------------- certificados */
.lista-certificados { display: grid; gap: 10px; }
.cartao-certificado {
  display: grid; gap: 2px; background: var(--papel); border-radius: var(--raio);
  padding: 14px; box-shadow: var(--sombra); border-left: 5px solid var(--cor, var(--marca)); font-size: 14px;
}
.cartao-certificado .codigo { font-family: "Courier New", monospace; font-size: 12px; color: var(--tinta-fraca); }
.moldura-certificado { background: #fff; color: #23201c; border-radius: var(--raio); padding: 8px; box-shadow: var(--sombra); overflow-x: auto; }
.certificado-svg { display: block; min-width: 320px; }

.sobre { background: var(--papel); border-radius: var(--raio); padding: 18px 16px; box-shadow: var(--sombra); }
.sobre h3 { margin: 18px 0 6px; font-size: 16px; }
.sobre h3:first-child { margin-top: 0; }
.sobre label { display: block; font-size: 13px; color: var(--tinta-fraca); margin: 16px 0 6px; }

/* Elementos de navegação interna (sem href, para a casca do app não tratar
   como link externo): mantêm a aparência e o cursor de link. */
[data-ir] { cursor: pointer; }

.entrada { text-align: center; padding: 28px 4px 12px; }
.entrada .marca { font-size: 60px; }
.entrada h1 { font-size: 30px; margin: 6px 0 18px; }
.entrada h1 span { color: var(--marca); }
.perfis { display: grid; gap: 12px; margin: 18px 0; text-align: left; }
.perfil {
  display: grid; grid-template-columns: 46px 1fr; gap: 4px 14px; align-items: center;
  background: var(--papel); border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 16px; cursor: pointer; border-left: 5px solid var(--marca);
}
.perfil .icone { grid-row: span 2; font-size: 30px; text-align: center; }
.perfil strong { font-size: 17px; }
.perfil small { color: var(--tinta-fraca); font-size: 13px; }
.perfil:active { transform: scale(.99); }

.confirmando { background: var(--erro) !important; color: #fff !important; animation: pulsa 1s ease-in-out infinite; }
@keyframes pulsa { 50% { opacity: .78; } }

.numeros-curso { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.numeros-curso > div {
  background: var(--fundo); border-radius: var(--raio); padding: 10px; text-align: center;
}
.numeros-curso b { display: block; font-size: 19px; }
.numeros-curso span { font-size: 11px; color: var(--tinta-fraca); }

.barra-progresso {
  display: inline-block; flex: 1; height: 10px; border-radius: 5px;
  background: var(--linha); overflow: hidden; margin: 0 8px;
}
.barra-progresso > span { display: block; height: 100%; background: var(--marca); }
.linha-progresso { display: flex; align-items: center; font-size: 13px; margin: 6px 0; }
.linha-progresso > span:first-child { min-width: 34%; }
.progressos { margin: 10px 0 6px; }
.bloqueio {
  background: var(--papel); border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 14px 16px; margin-bottom: 16px; border-left: 5px solid #b26a00;
}
.requisitos { border-top: 1px dashed var(--linha); margin-top: 12px; padding-top: 10px; }
.requisitos-bloqueio { margin-top: 8px; }
.festa { background: var(--papel); border-left: 5px solid var(--acerto); }
.linha-auditoria { border-bottom: 1px solid var(--linha); padding: 8px 0; display: grid; gap: 2px; }

.carta-curiosidade {
  background: var(--papel); border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 16px; margin-top: 12px; border-left: 5px solid var(--cor, var(--marca));
}
.carta-curiosidade h3 { font-size: 17px; margin-bottom: 12px; }
.alternativas-jogo { display: grid; gap: 8px; }
.alternativas-jogo .certo { background: var(--acerto); color: #fff; }
.alternativas-jogo .errado { background: var(--erro); color: #fff; }
.explicacao-curiosidade { margin-top: 14px; display: grid; gap: 10px; }

.resumo-turma {
  background: var(--papel); border-radius: var(--raio); box-shadow: var(--sombra);
  padding: 14px 16px; margin-bottom: 16px; display: grid; gap: 2px;
  border-left: 5px solid var(--marca);
}
.resumo-turma strong { font-size: 18px; }
.faixa-nivel { margin: -6px 0 10px; }
.faixa { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.faixa label { margin-top: 10px; }

.linha-check { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 14px; color: var(--tinta); }
.linha-check input { width: 20px; height: 20px; }
.licao-proposta { border-top: 1px dashed var(--linha); padding-top: 10px; margin-top: 12px; }

/* ------------------------------------------------------ painel e cadastro */
input[type="password"], textarea, select {
  width: 100%; padding: 14px; font-size: 16px; border-radius: 12px;

<script>
const __modulos = {};
__modulos['aleatorio'] = (function () {
// Sorteio com semente: a mesma semente devolve sempre a mesma prova, o que
// permite refazer uma avaliação exatamente como ela caiu (e conferir um
// certificado) sem guardar as perguntas inteiras.

function novaSemente() {
  const buffer = new Uint32Array(1);
  (globalThis.crypto || {}).getRandomValues?.(buffer);
  return buffer[0] || Math.floor(Math.random() * 4294967295);
}

function criarAleatorio(semente) {
  let estado = (semente >>> 0) || 1;
  return function aleatorio() {
    estado |= 0;
    estado = (estado + 0x6d2b79f5) | 0;
    let t = Math.imul(estado ^ (estado >>> 15), 1 | estado);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function inteiro(rnd, minimo, maximo) {
  return minimo + Math.floor(rnd() * (maximo - minimo + 1));
}

function sortear(lista, rnd) {
  return lista[Math.floor(rnd() * lista.length)];
}

function embaralhar(lista, rnd) {
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

// Sorteia n itens distintos, sem repetir.
function sortearVarios(lista, n, rnd) {
  return embaralhar(lista, rnd).slice(0, n);
}

// Hash estável de texto (assinatura de pergunta, código de certificado).
function hash(texto) {
  let h = 2166136261;
  for (let i = 0; i < texto.length; i++) {
    h ^= texto.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36).toUpperCase();
}

return { novaSemente, criarAleatorio, inteiro, sortear, embaralhar, sortearVarios, hash };
})();

__modulos['musica'] = (function () {
// Núcleo de teoria musical do método: notas, figuras, compassos, escalas,
// armaduras e intervalos. Tudo em português, com a mesma nomenclatura do
// Método Simplificado de Aprendizagem Musical (MSA).

const LETRAS = ['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'];
const CIFRAS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const SEMITONS_DA_LETRA = [0, 2, 4, 5, 7, 9, 11];

const SINAIS = { '-2': '𝄫', '-1': '♭', 0: '', 1: '♯', 2: '𝄪' };
const NOME_DO_SINAL = {
  '-2': 'dobrado bemol', '-1': 'bemol', 0: 'natural', 1: 'sustenido', 2: 'dobrado sustenido',
};

function nota(letra, alteracao = 0) {
  return { letra, alteracao };
}

function nomeDaNota(n, { curto = false } = {}) {
  if (!n.alteracao) return n.letra;
  return curto ? n.letra + SINAIS[n.alteracao] : `${n.letra} ${NOME_DO_SINAL[n.alteracao]}`;
}

function semitomDaNota(n) {
  return (SEMITONS_DA_LETRA[LETRAS.indexOf(n.letra)] + n.alteracao + 120) % 12;
}

// ---------------------------------------------------------------- figuras

// duracao = tempos em compasso simples cuja unidade de tempo é a semínima.
const FIGURAS = [
  { id: 'semibreve', nome: 'semibreve', pausa: 'pausa de semibreve', duracao: 4, equivalencia: 1 },
  { id: 'minima', nome: 'mínima', pausa: 'pausa de mínima', duracao: 2, equivalencia: 2 },
  { id: 'seminima', nome: 'semínima', pausa: 'pausa de semínima', duracao: 1, equivalencia: 4 },
  { id: 'colcheia', nome: 'colcheia', pausa: 'pausa de colcheia', duracao: 0.5, equivalencia: 8 },
  { id: 'semicolcheia', nome: 'semicolcheia', pausa: 'pausa de semicolcheia', duracao: 0.25, equivalencia: 16 },
  { id: 'fusa', nome: 'fusa', pausa: 'pausa de fusa', duracao: 0.125, equivalencia: 32 },
  { id: 'semifusa', nome: 'semifusa', pausa: 'pausa de semifusa', duracao: 0.0625, equivalencia: 64 },
];

const figuraPorId = (id) => FIGURAS.find((f) => f.id === id);

function fracaoBonita(valor) {
  if (Number.isInteger(valor)) return String(valor);
  const denominadores = [2, 4, 8, 16, 32];
  for (const d of denominadores) {
    if (Math.abs(valor * d - Math.round(valor * d)) < 1e-9) {
      const n = Math.round(valor * d);
      const inteiro = Math.floor(n / d);
      const resto = n - inteiro * d;
      if (!resto) return String(inteiro);
      return inteiro ? `${inteiro} e ${resto}/${d}` : `${resto}/${d}`;
    }
  }
  return String(valor);
}

// ------------------------------------------------------------- compassos

const COMPASSOS_SIMPLES = [
  { formula: '2/4', tempos: 2, unidade: 'seminima', especie: 'binário', nome: 'binário simples' },
  { formula: '3/4', tempos: 3, unidade: 'seminima', especie: 'ternário', nome: 'ternário simples' },
  { formula: '4/4', tempos: 4, unidade: 'seminima', especie: 'quaternário', nome: 'quaternário simples' },
  { formula: '2/2', tempos: 2, unidade: 'minima', especie: 'binário', nome: 'binário simples' },
  { formula: '3/2', tempos: 3, unidade: 'minima', especie: 'ternário', nome: 'ternário simples' },
  { formula: '4/2', tempos: 4, unidade: 'minima', especie: 'quaternário', nome: 'quaternário simples' },
  { formula: '2/8', tempos: 2, unidade: 'colcheia', especie: 'binário', nome: 'binário simples' },
  { formula: '3/8', tempos: 3, unidade: 'colcheia', especie: 'ternário', nome: 'ternário simples' },
  { formula: '4/8', tempos: 4, unidade: 'colcheia', especie: 'quaternário', nome: 'quaternário simples' },
];

const COMPASSOS_COMPOSTOS = [
  { formula: '6/8', tempos: 2, unidade: 'colcheia pontuada', especie: 'binário', nome: 'binário composto', simples: '2/4' },
  { formula: '9/8', tempos: 3, unidade: 'colcheia pontuada', especie: 'ternário', nome: 'ternário composto', simples: '3/4' },
  { formula: '12/8', tempos: 4, unidade: 'colcheia pontuada', especie: 'quaternário', nome: 'quaternário composto', simples: '4/4' },
  { formula: '6/4', tempos: 2, unidade: 'semínima pontuada', especie: 'binário', nome: 'binário composto', simples: '2/2' },
  { formula: '9/4', tempos: 3, unidade: 'semínima pontuada', especie: 'ternário', nome: 'ternário composto', simples: '3/2' },
  { formula: '12/4', tempos: 4, unidade: 'semínima pontuada', especie: 'quaternário', nome: 'quaternário composto', simples: '4/2' },
  { formula: '6/16', tempos: 2, unidade: 'semicolcheia pontuada', especie: 'binário', nome: 'binário composto', simples: '2/8' },
  { formula: '9/16', tempos: 3, unidade: 'semicolcheia pontuada', especie: 'ternário', nome: 'ternário composto', simples: '3/8' },
];

// ------------------------------------------------------------------ claves

// base = índice diatônico (oitava * 7 + grau) da 1ª linha do pentagrama.
const CLAVES = {
  sol: { id: 'sol', nome: 'clave de Sol', linha: 2, base: 4 * 7 + 2, referencia: 'Sol 2ª linha' },
  do: { id: 'do', nome: 'clave de Dó', linha: 3, base: 3 * 7 + 3, referencia: 'Dó 3ª linha' },
  fa: { id: 'fa', nome: 'clave de Fá', linha: 4, base: 2 * 7 + 4, referencia: 'Fá 4ª linha' },
};

// posicao: 0 = 1ª linha, 1 = 1º espaço, 2 = 2ª linha ... (sobe de meio em meio)
function notaDaPosicao(claveId, posicao) {
  const diatonico = CLAVES[claveId].base + posicao;
  return { letra: LETRAS[((diatonico % 7) + 7) % 7], oitava: Math.floor(diatonico / 7), alteracao: 0 };
}

function posicaoDaNota(claveId, letra, oitava) {
  return oitava * 7 + LETRAS.indexOf(letra) - CLAVES[claveId].base;
}

function nomeDoLugar(posicao) {
  const numero = Math.floor(posicao / 2) + 1;
  const ordinal = ['1ª', '2ª', '3ª', '4ª', '5ª'][numero - 1];
  if (posicao < 0 || posicao > 8) return posicao < 0 ? 'linha suplementar inferior' : 'linha suplementar superior';
  return posicao % 2 === 0 ? `${ordinal} linha` : `${['1º', '2º', '3º', '4º'][Math.floor(posicao / 2)]} espaço`;
}

// ------------------------------------------------------- escalas e armaduras

const PADRAO_MAIOR = [2, 2, 1, 2, 2, 2, 1]; // T T st T T T st
const PADRAO_MENOR_NATURAL = [2, 1, 2, 2, 1, 2, 2];

function escala(tonica, padrao = PADRAO_MAIOR) {
  const indiceLetra = LETRAS.indexOf(tonica.letra);
  const notas = [tonica];
  let semitomAcumulado = semitomDaNota(tonica);
  for (let grau = 1; grau < 7; grau++) {
    semitomAcumulado += padrao[grau - 1];
    const letra = LETRAS[(indiceLetra + grau) % 7];
    const natural = SEMITONS_DA_LETRA[LETRAS.indexOf(letra)];
    let alteracao = (((semitomAcumulado % 12) - natural + 18) % 12) - 6;
    if (alteracao > 2) alteracao -= 12;
    if (alteracao < -2) alteracao += 12;
    notas.push(nota(letra, alteracao));
  }
  notas.push(nota(tonica.letra, tonica.alteracao));
  return notas;
}

const ORDEM_SUSTENIDOS = ['Fá', 'Dó', 'Sol', 'Ré', 'Lá', 'Mi', 'Si'];
const ORDEM_BEMOIS = ['Si', 'Mi', 'Lá', 'Ré', 'Sol', 'Dó', 'Fá'];

const TONALIDADES = [
  { maior: nota('Dó'), menor: nota('Lá'), acidentes: 0, tipo: 'natural' },
  { maior: nota('Sol'), menor: nota('Mi'), acidentes: 1, tipo: 'sustenido' },
  { maior: nota('Ré'), menor: nota('Si'), acidentes: 2, tipo: 'sustenido' },
  { maior: nota('Lá'), menor: nota('Fá', 1), acidentes: 3, tipo: 'sustenido' },
  { maior: nota('Mi'), menor: nota('Dó', 1), acidentes: 4, tipo: 'sustenido' },
  { maior: nota('Si'), menor: nota('Sol', 1), acidentes: 5, tipo: 'sustenido' },
  { maior: nota('Fá', 1), menor: nota('Ré', 1), acidentes: 6, tipo: 'sustenido' },
  { maior: nota('Dó', 1), menor: nota('Lá', 1), acidentes: 7, tipo: 'sustenido' },
  { maior: nota('Fá'), menor: nota('Ré'), acidentes: 1, tipo: 'bemol' },
  { maior: nota('Si', -1), menor: nota('Sol'), acidentes: 2, tipo: 'bemol' },
  { maior: nota('Mi', -1), menor: nota('Dó'), acidentes: 3, tipo: 'bemol' },
  { maior: nota('Lá', -1), menor: nota('Fá'), acidentes: 4, tipo: 'bemol' },
  { maior: nota('Ré', -1), menor: nota('Si', -1), acidentes: 5, tipo: 'bemol' },
  { maior: nota('Sol', -1), menor: nota('Mi', -1), acidentes: 6, tipo: 'bemol' },
  { maior: nota('Dó', -1), menor: nota('Lá', -1), acidentes: 7, tipo: 'bemol' },
];

function armaduraDe(tonalidade) {
  const ordem = tonalidade.tipo === 'bemol' ? ORDEM_BEMOIS : ORDEM_SUSTENIDOS;
  return ordem.slice(0, tonalidade.acidentes);
}

function nomeDaTonalidade(tonalidade, modo = 'maior') {
  const n = modo === 'maior' ? tonalidade.maior : tonalidade.menor;
  return `${nomeDaNota(n)} ${modo === 'maior' ? 'Maior' : 'menor'}`;
}

// -------------------------------------------------------------- intervalos

const NOMES_DE_INTERVALO = ['uníssono', '2ª', '3ª', '4ª', '5ª', '6ª', '7ª', '8ª'];
const JUSTOS = [0, 3, 4, 7]; // graus (0-based) de uníssono, 4ª, 5ª e 8ª
const SEMITONS_JUSTOS = [0, 5, 7, 12];
const SEMITONS_MAIORES = [2, 4, 9, 11]; // 2ª, 3ª, 6ª, 7ª maiores

function intervalo(a, b) {
  const grau = (LETRAS.indexOf(b.letra) - LETRAS.indexOf(a.letra) + 7) % 7;
  const semitons = (semitomDaNota(b) - semitomDaNota(a) + 12) % 12;
  const numero = grau + 1;
  const ehJusto = JUSTOS.includes(grau);
  const referencia = ehJusto
    ? SEMITONS_JUSTOS[JUSTOS.indexOf(grau)] % 12
    : SEMITONS_MAIORES[[1, 2, 5, 6].indexOf(grau)];
  let diferenca = ((semitons - referencia + 18) % 12) - 6;
  let qualidade;
  if (diferenca === 0) qualidade = ehJusto ? 'justa' : 'maior';
  else if (diferenca === -1) qualidade = ehJusto ? 'diminuta' : 'menor';
  else if (diferenca === 1) qualidade = 'aumentada';
  else if (diferenca === -2) qualidade = 'diminuta';
  else qualidade = 'aumentada';
  return { numero, nome: NOMES_DE_INTERVALO[grau], qualidade, semitons, rotulo: `${NOMES_DE_INTERVALO[grau]} ${qualidade}` };
}

// ------------------------------------------------------------ vocabulário

const ANDAMENTOS = [
  { termo: 'Largo', faixa: '40 a 60 bpm', sentido: 'muito lento e largo' },

const PROPRIEDADES_DO_SOM = [
  { nome: 'altura', artigo: 'A', definicao: 'é o grau de elevação do som: som grave ou som agudo' },
  { nome: 'duração', artigo: 'A', definicao: 'é o tempo que o som permanece: som longo ou som curto' },
  { nome: 'intensidade', artigo: 'A', definicao: 'é o volume do som: som forte ou som fraco' },

// Som do app: notas, metrônomo e efeitos, feitos na hora com Web Audio.
// Sem arquivos de áudio, para o app continuar leve e funcionar offline.

let contexto = null;

function contextoDeAudio() {
  if (!contexto) {
    const Classe = window.AudioContext || window.webkitAudioContext;
    if (!Classe) return null;
    contexto = new Classe();
  }
  if (contexto.state === 'suspended') contexto.resume();
  return contexto;
}

const audioDisponivel = () => Boolean(window.AudioContext || window.webkitAudioContext);

const SEMITONS = { 'Dó': 0, 'Ré': 2, 'Mi': 4, 'Fá': 5, 'Sol': 7, 'Lá': 9, 'Si': 11 };

function frequencia(letra, oitava = 4, alteracao = 0) {
  const semitom = SEMITONS[letra] + alteracao + (oitava - 4) * 12;
  // Lá4 = 440 Hz e está 9 semitons acima do Dó4.
  return 440 * Math.pow(2, (semitom - 9) / 12);
}

function tocarFrequencia(hz, { duracao = 0.6, volume = 0.25, timbre = 'triangle', atraso = 0 } = {}) {
  const ctx = contextoDeAudio();
  if (!ctx) return;
  const inicio = ctx.currentTime + atraso;
  const oscilador = ctx.createOscillator();
  const ganho = ctx.createGain();
  oscilador.type = timbre;
  oscilador.frequency.value = hz;
  ganho.gain.setValueAtTime(0.0001, inicio);
  ganho.gain.exponentialRampToValueAtTime(volume, inicio + 0.02);
  ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + duracao);
  oscilador.connect(ganho).connect(ctx.destination);
  oscilador.start(inicio);
  oscilador.stop(inicio + duracao + 0.05);
}

const tocarNota = (letra, oitava = 4, opcoes = {}) => tocarFrequencia(frequencia(letra, oitava, opcoes.alteracao || 0), opcoes);

function tocarSequencia(notas, { intervalo = 0.55, duracao = 0.5, volume = 0.25 } = {}) {
  notas.forEach((n, i) => tocarFrequencia(
    typeof n === 'number' ? n : frequencia(n.letra, n.oitava ?? 4, n.alteracao || 0),
    { duracao, volume, atraso: i * intervalo },
  ));
}

function efeito(tipo) {
  if (tipo === 'acerto') tocarSequencia([frequencia('Dó', 5), frequencia('Mi', 5), frequencia('Sol', 5)], { intervalo: 0.09, duracao: 0.18, volume: 0.2 });
  else if (tipo === 'erro') tocarSequencia([frequencia('Si', 3), frequencia('Fá', 3)], { intervalo: 0.13, duracao: 0.25, volume: 0.18 });
  else if (tipo === 'vitoria') tocarSequencia([frequencia('Dó', 5), frequencia('Mi', 5), frequencia('Sol', 5), frequencia('Dó', 6)], { intervalo: 0.14, duracao: 0.3, volume: 0.22 });
}

// Metrônomo agendado no relógio do áudio, que não escorrega como o setInterval.
class Metronomo {
  constructor({ bpm = 80, porCompasso = 4, aoBater = null } = {}) {
    this.bpm = bpm;
    this.porCompasso = porCompasso;
    this.aoBater = aoBater;
    this.tocando = false;
    this.batida = 0;
    this.proxima = 0;
    this.timer = null;
  }

  clique(forte, quando) {
    const ctx = contextoDeAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const ganho = ctx.createGain();
    osc.frequency.value = forte ? 1600 : 1000;
    ganho.gain.setValueAtTime(forte ? 0.35 : 0.2, quando);
    ganho.gain.exponentialRampToValueAtTime(0.0001, quando + 0.06);
    osc.connect(ganho).connect(ctx.destination);
    osc.start(quando);
    osc.stop(quando + 0.08);
  }

  comecar() {
    const ctx = contextoDeAudio();
    if (!ctx || this.tocando) return;
    this.tocando = true;
    this.batida = 0;
    this.proxima = ctx.currentTime + 0.12;
    const agendar = () => {
      if (!this.tocando) return;
      while (this.proxima < ctx.currentTime + 0.2) {
        const forte = this.batida % this.porCompasso === 0;
        this.clique(forte, this.proxima);
        if (this.aoBater) this.aoBater(this.batida, forte, this.proxima);
        this.batida++;
        this.proxima += 60 / this.bpm;
      }
      this.timer = setTimeout(agendar, 60);
    };
    agendar();
  }

  parar() {
    this.tocando = false;
    clearTimeout(this.timer);
  }

  ajustar(bpm) {
    this.bpm = bpm;
  }
}

__modulos['download'] = (function () {
// Entrega de arquivo ao aluno (certificado em PNG, cópia do progresso).
// Quando o app está rodando dentro de uma casca que controla os downloads,
// pede por ela; fora disso, usa o link de download do próprio navegador.

async function viaPlataforma(nomeArquivo, dados) {
  const casca = window.claude;
  if (!casca || typeof casca.use !== 'function') return false;
  const downloads = await casca.use('downloads');
  if (!downloads) return false;
  await downloads.save({ filename: nomeArquivo, data: dados });
  return true;
}

function viaNavegador(nomeArquivo, dados) {
  const url = URL.createObjectURL(dados);
  const link = document.createElement('a');
  link.href = url;
  link.download = nomeArquivo;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function salvarArquivo(nomeArquivo, dados) {
  try {
    if (await viaPlataforma(nomeArquivo, dados)) return 'salvo';
  } catch (erro) {
    // O aluno recusou a gravação, ou a casca não deixou: não há o que fazer.
    if (erro && erro.code === 'declined') return 'recusado';
  }
  viaNavegador(nomeArquivo, dados);
  return 'salvo';
}

return { salvarArquivo };
})();

__modulos['conteudo/geradores'] = (function () {
// Geradores de pergunta. Cada gerador declara o seu universo de VARIANTES —
// e cada variante tem uma chave única. A avaliação sorteia sempre entre as
// variantes que aquele aluno ainda não recebeu, então a mesma pergunta nunca
// cai duas vezes, embora o assunto seja sempre o da fase.

const { embaralhar, sortear } = __modulos['aleatorio'];
const { pentagrama, figuraSolta, teclado } = __modulos['notacao'];
const T = __modulos['musica'];

const nomeCurto = (n) => T.nomeDaNota(n, { curto: true });
const ordinal = ['', '1º', '2º', '3º', '4º', '5º', '6º', '7º', '8º'];

// Monta 4 alternativas: a certa e três erradas tiradas do repertório do assunto.
function alternativas(correta, repertorio, rnd, quantidade = 4) {
  const vistas = new Set([String(correta)]);
  const distratores = [];
  for (const item of embaralhar(repertorio, rnd)) {
    const texto = String(item);
    if (vistas.has(texto)) continue;
    vistas.add(texto);
    distratores.push(texto);
    if (distratores.length === quantidade - 1) break;
  }
  return embaralhar([String(correta), ...distratores], rnd);
}

registrar({
  id: 'f3.quantas-figuras',
  fase: 3,
  variantes: () => T.COMPASSOS_SIMPLES.flatMap((c) => ['semibreve', 'minima', 'seminima', 'colcheia', 'semicolcheia']
    .map((f) => ({ c: c.formula, f }))
    .filter(({ c: formula, f }) => {
      const comp = T.COMPASSOS_SIMPLES.find((x) => x.formula === formula);
      const total = comp.tempos * T.figuraPorId(comp.unidade).duracao;
      const q = total / T.figuraPorId(f).duracao;
      return Number.isInteger(q) && q > 0 && q <= 32;
    })),
  chave: (v) => `${v.c}-${v.f}`,

    const total = c.tempos * T.figuraPorId(c.unidade).duracao;
    const quantidade = Math.round(total / figura.duracao);
    return {
      enunciado: `Quantas ${figura.nome}s são necessárias para completar um compasso ${c.formula}?`,

registrar({
  id: 'f3.completa-compasso',
  fase: 3,
  variantes: () => ['2/4', '3/4', '4/4'].flatMap((f) => ['seminima', 'minima', 'colcheia', 'semicolcheia'].flatMap((falta) =>
    [0, 1].map((arranjo) => ({ f, falta, arranjo })))),
  chave: (v) => `${v.f}-${v.falta}-${v.arranjo}`,
  montar(v, rnd) {
    const c = T.COMPASSOS_SIMPLES.find((x) => x.formula === v.f);
    const faltante = T.figuraPorId(v.falta);
    const restante = c.tempos - faltante.duracao;
    if (restante <= 0) {
      return {
        enunciado: `Uma única figura preenche sozinha o compasso ${c.formula}. Qual é ela?`,
        alternativas: alternativas(T.FIGURAS.find((f) => f.duracao === c.tempos)?.nome || 'semibreve', T.FIGURAS.map((f) => f.nome), rnd),
        correta: T.FIGURAS.find((f) => f.duracao === c.tempos)?.nome || 'semibreve',
        explicacao: `Em ${c.formula} cabem ${c.tempos} tempos.`,
        referencia: 'MSA, pág. 24',
      };
    }
    // Escreve o que já está no compasso e pergunta o que falta.
    const escrito = [];
    let sobra = restante;
    const paleta = v.arranjo === 0 ? ['seminima', 'colcheia'] : ['minima', 'seminima'];
    for (const id of paleta) {
      const f = T.figuraPorId(id);
      while (sobra - f.duracao >= -1e-9 && escrito.length < 6) { escrito.push(id); sobra = +(sobra - f.duracao).toFixed(4); }
    }
    while (sobra > 1e-9) { escrito.push('semicolcheia'); sobra = +(sobra - 0.25).toFixed(4); }
    return {
      enunciado: `Que figura falta para completar este compasso ${c.formula}?`,
      html: pentagrama({
        clave: 'sol', compasso: c.formula, largura: 320,
        notas: escrito.map((id) => ({ letra: 'Si', oitava: 4, figura: id })).concat([{ letra: 'Si', oitava: 4, figura: 'seminima', pausa: true, interrogacao: true }]),
      }),
      alternativas: alternativas(faltante.nome, T.FIGURAS.map((f) => f.nome), rnd),
      correta: faltante.nome,
      explicacao: `O compasso ${c.formula} tem ${c.tempos} tempos; o que está escrito soma ${T.fracaoBonita(restante)}. Falta ${T.fracaoBonita(faltante.duracao)} tempo(s): uma ${faltante.nome}.`,
      referencia: 'MSA, pág. 24',
    };
  },
});

registrar({
  id: 'f5.altera-nota',
  fase: 5,
  variantes: () => T.LETRAS.flatMap((l) => [
    { l, op: 'sobe-semitom' }, { l, op: 'desce-semitom' }, { l, op: 'sobe-tom' }, { l, op: 'desce-tom' },
  ]),
  chave: (v) => `${v.l}-${v.op}`,
  montar(v, rnd) {
    const mapa = {
      'sobe-semitom': { texto: 'um semitom acima', alt: 1 }, 'desce-semitom': { texto: 'um semitom abaixo', alt: -1 },
      'sobe-tom': { texto: 'um tom acima', alt: 2 }, 'desce-tom': { texto: 'um tom abaixo', alt: -2 },
    }[v.op];
    const base = T.nota(v.l);
    const alvo = (T.semitomDaNota(base) + mapa.alt + 12) % 12;
    // Mantém o nome da letra quando cabe (alteração cromática); senão usa a vizinha natural.
    let resposta = null;
    for (const alteracao of [0, 1, -1, 2, -2]) {
      const candidata = T.nota(v.l, alteracao);
      if (T.semitomDaNota(candidata) === alvo && Math.abs(alteracao) <= 2) { resposta = candidata; break; }
    }
    if (!resposta || Math.abs(resposta.alteracao) > 1) {
      const vizinha = T.LETRAS.find((l) => T.SEMITONS_DA_LETRA[T.LETRAS.indexOf(l)] === alvo);
      if (vizinha) resposta = T.nota(vizinha);
    }
    const nome = T.nomeDaNota(resposta);
    const repertorio = TODAS_AS_NOTAS.map((n) => T.nomeDaNota(n));
    return {
      enunciado: `Que nota fica ${mapa.texto} de ${v.l}?`,
      alternativas: alternativas(nome, repertorio, rnd),
      correta: nome,
      explicacao: `Contando ${mapa.texto} a partir de ${v.l} no teclado, chega-se a ${nome}.`,
      referencia: 'MSA, pág. 52 e 53',
    };
  },
});

__modulos['armazenamento'] = (function () {
// Progresso do aluno, guardado no próprio aparelho (localStorage). Nada sai
// do celular: o app funciona offline e sem cadastro em servidor nenhum.

const CHAVE = 'msa.progresso.v1';

// Cada conta de aluno guarda o próprio progresso no aparelho. A conta sem id
// (quem entra só com o nome) fica na chave original, para ninguém perder o
// que já estudou.
let contaAtual = '';
const chaveDoProgresso = () => (contaAtual ? `${CHAVE}:${contaAtual}` : CHAVE);

const vazio = () => ({
  versao: 1,
  aluno: { nome: '', criadoEm: null },
  fases: {},
  usadas: {},
  certificados: [],
  xp: 0,
});

let cache = null;

function ler() {
  if (cache) return cache;
  try {
    const bruto = localStorage.getItem(chaveDoProgresso());
    cache = bruto ? { ...vazio(), ...JSON.parse(bruto) } : vazio();
  } catch (erro) {
    cache = vazio();
  }
  return cache;
}

/** Troca o progresso em uso quando o aluno da vez muda. */
function usarConta(id) {
  const novo = id || '';
  if (novo === contaAtual) return;
  contaAtual = novo;
  cache = null;
}

function gravar() {
  try {
    localStorage.setItem(chaveDoProgresso(), JSON.stringify(cache));
  } catch (erro) {
    // Aparelho sem espaço ou com armazenamento bloqueado: o app continua
    // funcionando nesta sessão, só não guarda o progresso.
    console.warn('Não foi possível guardar o progresso:', erro);
  }
  // Avisa a sincronização, se este app estiver ligado a um banco. A busca
  // pelo módulo é feita aqui e não lá em cima porque `sincronia` nasce
  // depois deste módulo.
  if (__modulos['sincronia']) __modulos['sincronia'].aoGravar();
}

const progresso = () => ler();

function definirAluno(nome) {
  const p = ler();
  p.aluno.nome = nome.trim();
  if (!p.aluno.criadoEm) p.aluno.criadoEm = new Date().toISOString();
  gravar();
  return p.aluno;
}

function faseDoAluno(numero) {
  const p = ler();
  if (!p.fases[numero]) p.fases[numero] = { licoesLidas: [], jogos: {}, tentativas: [], aprovadoEm: null, melhorNota: 0 };
  return p.fases[numero];
}

function marcarLicaoLida(fase, indice) {
  const f = faseDoAluno(fase);
  if (!f.licoesLidas.includes(indice)) {
    f.licoesLidas.push(indice);
    ler().xp += 5;
    gravar();
  }
}

function registrarJogo(fase, tipo, pontos) {
  const f = faseDoAluno(fase);
  const anterior = f.jogos[tipo] || 0;
  if (pontos > anterior) {
    f.jogos[tipo] = pontos;
    ler().xp += Math.max(0, pontos - anterior);
  }
  gravar();
}

function usadasDaFase(fase) {
  const p = ler();
  return p.usadas[fase] || [];
}

function registrarUsadas(fase, assinaturas) {
  const p = ler();
  // Sem repetir: ao reciclar perguntas antigas a mesma assinatura voltaria a
  // ser gravada, inchando o armazenamento sem mudar nada no sorteio.
  p.usadas[fase] = [...new Set([...(p.usadas[fase] || []), ...assinaturas])];
  gravar();
}

function esquecerUsadas(fase, quantidade) {
  const p = ler();
  p.usadas[fase] = (p.usadas[fase] || []).slice(quantidade);
  gravar();
}

function registrarTentativa(fase, tentativa) {
  const f = faseDoAluno(fase);
  f.tentativas.push(tentativa);
  f.melhorNota = Math.max(f.melhorNota || 0, tentativa.nota);
  if (tentativa.aprovado && !f.aprovadoEm) f.aprovadoEm = tentativa.data;
  ler().xp += tentativa.acertos * 10 + (tentativa.aprovado ? 50 : 0);
  gravar();
  return f;
}

function guardarCertificado(certificado) {
  const p = ler();
  const existente = p.certificados.findIndex((c) => c.fase === certificado.fase);
  if (existente >= 0) p.certificados[existente] = certificado;
  else p.certificados.push(certificado);
  gravar();
}

const certificados = () => ler().certificados;

const faseAprovada = (numero) => Boolean(faseDoAluno(numero).aprovadoEm);

// A fase 1 está sempre aberta; as demais abrem quando a anterior é aprovada.
const faseLiberada = (numero) => numero === 1 || faseAprovada(numero - 1);

function apagarTudo() {
  cache = vazio();
  try { localStorage.removeItem(chaveDoProgresso()); } catch (erro) { /* nada a fazer */ }
}

function exportar() {
  return JSON.stringify(ler(), null, 2);
}

function importar(texto) {
  const dados = JSON.parse(texto);
  if (!dados || typeof dados !== 'object' || !('fases' in dados)) throw new Error('Arquivo de progresso inválido.');
  cache = { ...vazio(), ...dados };
  gravar();
  return cache;
}

const contaEmUso = () => contaAtual;

/** Todos os progressos guardados neste aparelho, por chave. */
function exportarTodosOsProgressos() {
  const saida = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const chave = localStorage.key(i);
      if (chave === CHAVE || (chave && chave.indexOf(`${CHAVE}:`) === 0)) saida[chave] = localStorage.getItem(chave);
    }
  } catch (erro) { /* armazenamento bloqueado */ }

}

function importarTodosOsProgressos(mapa) {
  let entraram = 0;
  try {
    Object.keys(mapa || {}).forEach((chave) => {
      if (chave !== CHAVE && chave.indexOf(`${CHAVE}:`) !== 0) return;
      localStorage.setItem(chave, mapa[chave]);
      entraram++;
    });
  } catch (erro) { /* sem espaço */ }
  cache = null;
  return entraram;
}

return { usarConta, contaEmUso, exportarTodosOsProgressos, importarTodosOsProgressos, progresso, definirAluno, faseDoAluno, marcarLicaoLida, registrarJogo, usadasDaFase, registrarUsadas, esquecerUsadas, registrarTentativa, guardarCertificado, certificados, faseAprovada, faseLiberada, apagarTudo, exportar, importar };

function perguntasIneditas(fase, usadas) {
  const jaVistas = new Set(usadas);
  return universoDaFase(fase).filter((item) => !jaVistas.has(item.assinatura)).length;
}

/**
 * Monta uma prova espalhando as perguntas entre os geradores da fase, para
 * que a avaliação cubra assuntos diferentes e não caia tudo no mesmo ponto.
 */
function montarProva(fase, usadas = [], { quantidade = QUESTOES_POR_PROVA, semente = novaSemente() } = {}) {
  const rnd = criarAleatorio(semente);
  const universo = universoDaFase(fase);
  const jaVistas = new Set(usadas);
  let disponiveis = universo.filter((item) => !jaVistas.has(item.assinatura));
  let reciclou = false;

  // Só quando o aluno já esgotou o repertório inédito da fase é que voltamos
  // a usar as perguntas mais antigas — e o app avisa isso na tela.
  if (disponiveis.length < quantidade) {
    reciclou = true;
    const antigas = usadas.slice(0, Math.max(0, quantidade - disponiveis.length) + 20);
    const conjunto = new Set(antigas);
    disponiveis = disponiveis.concat(universo.filter((item) => conjunto.has(item.assinatura)));
  }

  // Agrupa por gerador e vai pegando um de cada, em rodadas.
  const porGerador = new Map();
  for (const item of embaralhar(disponiveis, rnd)) {
    if (!porGerador.has(item.gerador.id)) porGerador.set(item.gerador.id, []);
    porGerador.get(item.gerador.id).push(item);
  }
  const filas = embaralhar([...porGerador.values()], rnd);
  const escolhidos = [];
  let rodada = 0;
  while (escolhidos.length < quantidade && rodada < 200) {
    let pegouAlgum = false;
    for (const fila of filas) {
      if (escolhidos.length >= quantidade) break;
      if (fila.length > rodada) { escolhidos.push(fila[rodada]); pegouAlgum = true; }
    }
    if (!pegouAlgum) break;
    rodada++;
  }

  const questoes = embaralhar(escolhidos, rnd).slice(0, quantidade).map((item, indice) => {
    const montada = item.gerador.montar(item.variante, rnd);
    return {
      indice,
      assinatura: item.assinatura,
      geradorId: item.gerador.id,
      enunciado: montada.enunciado,
      html: montada.html || '',
      alternativas: montada.alternativas,
      correta: montada.correta,
      explicacao: montada.explicacao,
      referencia: montada.referencia,
    };
  });

  return { fase, semente, reciclou, questoes, ineditasRestantes: universo.length - jaVistas.size };
}

function corrigir(prova, respostas) {
  const detalhes = prova.questoes.map((q, i) => ({
    questao: q,
    resposta: respostas[i] ?? null,
    certa: respostas[i] === q.correta,
  }));
  const acertos = detalhes.filter((d) => d.certa).length;
  const nota = Math.round((acertos / prova.questoes.length) * 100);
  return { detalhes, acertos, total: prova.questoes.length, nota, aprovado: nota >= NOTA_MINIMA };
}

return { QUESTOES_POR_PROVA, NOTA_MINIMA, perguntasIneditas, montarProva, corrigir };
})();

// Impressão: joga o certificado numa área que só existe no papel e chama a
// impressora do aparelho (no celular, dá para salvar em PDF por ali mesmo).
function imprimirCertificado(c) {
  const area = document.getElementById('area-impressao');
  area.innerHTML = svgDoCertificado(c);
  window.print();
}

function baixarCertificado(c) {
  const svg = svgDoCertificado(c);
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const nome = `certificado-fase-${c.fase}-${c.nome.replace(/\s+/g, '-').toLowerCase()}.png`;
  const imagem = new Image();
  imagem.onload = () => {
    const tela = document.createElement('canvas');
    tela.width = 2246;
    tela.height = 1588;
    const pincel = tela.getContext('2d');
    pincel.fillStyle = '#ffffff';
    pincel.fillRect(0, 0, tela.width, tela.height);
    pincel.drawImage(imagem, 0, 0, tela.width, tela.height);
    URL.revokeObjectURL(url);
    tela.toBlob((png) => salvarArquivo(nome, png), 'image/png');
  };
  imagem.onerror = () => {
    URL.revokeObjectURL(url);
    imprimirCertificado(c);
  };
  imagem.src = url;
}

return { dataPorExtenso, montarCertificado, svgDoCertificado, imprimirCertificado, baixarCertificado };

// ------------------------------------------------------------- jogo: memória
function jogoMemoria(config, alvo, aoTerminar) {
  // Pares cadastrados pelo encarregado têm prioridade sobre os baralhos fixos.
  const baralho = Array.isArray(config.pares) && config.pares.length >= 2
    ? { pares: config.pares.slice(0, 8) }
    : (BARALHOS[config.baralho] || BARALHOS.figuras);
  const rnd = criarAleatorio(novaSemente());
  const cartas = embaralhar(baralho.pares.flatMap(([a, b], i) => [
    { par: i, face: a }, { par: i, face: b },
  ]), rnd);
  let viradas = [];
  let encontrados = 0;
  let jogadas = 0;
  let travado = false;

  alvo.innerHTML = `<p class="instrucao">Toque nas cartas e junte cada par. Quanto menos tentativas, maior a pontuação.</p>
    <div class="placar-jogo"><span id="jogadas">0 tentativas</span><span id="pares">0 de ${baralho.pares.length} pares</span></div>
    <div class="grade-memoria"></div>`;
  const grade = alvo.querySelector('.grade-memoria');

  cartas.forEach((carta, indice) => {
    const botao = criar(`<button class="carta" data-indice="${indice}" aria-label="carta ${indice + 1}">
      <span class="verso">♪</span><span class="frente">${carta.face}</span></button>`);
    botao.addEventListener('click', () => {
      if (travado || botao.classList.contains('aberta') || botao.classList.contains('achada')) return;
      botao.classList.add('aberta');
      viradas.push({ botao, carta });
      if (viradas.length < 2) return;
      jogadas++;
      alvo.querySelector('#jogadas').textContent = `${jogadas} tentativa${jogadas > 1 ? 's' : ''}`;
      const [a, b] = viradas;
      if (a.carta.par === b.carta.par) {
        a.botao.classList.add('achada');
        b.botao.classList.add('achada');
        encontrados++;
        efeito('acerto');
        alvo.querySelector('#pares').textContent = `${encontrados} de ${baralho.pares.length} pares`;
        viradas = [];
        if (encontrados === baralho.pares.length) {
          efeito('vitoria');
          const pontos = Math.max(20, 100 - Math.max(0, jogadas - baralho.pares.length) * 8);
          aoTerminar(pontos, `${jogadas} tentativas para ${baralho.pares.length} pares`);
        }
      } else {
        travado = true;
        setTimeout(() => {
          a.botao.classList.remove('aberta');
          b.botao.classList.remove('aberta');
          viradas = [];
          travado = false;
        }, 750);
      }
    });
    grade.appendChild(botao);
  });
}

// -------------------------------------------------- jogo: leitura no pentagrama
function jogoPentagrama(config, alvo, aoTerminar) {
  const claves = config.claves || ['sol'];
  const rnd = criarAleatorio(novaSemente());
  const segundos = 60;
  let restante = segundos;
  let acertos = 0;
  let erros = 0;
  let atual = null;

  alvo.innerHTML = `<p class="instrucao">Diga o nome da nota antes que o tempo acabe.</p>
    <div class="placar-jogo"><span id="relogio">${segundos}s</span><span id="pontos">0 acertos</span></div>
    <div class="palco"></div><div class="botoes-notas"></div>`;
  const palco = alvo.querySelector('.palco');
  const botoes = alvo.querySelector('.botoes-notas');

  const sortearNota = () => {
    const clave = sortear(claves, rnd);
    const posicao = inteiro(rnd, -1, 10);
    const nota = T.notaDaPosicao(clave, posicao);
    atual = { clave, nota };
    palco.innerHTML = `<div class="etiqueta-clave">${T.CLAVES[clave].nome}</div>
      ${pentagrama({ clave, notas: [{ ...nota, figura: 'semibreve' }], largura: 280 })}`;
  };

  T.LETRAS.forEach((letra) => {
    const botao = criar(`<button class="botao-nota">${letra}</button>`);
    botao.addEventListener('click', () => {
      if (restante <= 0) return;
      if (letra === atual.nota.letra) {
        acertos++;
        efeito('acerto');
        botao.classList.add('certo');
        tocarNota(atual.nota.letra, atual.nota.oitava);
      } else {
        erros++;
        efeito('erro');
        botao.classList.add('errado');
      }
      setTimeout(() => botao.classList.remove('certo', 'errado'), 250);
      alvo.querySelector('#pontos').textContent = `${acertos} acerto${acertos === 1 ? '' : 's'}`;
      sortearNota();
    });
    botoes.appendChild(botao);
  });

  sortearNota();
  const relogio = setInterval(() => {
    restante--;
    alvo.querySelector('#relogio').textContent = `${restante}s`;
    if (restante <= 0) {
      clearInterval(relogio);
      efeito('vitoria');
      aoTerminar(Math.max(0, acertos * 8 - erros * 4), `${acertos} acertos e ${erros} erros em 1 minuto`);
    }
  }, 1000);
  alvo.dataset.limpar = 'sim';
  alvo._parar = () => clearInterval(relogio);
}

// ------------------------------------------------------- jogo: fecha o compasso
function jogoRitmo(config, alvo, aoTerminar) {
  const rnd = criarAleatorio(novaSemente());
  const formulas = config.composto ? ['6/8', '9/8', '12/8'] : ['2/4', '3/4', '4/4'];
  const paleta = config.comPonto
    ? ['seminima', 'seminima.', 'minima', 'minima.', 'colcheia', 'colcheia.', 'semicolcheia']
    : ['semibreve', 'minima', 'seminima', 'colcheia', 'semicolcheia'];
  const rodadasTotais = 5;
  let rodada = 0;
  let acertos = 0;
  let erros = 0;
  let escritas = [];
  let alvoTempos = 0;
  let formula = '';

  const valorDe = (id) => {
    const pontuada = id.endsWith('.');
    const base = T.figuraPorId(pontuada ? id.slice(0, -1) : id);
    return pontuada ? base.duracao * 1.5 : base.duracao;
  };
  const soma = () => escritas.reduce((total, id) => total + valorDe(id), 0);

  alvo.innerHTML = `<p class="instrucao">Escolha as figuras que fecham o compasso exatamente — sem sobrar nem faltar.</p>
    <div class="placar-jogo"><span id="rodada">Rodada 1 de ${rodadasTotais}</span><span id="soma"></span></div>
    <div class="palco"></div>
    <div class="paleta-figuras"></div>
    <div class="acoes-jogo">
      <button class="botao secundario" id="desfazer">Apagar a última</button>
      <button class="botao" id="conferir">Conferir</button>
    </div>`;
  const palco = alvo.querySelector('.palco');
  const paletaEl = alvo.querySelector('.paleta-figuras');

  const desenhar = () => {
    palco.innerHTML = pentagrama({
      clave: 'sol', compasso: formula, largura: 320,
      notas: escritas.map((id) => ({
        letra: 'Si', oitava: 4, figura: id.endsWith('.') ? id.slice(0, -1) : id, pontuada: id.endsWith('.'),
      })),
    });
    alvo.querySelector('#soma').textContent = `${T.fracaoBonita(soma())} de ${T.fracaoBonita(alvoTempos)}`;
  };

  const novaRodada = () => {
    rodada++;
    if (rodada > rodadasTotais) {
      efeito('vitoria');
      aoTerminar(Math.max(0, acertos * 20 - erros * 5), `${acertos} de ${rodadasTotais} compassos fechados`);
      return;
    }
    formula = sortear(formulas, rnd);
    const [cima, baixo] = formula.split('/').map(Number);
    alvoTempos = cima * T.FIGURAS.find((f) => f.equivalencia === baixo).duracao;
    escritas = [];
    alvo.querySelector('#rodada').textContent = `Rodada ${rodada} de ${rodadasTotais}`;
    desenhar();
  };

  paleta.forEach((id) => {
    const pontuada = id.endsWith('.');
    const base = pontuada ? id.slice(0, -1) : id;
    const botao = criar(`<button class="botao-figura" title="${T.figuraPorId(base).nome}${pontuada ? ' pontuada' : ''}">
      ${figuraSolta(base, { pontuada, tamanho: 46 })}</button>`);
    botao.addEventListener('click', () => {
      if (soma() + valorDe(id) > alvoTempos + 1e-9) {
        efeito('erro');
        botao.classList.add('errado');
        setTimeout(() => botao.classList.remove('errado'), 250);
        return;
      }
      escritas.push(id);
      tocarNota('Si', 4, { duracao: Math.min(0.5, valorDe(id) * 0.4) });
      desenhar();
    });
    paletaEl.appendChild(botao);
  });

  alvo.querySelector('#desfazer').addEventListener('click', () => { escritas.pop(); desenhar(); });
  alvo.querySelector('#conferir').addEventListener('click', () => {
    if (Math.abs(soma() - alvoTempos) < 1e-9) { acertos++; efeito('acerto'); } else { erros++; efeito('erro'); }
    novaRodada();
  });

  novaRodada();
}

// ------------------------------------------------------------- jogo: teclado
function jogoTeclado(config, alvo, aoTerminar) {
  const rnd = criarAleatorio(novaSemente());
  const rodadasTotais = config.modo === 'escala' ? 3 : 8;
  let rodada = 0;
  let acertos = 0;
  let erros = 0;
  let esperado = [];
  let passo = 0;
  let baseAtual = null;

  const quadro = alvo.querySelector('.quadro-teclado');
  const instrucao = alvo.querySelector('.instrucao');

    const semitom = T.semitomDaNota(n);
    const brancas = { 0: 'Dó', 2: 'Ré', 4: 'Mi', 5: 'Fá', 7: 'Sol', 9: 'Lá', 11: 'Si' };
    const pretas = { 1: 'Dó#', 3: 'Ré#', 6: 'Fá#', 8: 'Sol#', 10: 'Lá#' };

  const desenhar = (marcadas = {}) => {
